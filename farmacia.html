<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Azullab Farmacia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   PAPEL FISCAL · sistema de diseño de Cuadre
   Capa 1: tokens (papel / carbón). Capa 2: color del cliente (Azullab).
   Capa 3: componentes aplicados a esta maqueta.
   Diseño: mesa → separadores de archivador → carpeta abierta → hojas con folio.
   ===================================================================== */
:root{
  --mesa:#e8ebef; --hoja:#ffffff; --hoja-alt:#f4f6f9; --renglon:#cbd8ea; --linea:#6f7d94; --margen:#d2453b;
  --tinta:#1a2440; --tinta-2:#4e5a73; --tinta-3:#5d6882;
  --sello-verde:#1f7a43; --sello-verde-suave:#e3f3e8; --sello-rojo:#b3261e; --sello-rojo-suave:#fbe6e4;
  --sello-ambar:#8a5300; --sello-ambar-suave:#fdf0d8; --sello-violeta:#5b3aa6; --sello-violeta-suave:#efe9fb;
  --foco:#1a2440;
  --sombra-hoja:0 1px 2px rgba(26,36,64,.08),0 0 0 1px rgba(26,36,64,.06);
  --sombra-pila:0 1px 2px rgba(26,36,64,.08),0 0 0 1px rgba(26,36,64,.06),5px 5px 0 -1px #ffffff,5px 5px 0 0 #cbd8ea;
  --sombra-flotante:0 18px 48px rgba(13,18,32,.28);
  /* Colores del Grupo Empresarial Azullab: turquesa, azul y azul marino */
  --acento:#00d2d6; --on-acento:#0b1450; --acento-tinta:#2a30d6; --acento-suave:#e4f9fa; --marca:#0e1752;
  --font-forma:"Archivo","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-maquina:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --alto-renglon:40px;
  /* alias que usa el contenido de la maqueta */
  --ink:var(--tinta); --ink-2:var(--tinta-2); --ink-3:var(--tinta-3); --line:var(--renglon); --azul:var(--acento-tinta);
  --celeste-50:var(--acento-suave); --ok:var(--sello-verde); --warn:var(--sello-ambar); --bad:var(--sello-rojo);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --mesa:#0d1220; --hoja:#161d2e; --hoja-alt:#1c2438; --renglon:#2a3650; --linea:#6b7a95; --margen:#e06a5f;
  --tinta:#e7ecf5; --tinta-2:#a3aec4; --tinta-3:#8794ae;
  --sello-verde:#5fd08e; --sello-verde-suave:#12301f; --sello-rojo:#ff8a7f; --sello-rojo-suave:#3a1714;
  --sello-ambar:#f0b54d; --sello-ambar-suave:#33260d; --sello-violeta:#b9a2ff; --sello-violeta-suave:#251a45;
  --foco:#e7ecf5;
  --sombra-hoja:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06);
  --sombra-pila:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06),5px 5px 0 -1px #161d2e,5px 5px 0 0 #2a3650;
  --sombra-flotante:0 18px 48px rgba(0,0,0,.6);
  --acento:#22e0e3; --on-acento:#06092a; --acento-tinta:#9a9eff; --acento-suave:#10294a; --marca:#0e1752;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --mesa:#0d1220; --hoja:#161d2e; --hoja-alt:#1c2438; --renglon:#2a3650; --linea:#6b7a95; --margen:#e06a5f;
  --tinta:#e7ecf5; --tinta-2:#a3aec4; --tinta-3:#8794ae;
  --sello-verde:#5fd08e; --sello-verde-suave:#12301f; --sello-rojo:#ff8a7f; --sello-rojo-suave:#3a1714;
  --sello-ambar:#f0b54d; --sello-ambar-suave:#33260d; --sello-violeta:#b9a2ff; --sello-violeta-suave:#251a45;
  --foco:#e7ecf5;
  --sombra-hoja:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06);
  --sombra-pila:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06),5px 5px 0 -1px #161d2e,5px 5px 0 0 #2a3650;
  --sombra-flotante:0 18px 48px rgba(0,0,0,.6);
  --acento:#22e0e3; --on-acento:#06092a; --acento-tinta:#9a9eff; --acento-suave:#10294a; --marca:#0e1752;
  color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--mesa);color:var(--tinta);font-family:var(--font-forma);font-size:15px;line-height:1.47}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.num{font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;line-height:28px;font-weight:700}
h2{font-size:17px;line-height:22px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
svg.i{width:18px;height:18px;flex:none}

/* ---------- Entrada ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--mesa)}
.login .brandside{background:var(--acento);color:var(--on-acento);display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding-block:44px;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:56px;position:relative;
  -webkit-mask:linear-gradient(#000 0 0) left/calc(100% - 9px) 100% no-repeat,radial-gradient(circle 6px at 100% 8px,transparent 98%,#000) right top/9px 16px repeat-y;
          mask:linear-gradient(#000 0 0) left/calc(100% - 9px) 100% no-repeat,radial-gradient(circle 6px at 100% 8px,transparent 98%,#000) right top/9px 16px repeat-y}
.login .brandside h1{font-size:clamp(30px,3.6vw,46px);line-height:1.04;font-weight:800;letter-spacing:-.015em;max-width:15ch;color:var(--on-acento)}
.login .brandside p{max-width:44ch;color:var(--on-acento);font-size:16px;line-height:24px}
.login .facts{display:flex;flex-wrap:wrap;gap:8px}
.login .facts span{border:1.5px solid var(--on-acento);color:var(--on-acento);padding:3px 9px;border-radius:3px;font-stretch:80%;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.login .formside{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login form{width:100%;max-width:420px;display:grid;gap:14px;background:var(--hoja);box-shadow:var(--sombra-pila);border-radius:2px;padding:22px 22px 24px}
.login .firma{font-size:12.5px;color:var(--tinta-3)}
.login .firma b{color:var(--tinta-2);font-weight:800}
.field{display:grid;gap:3px;padding:7px 10px 8px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);min-width:0}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--foco)}
.field label{font-size:11.5px;line-height:14px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3)}
.field .input{border:0;padding:0;min-height:26px;background:transparent;box-shadow:none;font-size:16px;border-radius:0}
.field .input:focus{box-shadow:none}
.field:has(.roles){border:0;padding:0;background:none;box-shadow:none}
.roles{display:flex;gap:4px;border-bottom:1px solid var(--renglon);overflow-x:auto}
.roles button{border:1px solid transparent;border-bottom:0;background:var(--hoja-alt);border-radius:8px 8px 0 0;padding:0 14px;min-height:42px;margin-bottom:-1px;font-weight:600;color:var(--tinta-3);white-space:nowrap}
.roles button.on{background:var(--hoja);border-color:var(--renglon);color:var(--tinta)}
.input{width:100%;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:10px 12px;min-height:44px}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--foco)}

/* ---------- Mesa, separadores y carpeta ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--mesa);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:10px;padding:18px 18px 8px}
.side .nav{display:grid;gap:3px;padding:0 0 16px 10px}
.side .grp{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3);padding:14px 14px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.side .nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 14px;color:var(--tinta-2);text-decoration:none;border:1px solid transparent;border-right:0;border-radius:8px 0 0 8px;font-size:15px}
.side .nav a:hover{background:var(--hoja-alt);color:var(--tinta)}
.side .nav a.on{background:var(--hoja-alt);color:var(--tinta);font-weight:700;border-color:var(--renglon)}
.side .nav a .cod{margin-left:auto;font-family:var(--font-maquina);font-size:11px;color:var(--tinta-3);font-weight:400}
.side .foot{margin-top:auto;padding:14px 18px;border-top:1px dashed var(--linea);font-size:13px;color:var(--tinta-3)}
.side .foot .firma{margin-top:12px;font-size:11.5px}
.side .foot .firma b{font-weight:800;color:var(--tinta-2)}
.main{min-width:0;display:flex;flex-direction:column;background:var(--hoja-alt)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hoja-alt);border-bottom:3px double var(--renglon);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hoja-alt)}
.top .ttl{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1;flex-wrap:wrap}
.top .ttl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .folio{font-family:var(--font-maquina);font-size:12px;color:var(--tinta-3);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:4px 10px;font-size:13px;color:var(--tinta-2);min-height:34px;white-space:nowrap}
.chip b{font-family:var(--font-maquina);font-weight:600;color:var(--tinta)}
button.chip:hover{border-color:var(--tinta)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sello-verde);flex:none}
.chip.off{background:var(--sello-ambar-suave);border-color:var(--sello-ambar);color:var(--sello-ambar);font-weight:700}
.chip.off .dot{background:var(--sello-ambar)}
.menu-btn{display:none;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;width:44px;height:44px;align-items:center;justify-content:center}
.offbar{background:var(--sello-ambar-suave);color:var(--tinta);border-bottom:1px dashed var(--sello-ambar);padding-block:9px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.offbar svg{color:var(--sello-ambar)}
.offbar b{color:var(--sello-ambar)}
.content{padding-block:22px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.phase{font-family:var(--font-forma);font-stretch:80%;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:2px 7px;white-space:nowrap}
.phase.f1{color:var(--sello-violeta);background:var(--sello-violeta-suave)}
.phase.f2{color:var(--sello-verde);background:var(--sello-verde-suave)}
.phase.mod{color:var(--sello-ambar);background:var(--sello-ambar-suave)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--linea);border-radius:4px;font-size:14px;background:var(--hoja);color:var(--tinta-3)}
.step b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--hoja-alt);font-family:var(--font-maquina);font-size:12px;color:var(--tinta-2)}
.step.done{border-color:var(--sello-verde);color:var(--sello-verde);background:var(--sello-verde-suave)}
.step.done b{background:var(--sello-verde);color:var(--hoja)}
.step.now{border-color:var(--acento-tinta);color:var(--tinta);box-shadow:inset 0 0 0 1px var(--acento-tinta)}
.step.now b{background:var(--acento);color:var(--on-acento)}
.emp{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--acento-suave);color:var(--acento-tinta);font-weight:700;font-size:13px;flex:none;border:1px solid var(--linea)}
tr.sel td{background:var(--acento-suave)}
tr[data-act]{cursor:pointer}
.lead{color:var(--tinta-2);max-width:75ch}

/* ---------- Hojas ---------- */
.panel{background:var(--hoja);border-radius:2px;box-shadow:var(--sombra-hoja);min-width:0}
.panel.doc{box-shadow:var(--sombra-pila)}
.panel>.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px 10px;border-bottom:1px solid var(--renglon)}
.pfolio{display:block;font-family:var(--font-maquina);font-size:11px;line-height:14px;font-weight:400;color:var(--tinta-3);margin-bottom:3px;letter-spacing:0}
.panel>.bd{padding:16px;min-width:0}
.panel>.bd.flush{padding:0}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* Planilla de cifras: casillas unidas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--hoja);border:1px solid var(--linea);border-radius:4px;overflow:hidden;box-shadow:var(--sombra-hoja)}
.kpi{background:var(--hoja);box-shadow:0 0 0 1px var(--linea);padding:10px 14px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi .l{font-size:11.5px;line-height:14px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3)}
.kpi .v{font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-size:27px;line-height:34px;font-weight:600;letter-spacing:-.01em}
.kpi .s{font-size:13px;color:var(--tinta-2)}
.kpi .s.num{font-size:12.5px}
.kpi.hero{background:var(--acento-suave)}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.kpis.k3{grid-template-columns:minmax(0,1fr)}}
.kpis.k3 .v{font-size:24px}
.kpi.hero .l{color:var(--acento-tinta)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);color:var(--tinta);font-weight:600;font-size:15px;box-shadow:0 2px 0 0 var(--renglon);transition:transform .06s ease,box-shadow .06s ease}
.btn:hover{border-color:var(--tinta-2)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 0 var(--renglon)}
.btn.primary{background:var(--acento);border-color:var(--acento);color:var(--on-acento);box-shadow:0 2px 0 0 var(--tinta)}
.btn.primary:hover{border-color:var(--tinta)}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--tinta-3)}
.small{font-size:13px}

/* ---------- Libro ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--tinta-3);font-size:11.5px;letter-spacing:.02em;padding:10px 12px 8px;border-bottom:3px double var(--renglon);white-space:nowrap;background:var(--hoja)}
td{padding:7px 12px;height:var(--alto-renglon);border-bottom:1px solid var(--renglon);vertical-align:middle}
th:first-child,td:first-child{border-right:4px double var(--margen)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:3px double var(--tinta-2);border-bottom:0;background:var(--hoja)}
tfoot td.r span{text-decoration:underline double;text-underline-offset:5px;text-decoration-thickness:1px}
.base-legal{font-size:12.5px;color:var(--tinta-3);padding:10px 16px;border-top:1px dashed var(--renglon)}
.pin{font-family:var(--font-maquina);letter-spacing:.5em;font-size:20px}
.login .aviso-off{width:100%;max-width:420px;background:var(--sello-ambar-suave);border:1px dashed var(--sello-ambar);border-radius:4px;padding:10px 14px;font-size:14px;color:var(--tinta);display:flex;gap:10px;align-items:flex-start}
.login .aviso-off b{color:var(--sello-ambar)}
.login .aviso-off svg{color:var(--sello-ambar);margin-top:2px}
td.r,th.r{text-align:right;white-space:nowrap}
td.r{font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
td.num{white-space:nowrap}
tbody tr:hover td{background:var(--acento-suave)}
.pill{--c:var(--tinta-2);--cs:var(--hoja-alt);display:inline-flex;align-items:center;gap:4px;padding:2px 7px;color:var(--c);background:var(--cs);border:1px solid var(--c);border-radius:3px;font-family:var(--font-forma);font-stretch:80%;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill svg.i{width:14px;height:14px}
.pill.ok{--c:var(--sello-verde);--cs:var(--sello-verde-suave)}
.pill.warn{--c:var(--sello-ambar);--cs:var(--sello-ambar-suave)}
.pill.bad{--c:var(--sello-rojo);--cs:var(--sello-rojo-suave)}
.pill.info{--c:var(--sello-violeta);--cs:var(--sello-violeta-suave)}
.iva{font-family:var(--font-maquina);font-size:11.5px;font-weight:500;border-radius:3px;padding:0 4px;border:1px solid var(--linea);color:var(--tinta-2);white-space:nowrap}
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 16px;min-height:var(--alto-renglon);border-bottom:1px solid var(--renglon)}
.list .it:last-child{border-bottom:0}
.list .it .t{min-width:0;flex:1}
.list .it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--renglon)}
.stat:last-child{border-bottom:0}

/* ---------- Gráficos ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--renglon)}
.chart .bar.today{fill:var(--acento)}
.chart .gl{stroke:var(--renglon);stroke-width:1;stroke-dasharray:3 3}
.chart text{fill:var(--tinta-3);font-size:11.5px;font-family:var(--font-maquina)}
.chart text.v{fill:var(--tinta);font-weight:600}
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:14px}
.hbar .trk{height:10px;background:var(--hoja-alt);border:1px solid var(--renglon)}
.hbar .fill{height:100%;background:var(--acento)}
.hbar .val{text-align:right;font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- Caja ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:20px;align-items:start}
#cartbox{position:sticky;top:96px;filter:drop-shadow(0 1px 1px rgba(26,36,64,.14)) drop-shadow(0 6px 14px rgba(26,36,64,.08))}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tinta-3)}
.search .input{padding-left:42px;min-height:52px;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cats button{border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:5px 12px;white-space:nowrap;font-size:14px;min-height:36px;color:var(--tinta-2)}
.cats button.on{background:var(--tinta);color:var(--hoja);border-color:var(--tinta);font-weight:600}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.prod{text-align:left;border:1px solid var(--renglon);background:var(--hoja);border-radius:2px;padding:12px 12px 10px;display:grid;gap:6px;min-height:136px;align-content:start;box-shadow:0 1px 0 0 var(--renglon)}
.prod:hover{border-color:var(--acento-tinta)}
.prod:active{transform:translateY(1px)}
.prod .nm{font-weight:600;line-height:1.25}
.prod .meta{font-size:12.5px;color:var(--tinta-3)}
.prod .pr{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:auto;border-top:1px dashed var(--renglon);padding-top:8px}
.prod .pr b{font-family:var(--font-maquina);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.prod .pr span{font-family:var(--font-maquina);font-size:11.5px;color:var(--tinta-3);font-variant-numeric:tabular-nums}
.prod .tags{display:flex;gap:4px;flex-wrap:wrap}
.prods .alt-h{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--tinta-2);padding:10px 2px 0;border-top:1px dashed var(--renglon);margin-top:2px}
.prods .alt-h b{color:var(--tinta)}
.prod.agotado{border-style:dashed;background:var(--hoja-alt)}
.prod.alt{border-color:var(--acento-tinta)}
.chip.alerta{background:var(--sello-rojo-suave);border-color:var(--sello-rojo);color:var(--sello-rojo);font-weight:700;cursor:pointer}
.secs{display:flex;flex-wrap:wrap;gap:6px}
.sec{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);border-radius:4px;padding:4px 10px;background:var(--hoja);font-size:14px;min-height:34px}
.sec small{font-family:var(--font-maquina);color:var(--tinta-3)}
.fac{display:grid;gap:10px;border:1px solid var(--renglon);border-radius:4px;padding:12px 14px;background:var(--hoja-alt)}
.vendln{display:flex;align-items:center;gap:8px}
.vendln select{min-height:36px}
.cart{display:grid;background:var(--hoja);padding-block:10px 12px;
  -webkit-mask:radial-gradient(circle 5px at 7px 0,transparent 98%,#000) top left/14px 51% repeat-x,radial-gradient(circle 5px at 7px 100%,transparent 98%,#000) bottom left/14px 51% repeat-x;
          mask:radial-gradient(circle 5px at 7px 0,transparent 98%,#000) top left/14px 51% repeat-x,radial-gradient(circle 5px at 7px 100%,transparent 98%,#000) bottom left/14px 51% repeat-x}
.cart>.hd{border-bottom:1px dashed var(--linea)}
.cart .hd .muted{font-family:var(--font-maquina);font-size:12px}
.cart .items{max-height:340px;overflow-y:auto}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 16px;border-bottom:1px dashed var(--renglon)}
.ci .nm{font-weight:600;font-size:14.5px}
.ci .sub{font-size:12.5px;color:var(--tinta-3)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--linea);border-radius:4px;overflow:hidden}
.qty button{width:36px;height:34px;border:0;background:var(--hoja);display:flex;align-items:center;justify-content:center}
.qty button:hover{background:var(--hoja-alt)}
.qty span{min-width:30px;text-align:center;font-family:var(--font-maquina);font-weight:600}
.tot{padding:12px 16px 4px;display:grid;gap:4px;font-size:14px}
.tot .ln{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
.tot .ln span:first-child{font-family:var(--font-forma)}
.tot .grand{font-size:21px;font-weight:600;padding-top:8px;border-top:3px double var(--tinta-2);margin-top:6px}
.empty{padding:28px 16px;text-align:center;color:var(--tinta-3);display:grid;gap:6px;justify-items:center}
.empty b{color:var(--tinta-2)}

/* ---------- Modales ---------- */
.modal{position:fixed;inset:0;background:rgba(10,15,28,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--hoja);border-radius:2px;width:100%;max-width:640px;max-height:100%;overflow-y:auto;box-shadow:var(--sombra-flotante)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:3px double var(--renglon);position:sticky;top:0;background:var(--hoja);z-index:2}
.sheet .bd{padding:18px 20px;display:grid;gap:14px}
.x{border:0;background:transparent;width:44px;height:44px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--tinta-2)}
.x:hover{background:var(--hoja-alt)}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.methods button{border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:9px 10px;text-align:left;display:grid;gap:2px;min-height:58px;box-shadow:0 2px 0 0 var(--renglon)}
.methods button:hover{border-color:var(--acento-tinta)}
.methods button:active{transform:translateY(2px);box-shadow:none}
.methods button b{font-weight:600}
.methods button small{color:var(--tinta-3);font-size:12px}
.payln{display:grid;grid-template-columns:minmax(0,1fr) 170px 44px;gap:8px;align-items:center;padding-bottom:8px;border-bottom:1px dashed var(--renglon)}
.payln .input{min-height:44px;text-align:right;font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
.monto{display:flex;align-items:center;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);min-width:0}
.monto:focus-within{box-shadow:inset 0 0 0 2px var(--foco)}
.monto span{padding-left:10px;font-family:var(--font-maquina);font-weight:600;color:var(--tinta-3);font-size:13px}
.monto .input{border:0;background:transparent;min-width:0;padding-left:6px}
.monto .input:focus{box-shadow:none}
.vuelto{font-family:var(--font-forma);font-size:13px;color:var(--sello-ambar);font-weight:700}
.due{border-radius:4px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;font-family:var(--font-maquina);font-variant-numeric:tabular-nums;min-height:64px}
.due.pend{background:var(--sello-ambar-suave);color:var(--sello-ambar);border:1px dashed var(--sello-ambar)}
.due.done{background:var(--hoja);color:var(--tinta);border:1px dashed var(--renglon)}

/* ---------- Sellos ---------- */
.sello{--c:var(--sello-violeta);display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:6px 14px 5px;color:var(--c);border:2px solid var(--c);border-radius:3px;box-shadow:inset 0 0 0 2px var(--hoja),inset 0 0 0 3px var(--c);font-family:var(--font-forma);font-stretch:75%;font-weight:800;font-size:16px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-4deg);opacity:.92;white-space:nowrap;background:transparent}
.sello small{font-family:var(--font-maquina);font-stretch:100%;font-weight:500;font-size:10.5px;line-height:13px;letter-spacing:0}
.sello.verde{--c:var(--sello-verde)} .sello.rojo{--c:var(--sello-rojo)} .sello.ambar{--c:var(--sello-ambar)}
.sello.grande{font-size:24px;line-height:26px;padding:9px 18px 7px;border-width:3px;box-shadow:inset 0 0 0 3px var(--hoja),inset 0 0 0 5px var(--c)}
.sello.estampar{animation:estampar .24s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes estampar{from{transform:rotate(-4deg) scale(1.7);opacity:0}70%{opacity:.95}to{transform:rotate(-4deg) scale(1);opacity:.92}}

/* ---------- Ticket fiscal ---------- */
.printer{background:var(--tinta);border-radius:6px 6px 2px 2px;height:20px;position:relative;margin:0 auto;max-width:330px}
.printer::after{content:"";position:absolute;left:24px;right:24px;bottom:4px;height:4px;background:#05080f;border-radius:2px;opacity:.7}
.tkwrap{overflow:hidden;max-width:300px;margin:0 auto;position:relative;--hoja:#ffffff;--sello-verde:#1f7a43;--sello-rojo:#b3261e;--sello-violeta:#5b3aa6}
.ticket{background:#ffffff;color:#1a2440;font-family:var(--font-maquina);font-size:11.5px;line-height:1.5;padding:14px 14px 24px;margin:0;white-space:pre;box-shadow:0 6px 16px rgba(0,0,0,.18);position:relative;overflow-x:auto;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) bottom/12px 8px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) bottom/12px 8px repeat-x}
.ticket.printing{animation:feed 1.6s steps(16) both}
@keyframes feed{from{transform:translateY(-100%)}to{transform:none}}
.tk-sello{position:absolute;right:22px;bottom:22px;z-index:1}
.qrbox{display:flex;gap:12px;align-items:center;border:1px dashed var(--renglon);border-radius:4px;padding:10px 12px;background:var(--hoja)}
.qrbox svg{width:72px;height:72px;flex:none;background:#fff;padding:4px;border-radius:2px}
.qrbox .num{font-size:13px}
.envio{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--tinta-2)}
.envio .pill{font-size:11px}
.tk-sello.estampar{animation-delay:1.65s}

/* ---------- Aviso / toast ---------- */
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--hoja);padding:12px 18px;border-radius:4px;z-index:80;box-shadow:var(--sombra-flotante);font-weight:600;max-width:calc(100% - 32px)}

/* ---------- Fase 2: tienda móvil ---------- */
.phone{width:290px;max-width:100%;border:10px solid #1a2440;border-radius:34px;overflow:hidden;background:#fff;color:#0B2E45;margin:0 auto}
.phone .ph-top{background:#00d2d6;color:#0b1450;padding:14px 14px 12px;display:grid;gap:10px}
.phone .ph-top b,.phone .ph-top span{color:#0b1450!important}
.phone .ph-search{background:#fff;color:#5d6882;border-radius:4px;padding:8px 12px;font-size:.82rem}
.phone .ph-cats{display:flex;gap:6px;padding:10px 12px;overflow:hidden}
.phone .ph-cats span{background:#e4f9fa;color:#2a30d6;border-radius:3px;padding:3px 9px;font-size:.74rem;white-space:nowrap;font-weight:700}
.phone .ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 14px}
.phone .ph-card{border:1px solid #cbd8ea;border-radius:2px;padding:8px;display:grid;gap:4px;font-size:.76rem}
.phone .ph-img{height:56px;border-radius:2px;background:#e4f9fa;display:flex;align-items:center;justify-content:center;color:#2a30d6}
.phone .ph-card b{font-size:.86rem;font-family:var(--font-maquina)}
.phone .ph-btn{background:#1f7a43;color:#fff;border-radius:3px;text-align:center;padding:4px;font-weight:700;font-size:.72rem}
.wa{background:var(--sello-verde-suave);border:1px solid var(--renglon);border-radius:4px;padding:12px 14px;font-size:14px;display:grid;gap:6px;max-width:440px}

/* ---------- Sin conexión y alcance ---------- */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:st}
.flow .st{border-radius:2px;padding:12px 14px 14px;display:grid;gap:6px;background:var(--hoja);box-shadow:var(--sombra-hoja);align-content:start}
.flow .st::before{counter-increment:st;content:"Paso " counter(st);font-family:var(--font-maquina);font-size:11px;color:var(--tinta-3);border-bottom:1px dashed var(--renglon);padding-bottom:6px}
.matrix td.c,.matrix th.c{text-align:center}
.yes{color:var(--sello-verde);font-weight:700}
.no{color:var(--tinta-3)}
.scope ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
.scope li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--renglon)}
.scope li:last-child{border-bottom:0}
.scope svg{color:var(--sello-verde);margin-top:2px}
.share{display:flex;align-items:center;gap:8px;min-width:150px}
.share i{display:block;height:8px;background:var(--acento)}
.share span{font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-size:13px;color:var(--tinta-2)}
.newc{display:grid;gap:8px;padding:12px;border:1px dashed var(--sello-ambar);border-radius:4px;background:var(--sello-ambar-suave)}
.newc .input{background:var(--hoja)}
.tabs{display:flex;gap:4px;padding:8px 12px 0;background:var(--hoja-alt);border-bottom:1px solid var(--renglon);overflow-x:auto}
.tabs button{border:1px solid transparent;border-bottom:0;background:transparent;border-radius:8px 8px 0 0;padding:0 16px;min-height:42px;margin-bottom:-1px;font-weight:600;color:var(--tinta-3);white-space:nowrap}
.tabs button:hover{color:var(--tinta)}
.tabs button.on{background:var(--hoja);border-color:var(--renglon);color:var(--tinta)}
.cell-in{min-height:38px;padding:6px 8px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);width:100%;font-family:var(--font-maquina);font-size:13.5px}
.fh{margin:6px 0 -4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3);font-weight:700}
.hist{display:grid}.hist .hi{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px dashed var(--renglon);font-size:14px}.hist .hi:last-child{border-bottom:0}
.paygrp{display:grid;gap:10px;border:1px solid var(--linea);border-radius:4px;padding:12px}.paygrp p{margin:0}.paygrp .list{border:1px solid var(--renglon);border-radius:4px}.paygrp .list .it{padding:8px 10px}
.txtfile{font-family:var(--font-maquina);font-size:12px;line-height:1.5;background:var(--hoja-alt);border:1px solid var(--linea);border-radius:4px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:0;max-width:100%}
.pasos{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.aupick{border:1px solid var(--linea);border-radius:4px;padding:6px 12px 8px;display:grid;margin:0;min-width:0}.aupick legend{font-size:11.5px;font-weight:600;color:var(--tinta-3);padding:0 4px}.aupick label{display:flex;align-items:center;gap:10px;min-height:40px}.aupick input{width:20px;height:20px;accent-color:var(--acento-tinta);flex:none}
.tgl{display:flex;align-items:center;gap:12px;min-height:46px;border-bottom:1px dashed var(--renglon)}.tgl:last-child{border-bottom:0}.tgl input{width:20px;height:20px;accent-color:var(--acento-tinta);flex:none}
.permb{border:1px dashed var(--linea);background:transparent;border-radius:4px;min-width:46px;min-height:34px;font:inherit;color:inherit;cursor:pointer}.permb:hover{background:var(--acento-suave)}
.secx{border:0;background:transparent;color:var(--tinta-3);width:26px;height:26px;border-radius:4px;display:grid;place-items:center;margin-right:-6px}.secx:hover{background:var(--hoja-alt);color:var(--tinta)}.secx .i{width:14px;height:14px}
.cell-in.miss{border-color:var(--sello-ambar);background:var(--sello-ambar-suave)}
.drop{border:2px dashed var(--linea);border-radius:4px;padding:28px 16px;text-align:center;display:grid;gap:6px;justify-items:center;color:var(--tinta-2);background:var(--hoja-alt)}
.rolebar{background:var(--sello-violeta-suave);border:1px dashed var(--sello-violeta);border-radius:4px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--tinta)}
.rolebar svg{color:var(--sello-violeta)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){.pos{grid-template-columns:minmax(0,1fr)}#cartbox{position:static}.g-dash{grid-template-columns:minmax(0,1fr)}}
@media (max-width:980px){.g3{grid-template-columns:minmax(0,1fr)}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;transform:translateX(-100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,15,28,.45)}
  .menu-btn{display:inline-flex}
  .top,.content,.offbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g2{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:minmax(0,1fr)}
  .login .brandside{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:28px 34px;
    -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 98%,#000) left bottom/16px 9px repeat-x;
            mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 98%,#000) left bottom/16px 9px repeat-x}
  .login .formside{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hbar{grid-template-columns:96px minmax(0,1fr) 84px}
}
@media (max-width:560px){.flow{grid-template-columns:minmax(0,1fr)}.top .chips .hide-sm{display:none}.payln{grid-template-columns:minmax(0,1fr) 150px 44px}.top .folio{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.ticket.printing,.sello.estampar{animation:none}}
.login .brandside{background:radial-gradient(120% 90% at 0% 0%,#18237a 0%,#0e1752 45%,#060a25 100%);color:#fff}
.login .brandside h1,.login .brandside p{color:#fff}
.login .brandside h1{text-transform:none}
.login .brandside .facts span{border-color:#00d2d6;color:#00d2d6}
.login .brandside [style*="--on-acento"]{color:#fff!important}
.login .brandside::after{content:"";position:absolute;left:0;right:9px;bottom:0;height:6px;background:linear-gradient(90deg,#00d2d6 0 55%,#3233ff 55%)}
.side .logo img{box-shadow:0 0 0 2px var(--hoja)}
/* ---------- Precio por %, cotizaciones, salidas y opciones de costo ---------- */
.warn-t{color:var(--sello-ambar)}
.precio-calc{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--linea);border-radius:4px;background:var(--hoja-alt)}
.precio-calc b{font-size:1.25rem}
.segs{display:grid;gap:1px;margin-top:3px;font-family:var(--font-maquina);font-size:12px;color:var(--tinta-2)}
.segs span::before{content:"↳ ";color:var(--tinta-3)}
.nofact{display:grid;gap:4px;text-align:center;padding:12px 14px;border:2px dashed var(--sello-rojo,#b42318);border-radius:4px;color:var(--tinta)}
.nofact b{font-family:var(--font-forma);font-stretch:80%;font-size:1.35rem;letter-spacing:.06em;color:var(--sello-rojo,#b42318)}
.nofact span{font-size:13.5px;color:var(--tinta-2)}
.copt{display:grid;gap:8px;border:1px solid var(--linea);border-radius:4px;padding:10px 12px 12px;margin:0;min-width:0}
.copt legend{font-weight:700;padding:0 4px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--renglon);border-radius:4px;cursor:pointer;background:var(--hoja)}
.opt:has(input:checked){border-color:var(--acento-tinta);background:var(--acento-suave)}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--acento-tinta);flex:none}
.opt>span{display:grid;gap:2px;min-width:0}.opt>span>span{font-size:14px;color:var(--tinta-2)}.opt small{font-size:12.5px;font-weight:600}
.linkb{border:0;background:transparent;box-shadow:none;color:var(--acento-tinta);text-decoration:underline;text-underline-offset:3px;justify-self:center}
.tot-acts{margin:6px 0 2px;flex-wrap:nowrap}.tot-acts .btn{flex:1;min-width:0;padding:0 10px}
.cart .cobrar{margin-top:8px;display:grid}
.prod .luego{font-family:var(--font-maquina);font-size:11.5px;color:var(--sello-ambar);font-weight:600}
.bnav,.cartbar,.closem,.cartbg{display:none}
body.noscroll{overflow:hidden}

/* ---------- Teléfono (hasta 600 px): el escritorio no cambia ---------- */
@media (max-width:600px){
  body{font-size:15px}
  .top{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:8px 12px;padding-block:10px 6px}
  .top .ttl{gap:4px 10px;align-items:center}

/* --- Caja --- */
const lotsFEFO = p => p.lots.filter(l => daysTo(l.e)>=0 && l.q>0).sort((a,b)=>a.e.localeCompare(b.e));
/* Divide una cantidad por lotes: con precio por lote, cada lote cobra su precio y la línea se parte. */
function segs(p, q){
  const ls = lotsFEFO(p);
  if (!p.porLote) return [{q, pv:p.price, l:ls[0] ? ls[0].l : '—'}];
  const out = []; let r = q;
  for (const l of ls){ if (r<=0) break; const d = Math.min(l.q, r), pv = l.pv ?? p.price, last = out[out.length-1];
    if (last && last.pv===pv) { last.q += d; last.l += ', ' + l.l; } else out.push({q:d, pv, l:l.l}); r -= d; }
  if (r>0) { const last = out[out.length-1]; if (last) last.q += r; else out.push({q:r, pv:p.price, l:'—'}); }
  return out;
}
/* Con precio por lote, el precio de la ficha es el del lote que sale primero. Cuando queda un solo precio, vuelve a ser normal. */
function refreshPrice(p){
  if (!p.porLote) return;
  const ls = lotsFEFO(p), pvs = [...new Set(ls.map(l => l.pv ?? p.price))];
  if (ls[0]) { p.price = ls[0].pv ?? p.price; p.cost = ls[0].c ?? p.cost; }
  if (pvs.length<=1) { p.porLote = false; p.lots.forEach(l => { delete l.pv; }); }
}
const nextPrice = p => { if (!p.porLote) return null; const ls = lotsFEFO(p), x = ls.find(l => (l.pv ?? p.price)!==p.price); return x ? x.pv : null; };
function totals(){
  let ex=0, bi=0, br=0;
  S.cart.forEach(c => { const p = P.find(x=>x.id===c.id); const t = segs(p, c.q).reduce((a,s)=>a+s.pv*s.q,0); if (p.iva==='E') ex+=t; else if (p.iva==='R') br+=t; else bi+=t; });
  const iva = bi*0.16 + br*0.08, base = ex+bi+br+iva;
  const div = S.pays.filter(p=>p.div).reduce((a,p)=>a+p.a,0);
  const igtf = S.spe ? div*0.03 : 0, paid = S.pays.reduce((a,p)=>a+p.a,0);
  return {ex,bi,br,iva,base,igtf,total:base+igtf,paid,rem:Math.max(0,+(base-paid).toFixed(2)),over:Math.max(0,+(paid-base).toFixed(2)),items:S.cart.reduce((a,c)=>a+c.q,0)};
}

function qrSvg(seed){
  let x = seed * 9301 + 49297, cells = '';
  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  const finder = (cx, cy) => `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#1a2440"/><rect x="${cx+1}" y="${cy+1}" width="5" height="5" fill="#fff"/><rect x="${cx+2}" y="${cy+2}" width="3" height="3" fill="#1a2440"/>`;
  for (let i=0;i<25;i++) for (let j=0;j<25;j++){ const inF = (i<8&&j<8)||(i<8&&j>16)||(i>16&&j<8); if (!inF && rnd()>.52) cells += `<rect x="${j}" y="${i}" width="1" height="1" fill="#1a2440"/>`; }
  return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="Código QR de verificación (muestra)">${finder(0,0)}${finder(18,0)}${finder(0,18)}${cells}</svg>`;
}

function mergePrev(a, b){
  a = P.find(x=>x.id===+a); b = P.find(x=>x.id===+b);
  if (!a || !b || a===b) return '<p class="small warn-t" style="margin:0">Escoge dos productos distintos.</p>';

  if (Math.abs(a.cost-b.cost)>=0.005) w.push(`El costo es distinto: queda ${usd(a.cost)} con ${dd(a.margen)} % de ganancia, precio ${usd(a.price)}.`);

let UT = 43; const UT_F = 83.3334; const utMin = () => Math.floor(UT*UT_F*100)/100;  /* pago mínimo para retener a personas naturales: Bs 3.583,33 */

function islrCalc(bsA, k, pn){

}

function liquidacion(e, mot, fEg){
  const m = mesesEntre(e.ing, fEg), anios = Math.floor(m/12), fr = m%12, sd = e.sal/30;
  const bvD = Math.min(15+anios, 30), vacD = Math.min(15+anios, 30), si = sd*(1 + LEY.util/360 + bvD/360);
  let adic = 0; for (let k=1; k<anios; k++) adic += Math.min(2*k, 30);
  const gDias = 15*Math.floor(m/3) + adic, garantia = gDias*si, rDias = 30*(anios + (fr>6?1:0)), retro = rDias*si, prest = Math.max(garantia, retro);
  const inter = garantia*LEY.tasaPrest/100*(m/12)/2;
  const y = fEg.slice(0,4), mA = mesesEntre(e.ing > y+'-01-01' ? e.ing : y+'-01-01', fEg), utilD = LEY.util*mA/12;
  const vacF = vacD*fr/12, bvF = bvD*fr/12;
  const rows = [
    ['Prestaciones sociales', prest, `Garantía: ${dd(gDias)} días. Cálculo final: ${rDias} días. Se paga el mayor`, 'Art. 142'],
    ['Intereses de las prestaciones', inter, `Tasa BCV ${pcT(LEY.tasaPrest)} anual, aproximado`, 'Art. 143'],
    ['Vacaciones fraccionadas', vacF*sd, `${dd(vacF)} días de salario`, 'Art. 196'],
    ['Bono vacacional fraccionado', bvF*sd, `${dd(bvF)} días de salario`, 'Art. 196'],
    ['Utilidades fraccionadas', utilD*sd, `${dd(utilD)} días: ${mA} meses de ${y}`, 'Art. 131']];
  if (mot==='Despido injustificado') rows.push(['Indemnización por despido injustificado', prest, 'Igual a las prestaciones', 'Art. 92']);
  return {m, sd, si, rows, total: rows.reduce((s,r)=>s+r[1],0)};
}

/* --- Teléfono: cada fila de una tabla de datos se ve como tarjeta. Los libros fiscales (.keep) siguen como tabla. --- */
function cardify(root){
  (root||document).querySelectorAll('table').forEach(t => {
    if (t.closest('.keep')) return;
    const hs = [...t.querySelectorAll(':scope>thead>tr>th')].map(th => th.textContent.trim());
    if (!hs.length) return;
    t.classList.add('cardt');
    t.querySelectorAll(':scope>tbody>tr, :scope>tfoot>tr').forEach(tr => {
      let col = 0;
      [...tr.children].forEach(td => {
        const span = td.colSpan || 1;
        if (td.dataset.label===undefined) {
          td.dataset.label = span>1 ? '' : (hs[col] || '');
          if (!td.querySelector(':scope>.cv')) { const d = document.createElement('div'); d.className = 'cv'; while (td.firstChild) d.appendChild(td.firstChild); td.appendChild(d); }
          if (!td.textContent.trim() && !td.querySelector('button,input,select,a,svg,img')) td.classList.add('nil');
          if (span>1) td.classList.add('span');
        }
        col += span;
      });
    });
  });
  /* indicadores en dos columnas: si quedan impares, el último ocupa todo el ancho */
  (root||document).querySelectorAll('.kpis').forEach(k => { const it = [...k.children].filter(x => x.classList.contains('kpi') && !x.classList.contains('hero'));
    it.forEach((x,i) => x.classList.toggle('wide', it.length%2===1 && i===it.length-1)); });
}


document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (S.sidebar && !e.target.closest('.side')) { S.sidebar=false; render(); } if (e.target.id==='modal') closeModal(); return; }
  const a = b.dataset.act, id = +b.dataset.id;
  if (b.tagName==='A') e.preventDefault();
  switch(a){
    case 'nav': go(b.dataset.v); break;
    case 'role': S.role = b.dataset.r; S.user = ROLES[S.role].user; render(); break;
    case 'logout': go('login'); break;
    case 'menu': S.sidebar = !S.sidebar; S.cartOpen = false; render(); break;
    case 'net':
      S.online = !S.online;
      if (S.online){ const n = S.queue.length, k = S.queue.filter(q=>q.cont).length; S.queue = [];
        toast(n?`Conexión restablecida · ${n} ${n===1?'venta sincronizada':'ventas sincronizadas'}${k?` y ${k} ${k===1?'factura de contingencia reportada':'facturas de contingencia reportadas'} en PDF a la imprenta`:''}`:'Conexión restablecida'); }
      else toast('Sin internet: la caja sigue funcionando');
      render(); break;
    case 'cat': S.cat = b.dataset.c; rerenderPOS(); document.querySelectorAll('.cats button').forEach(x=>x.classList.toggle('on', x.dataset.c===S.cat)); break;
    case 'add': { const p = P.find(x=>x.id===id); const c = S.cart.find(x=>x.id===id); const q = c?c.q:0;
      if (p.stock<=0) { const eq = equivs(p).find(x=>x.stock>0); toast(eq ? `${p.name} está agotado. Con ${p.act} hay ${eq.name} a ${usd(eq.price)}` : `${p.name} está agotado: anótalo como falla`); break; }
      if (q >= p.stock) { toast('No hay más existencia de este producto'); break; }
      if (p.ctrl && S.role==='Cajero') { toast('Controlado: lo despacha la regente con el récipe especial'); break; }
      c ? c.q++ : S.cart.push({id, q:1});
      const alr = S.client && ALERTAS[S.client.ci] && ALERTAS[S.client.ci].acts.includes(p.act);
      if (alr && !c) toast(`Consulta a la regente antes de vender ${p.name} a este cliente`);
      else if (p.ctrl && !c) toast(`${p.name}: controlado. Registra el récipe especial; la salida va al libro de controlados`);
      else if (p.rx && !c) toast(`${p.name}: pide el récipe al cliente`);

    const nid = Math.max(...EMP.map(x=>x.id))+1, ne = {id:nid, ...nv, hx:0, hist:[{f:'26/10/2026', t:'Entró a la nómina', m:nv.cargo, u:S.user}]};
    EMP.push(ne); syncUser(ne, rol); S.empSel = nid; S.nov[nid] = {};
    closeModal(); render(); toast(`${nm} quedó en la nómina${rol?` y con su usuario de ${ROL_TXT[rol]}`:''}. Recuerda inscribirlo en el IVSS y el FAOV`); return; }
  if (e.target.id==='aumForm'){ e.preventDefault(); const c = aumCalc();
    if (!c.v) { toast('Escribe cuánto sube'); $('#au-val').focus(); return; }
    if (!c.ids.length) { toast('Marca al menos un empleado'); return; }
    const desde = $('#au-desde').value || '2026-11-01', mot = $('#au-mot').value, L = {sal:'Salario',bono:'Bono',cesta:'Cestaticket'}[c.q], fm = c.q==='sal' ? bs : usd, ya = desde <= '2026-10-26';
    c.ids.forEach(i => { const em = EMP.find(x=>x.id===i), n = Math.round(c.nuevo(em[c.q])*100)/100, txt = `${L}: ${fm(em[c.q])} → ${fm(n)}`;
      if (ya) em[c.q] = n; else { em.prog = (em.prog||[]).filter(p=>p.q!==c.q); em.prog.push({q:c.q, n, desde, txt}); }
      em.hist.unshift({f:'26/10/2026', t: ya ? txt : `Aumento programado para el ${fmtDate(desde)}: ${txt}`, m:mot, u:S.user}); });
    closeModal(); render(); const k = c.ids.length, q = `${k} ${k===1?'empleado':'empleados'}`;
    toast(ya ? `Aumento aplicado a ${q}: la quincena ya sale con el monto nuevo` : `Aumento programado para el ${fmtDate(desde)}: ese día entra solo en la nómina de ${q}`); return; }
  if (e.target.id==='leyForm'){ e.preventDefault(); const g = id => parseVE($('#'+id).value);
    const n = {sm:g('ly-sm'), ingMin:g('ly-ing'), cesta:g('ly-cesta'), pens:g('ly-pens'), ivssPat:+$('#ly-ivss').value, hx:g('ly-hx'), noct:g('ly-noct'), fer:g('ly-fer'), util:g('ly-util'), tasaPrest:g('ly-tp')}, ut = g('ly-ut');
    if (!n.sm || !ut) { toast('El salario mínimo y la unidad tributaria no pueden quedar en cero'); return; }
    if (n.hx<50) { toast('La ley pide al menos 50 % de recargo en las horas extra (art. 118)'); $('#ly-hx').focus(); return; }
    if (n.noct<30) { toast('La ley pide al menos 30 % de bono nocturno (art. 117)'); $('#ly-noct').focus(); return; }
    if (n.fer<50) { toast('La ley pide al menos 50 % de recargo por feriado trabajado (art. 120)'); $('#ly-fer').focus(); return; }
    if (n.util<30 || n.util>120) { toast('Las utilidades van de 30 a 120 días (art. 131)'); $('#ly-util').focus(); return; }
    const lab = {sm:['Salario mínimo',bs], ingMin:['Ingreso mínimo integral',usd], cesta:['Cestaticket',usd], pens:['Contribución para pensiones',pcT], ivssPat:['IVSS del patrono',pcT], hx:['Recargo de horas extra',pcT], noct:['Bono nocturno',pcT], fer:['Recargo de feriados',pcT], util:['Días de utilidades',x=>x+' días'], tasaPrest:['Interés de prestaciones',pcT]};
    const ch = Object.keys(n).filter(k=>n[k]!==LEY[k]).map(k=>`${lab[k][0]}: ${lab[k][1](LEY[k])} → ${lab[k][1](n[k])}`);
    if (ut!==UT) ch.push(`Unidad tributaria: ${bs(UT)} → ${bs(ut)}`);
    if (!ch.length) { toast('No hubo cambios'); return; }
    if (n.cesta!==LEY.cesta) EMP.forEach(x=>{ if (x.cesta===LEY.cesta) x.cesta = n.cesta; });
    Object.assign(LEY, n); UT = ut; ch.forEach(t=>LEY_HIST.unshift({f:'26/10/2026', t, u:S.user}));
    render(); toast(`${ch.length} ${ch.length===1?'parámetro cambiado':'parámetros cambiados'}: la nómina, los aportes y las prestaciones ya se recalcularon`); return; }
  if (e.target.id==='userForm'){ e.preventDefault(); const uid = e.target.dataset.id, rol = $('#us-rol').value, caja = rol==='Almacén' ? 'Almacén' : $('#us-caja').value, est = $('#us-est').value;
    if (uid===''){ const nm = ($('#us-n').value||'').trim(); if (!nm) { toast('Escribe el nombre'); $('#us-n').focus(); return; }
      const em = EMP.find(x=>norm(x.n)===norm(nm) && !userOf(x));
      USERS.push({id:Math.max(...USERS.map(x=>x.id))+1, n:em?em.n:nm, rol, caja, est, last:'Nunca', emp:em?em.id:null});
      if (em) em.hist.unshift({f:'26/10/2026', t:`Acceso al sistema: sin usuario → ${ROL_TXT[rol]}`, m:'', u:S.user});
      closeModal(); render(); toast(`Usuario de ${nm} creado como ${ROL_TXT[rol]}. Su PIN le llega por WhatsApp`); return; }
    const u = USERS.find(x=>x.id===+uid), ch = [];
    if (u.rol!==rol) ch.push(`rol ${ROL_TXT[rol]}`); if (u.caja!==caja) ch.push(`${caja}`); if (u.est!==est) ch.push(est==='Bloqueado'?'usuario bloqueado':'usuario activo');
    if (!ch.length) { closeModal(); toast('No hubo cambios'); return; }
    const em = u.emp!=null && EMP.find(x=>x.id===u.emp); if (em && u.rol!==rol) em.hist.unshift({f:'26/10/2026', t:`Acceso al sistema: ${ROL_TXT[u.rol]} → ${ROL_TXT[rol]}`, m:'', u:S.user});
    Object.assign(u, {rol, caja, est}); closeModal(); render(); toast(`${u.n}: ${ch.join(', ')}. Aplica desde su próximo inicio de sesión`); return; }
  if (e.target.id==='tasaForm'){ e.preventDefault(); const v = parseVE($('#t-val').value); if (!v || v<1) { toast('Escribe la tasa en bolívares por dólar'); $('#t-val').focus(); return; }
    const o = S.rate; S.rate = v; CFG.tasaModo = $('#t-modo').value; closeModal(); render();
    toast(v===o ? 'La tasa quedó igual' : `Tasa ${nf(o)} → ${nf(v)}: precios en bolívares, recibos y reportes recalculados`); return; }
  if (e.target.id==='cliForm'){ e.preventDefault(); const ci = ($('#cl-ci').value||'').trim().toUpperCase(), nm = ($('#cl-n').value||'').trim(), gi = e.target.dataset.i;
    if (!ci) { toast('Escribe la cédula o el RIF'); $('#cl-ci').focus(); return; }
    if (!nm) { toast('Escribe el nombre'); $('#cl-n').focus(); return; }
    const d = {ci, name:nm, tel:($('#cl-tel').value||'').trim()||'—', mail:($('#cl-mail').value||'').trim(), dir:($('#cl-dir').value||'').trim()};
    if (gi===''){ if (CLIENTS.some(c=>c.ci.replace(/[^0-9]/g,'')===ci.replace(/[^0-9]/g,''))) { toast('Ya hay un cliente con esa cédula o RIF'); return; } CLIENTS.unshift({...d, visits:0, total:0, last:'—', pts:0}); }
    else Object.assign(CLIENTS[+gi], d);
    closeModal(); render(); toast(gi==='' ? `${nm} registrado: en la caja aparece con solo poner la cédula` : `Datos de ${nm} actualizados`); return; }
  if (e.target.id==='empresaForm'){ e.preventDefault(); const g = id => ($('#'+id).value||'').trim();
    if (!g('cf-razon') || !g('cf-rif')) { toast('La razón social y el RIF no pueden quedar vacíos'); return; }
    Object.assign(EMPRESA, {razon:g('cf-razon'), rif:g('cf-rif').toUpperCase(), dir:g('cf-dir'), mun:g('cf-mun'), tel:g('cf-tel'), mail:g('cf-mail')}); render();
    toast('Datos guardados: las próximas facturas, recibos y reportes ya salen así'); return; }
  if (e.target.id==='preciosForm'){ e.preventDefault(); const mg = parseVE($('#cf-marg').value); if (!mg) { toast('Escribe la ganancia por defecto'); $('#cf-marg').focus(); return; }
    CFG.gan = mg; CFG.costOpt = $('#cf-copt').value; document.querySelectorAll('[data-marg]').forEach(x=>{ const v = (x.value||'').trim(); if (v==='') delete CFG.margSec[x.dataset.marg]; else CFG.margSec[x.dataset.marg] = parseVE(v); });
    const k = Object.keys(CFG.margSec).length; render(); toast(`Guardado: ganancia por defecto ${pcT(mg)}${k?`, ${k} ${k===1?'sección':'secciones'} con la suya`:''} y opción ${CFG.costOpt} cuando cambia el costo${mg>30?'. Ojo: pasa del 30 % de la Ley de Precios Justos':''}`); return; }
  if (e.target.id==='avisosForm'){ e.preventDefault(); CFG.venc = +$('#cf-venc').value; CFG.aviso = +$('#cf-aviso').value; EMPRESA.wa = ($('#cf-wa').value||'').trim(); render();
    toast(`Avisos guardados: vencimientos con ${CFG.venc} días y pagos con ${CFG.aviso} ${CFG.aviso===1?'día':'días'} de anticipación`); return; }
  if (e.target.id==='loginForm'){ e.preventDefault(); go('dashboard'); if (!S.online) toast(`Sesión abierta sin internet con PIN · ${S.user}`); } });
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#modal').hidden) closeModal(); if (e.key==='Enter' && e.target.id==='ci'){ e.preventDefault(); document.querySelector('[data-act="client"]').click(); }
  if (e.key==='Enter' && e.target.id==='scan'){ e.preventDefault(); scanAdd(); }
  if (e.key==='Enter' && e.target.id==='p-alt-in'){ e.preventDefault(); document.querySelector('[data-act="altadd"]').click(); }
  if (e.key==='Enter' && e.target.id==='q'){ const p = byCode(e.target.value); if (p) { e.preventDefault(); S.q = ''; e.target.value = ''; const pr = $('#prods'); if (pr) pr.innerHTML = prodGrid(); const bt = document.querySelector(`[data-act="add"][data-id="${p.id}"]`); bt && bt.click(); } }
  if (e.key==='Enter' && e.target.id==='fq'){ e.preventDefault(); document.querySelector('[data-act="fbuscar"]').click(); }
  if (e.key==='Enter' && e.target.id==='secname'){ e.preventDefault(); document.querySelector('[data-act="secadd"]').click(); } });

new MutationObserver(() => cardify(document)).observe(document.body, {childList:true, subtree:true});
let DL = null;  /* descargas dentro de claude.ai; fuera de ahí se usa el enlace normal */
(async()=>{ try { if (window.claude && window.claude.use) DL = await window.claude.use('downloads'); } catch(e){} })();
(function init(){
  const h = (location.hash||'').slice(1);
  if (h && V[h] && h!=='login' && h!=='myShift') S.view = h;
  render();
})();
</script>

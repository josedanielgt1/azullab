<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Azullab Farmacia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   PAPEL FISCAL · sistema de diseño de Cuadre
   Capa 1: tokens (papel / carbón). Capa 2: color del cliente (Azullab).
   Capa 3: componentes aplicados a esta maqueta.
   Diseño: mesa → separadores de archivador → carpeta abierta → hojas con folio.
   ===================================================================== */
:root{
  --mesa:#e8ebef; --hoja:#ffffff; --hoja-alt:#f4f6f9; --renglon:#cbd8ea; --linea:#6f7d94; --margen:#d2453b;
  --tinta:#1a2440; --tinta-2:#4e5a73; --tinta-3:#5d6882;
  --sello-verde:#1f7a43; --sello-verde-suave:#e3f3e8; --sello-rojo:#b3261e; --sello-rojo-suave:#fbe6e4;
  --sello-ambar:#8a5300; --sello-ambar-suave:#fdf0d8; --sello-violeta:#5b3aa6; --sello-violeta-suave:#efe9fb;
  --foco:#1a2440;
  --sombra-hoja:0 1px 2px rgba(26,36,64,.08),0 0 0 1px rgba(26,36,64,.06);
  --sombra-pila:0 1px 2px rgba(26,36,64,.08),0 0 0 1px rgba(26,36,64,.06),5px 5px 0 -1px #ffffff,5px 5px 0 0 #cbd8ea;
  --sombra-flotante:0 18px 48px rgba(13,18,32,.28);
  /* Color del cliente: Azullab Farmacia (celeste y blanco) */
  --acento:#3db2e8; --on-acento:#0b2340; --acento-tinta:#0a6fa8; --acento-suave:#e3f4fc;
  --font-forma:"Archivo","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-maquina:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --alto-renglon:40px;
  /* alias que usa el contenido de la maqueta */
  --ink:var(--tinta); --ink-2:var(--tinta-2); --ink-3:var(--tinta-3); --line:var(--renglon); --azul:var(--acento-tinta);
  --celeste-50:var(--acento-suave); --ok:var(--sello-verde); --warn:var(--sello-ambar); --bad:var(--sello-rojo);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --mesa:#0d1220; --hoja:#161d2e; --hoja-alt:#1c2438; --renglon:#2a3650; --linea:#6b7a95; --margen:#e06a5f;
  --tinta:#e7ecf5; --tinta-2:#a3aec4; --tinta-3:#8794ae;
  --sello-verde:#5fd08e; --sello-verde-suave:#12301f; --sello-rojo:#ff8a7f; --sello-rojo-suave:#3a1714;
  --sello-ambar:#f0b54d; --sello-ambar-suave:#33260d; --sello-violeta:#b9a2ff; --sello-violeta-suave:#251a45;
  --foco:#e7ecf5;
  --sombra-hoja:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06);
  --sombra-pila:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06),5px 5px 0 -1px #161d2e,5px 5px 0 0 #2a3650;
  --sombra-flotante:0 18px 48px rgba(0,0,0,.6);
  --acento:#6cc9f2; --on-acento:#0b2340; --acento-tinta:#6cc9f2; --acento-suave:#123047;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --mesa:#0d1220; --hoja:#161d2e; --hoja-alt:#1c2438; --renglon:#2a3650; --linea:#6b7a95; --margen:#e06a5f;
  --tinta:#e7ecf5; --tinta-2:#a3aec4; --tinta-3:#8794ae;
  --sello-verde:#5fd08e; --sello-verde-suave:#12301f; --sello-rojo:#ff8a7f; --sello-rojo-suave:#3a1714;
  --sello-ambar:#f0b54d; --sello-ambar-suave:#33260d; --sello-violeta:#b9a2ff; --sello-violeta-suave:#251a45;
  --foco:#e7ecf5;
  --sombra-hoja:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06);
  --sombra-pila:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06),5px 5px 0 -1px #161d2e,5px 5px 0 0 #2a3650;
  --sombra-flotante:0 18px 48px rgba(0,0,0,.6);
  --acento:#6cc9f2; --on-acento:#0b2340; --acento-tinta:#6cc9f2; --acento-suave:#123047;
  color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--mesa);color:var(--tinta);font-family:var(--font-forma);font-size:15px;line-height:1.47}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.num{font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;line-height:28px;font-weight:700}
h2{font-size:17px;line-height:22px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
svg.i{width:18px;height:18px;flex:none}

/* ---------- Entrada ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--mesa)}
.login .brandside{background:var(--acento);color:var(--on-acento);display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding-block:44px;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:56px;position:relative;
  -webkit-mask:linear-gradient(#000 0 0) left/calc(100% - 9px) 100% no-repeat,radial-gradient(circle 6px at 100% 8px,transparent 98%,#000) right top/9px 16px repeat-y;
          mask:linear-gradient(#000 0 0) left/calc(100% - 9px) 100% no-repeat,radial-gradient(circle 6px at 100% 8px,transparent 98%,#000) right top/9px 16px repeat-y}
.login .brandside h1{font-size:clamp(30px,3.6vw,46px);line-height:1.04;font-weight:800;letter-spacing:-.015em;max-width:15ch;color:var(--on-acento)}
.login .brandside p{max-width:44ch;color:var(--on-acento);font-size:16px;line-height:24px}
.login .facts{display:flex;flex-wrap:wrap;gap:8px}
.login .facts span{border:1.5px solid var(--on-acento);color:var(--on-acento);padding:3px 9px;border-radius:3px;font-stretch:80%;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.login .formside{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login form{width:100%;max-width:420px;display:grid;gap:14px;background:var(--hoja);box-shadow:var(--sombra-pila);border-radius:2px;padding:22px 22px 24px}
.login .firma{font-size:12.5px;color:var(--tinta-3)}
.login .firma b{color:var(--tinta-2);font-weight:800}
.field{display:grid;gap:3px;padding:7px 10px 8px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);min-width:0}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--foco)}
.field label{font-size:11.5px;line-height:14px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3)}
.field .input{border:0;padding:0;min-height:26px;background:transparent;box-shadow:none;font-size:16px;border-radius:0}
.field .input:focus{box-shadow:none}
.field:has(.roles){border:0;padding:0;background:none;box-shadow:none}
.roles{display:flex;gap:4px;border-bottom:1px solid var(--renglon);overflow-x:auto}
.roles button{border:1px solid transparent;border-bottom:0;background:var(--hoja-alt);border-radius:8px 8px 0 0;padding:0 14px;min-height:42px;margin-bottom:-1px;font-weight:600;color:var(--tinta-3);white-space:nowrap}
.roles button.on{background:var(--hoja);border-color:var(--renglon);color:var(--tinta)}
.input{width:100%;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:10px 12px;min-height:44px}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--foco)}

/* ---------- Mesa, separadores y carpeta ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--mesa);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:10px;padding:18px 18px 8px}
.side .nav{display:grid;gap:3px;padding:0 0 16px 10px}
.side .grp{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3);padding:14px 14px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.side .nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 14px;color:var(--tinta-2);text-decoration:none;border:1px solid transparent;border-right:0;border-radius:8px 0 0 8px;font-size:15px}
.side .nav a:hover{background:var(--hoja-alt);color:var(--tinta)}
.side .nav a.on{background:var(--hoja-alt);color:var(--tinta);font-weight:700;border-color:var(--renglon)}
.side .nav a .cod{margin-left:auto;font-family:var(--font-maquina);font-size:11px;color:var(--tinta-3);font-weight:400}
.side .foot{margin-top:auto;padding:14px 18px;border-top:1px dashed var(--linea);font-size:13px;color:var(--tinta-3)}
.side .foot .firma{margin-top:12px;font-size:11.5px}
.side .foot .firma b{font-weight:800;color:var(--tinta-2)}
.main{min-width:0;display:flex;flex-direction:column;background:var(--hoja-alt)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hoja-alt);border-bottom:3px double var(--renglon);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hoja-alt)}
.top .ttl{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1;flex-wrap:wrap}
.top .ttl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .folio{font-family:var(--font-maquina);font-size:12px;color:var(--tinta-3);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:4px 10px;font-size:13px;color:var(--tinta-2);min-height:34px;white-space:nowrap}
.chip b{font-family:var(--font-maquina);font-weight:600;color:var(--tinta)}
button.chip:hover{border-color:var(--tinta)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sello-verde);flex:none}
.chip.off{background:var(--sello-ambar-suave);border-color:var(--sello-ambar);color:var(--sello-ambar);font-weight:700}
.chip.off .dot{background:var(--sello-ambar)}
.menu-btn{display:none;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;width:44px;height:44px;align-items:center;justify-content:center}
.offbar{background:var(--sello-ambar-suave);color:var(--tinta);border-bottom:1px dashed var(--sello-ambar);padding-block:9px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.offbar svg{color:var(--sello-ambar)}
.offbar b{color:var(--sello-ambar)}
.content{padding-block:22px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.phase{font-family:var(--font-forma);font-stretch:80%;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:2px 7px;white-space:nowrap}
.phase.f1{color:var(--sello-violeta);background:var(--sello-violeta-suave)}
.phase.f2{color:var(--sello-verde);background:var(--sello-verde-suave)}
.phase.mod{color:var(--sello-ambar);background:var(--sello-ambar-suave)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--linea);border-radius:4px;font-size:14px;background:var(--hoja);color:var(--tinta-3)}
.step b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--hoja-alt);font-family:var(--font-maquina);font-size:12px;color:var(--tinta-2)}
.step.done{border-color:var(--sello-verde);color:var(--sello-verde);background:var(--sello-verde-suave)}
.step.done b{background:var(--sello-verde);color:var(--hoja)}
.step.now{border-color:var(--acento-tinta);color:var(--tinta);box-shadow:inset 0 0 0 1px var(--acento-tinta)}
.step.now b{background:var(--acento);color:var(--on-acento)}
.emp{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--acento-suave);color:var(--acento-tinta);font-weight:700;font-size:13px;flex:none;border:1px solid var(--linea)}
tr.sel td{background:var(--acento-suave)}
tr[data-act]{cursor:pointer}
.lead{color:var(--tinta-2);max-width:75ch}

/* ---------- Hojas ---------- */
.panel{background:var(--hoja);border-radius:2px;box-shadow:var(--sombra-hoja);min-width:0}
.panel.doc{box-shadow:var(--sombra-pila)}
.panel>.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px 10px;border-bottom:1px solid var(--renglon)}
.pfolio{display:block;font-family:var(--font-maquina);font-size:11px;line-height:14px;font-weight:400;color:var(--tinta-3);margin-bottom:3px;letter-spacing:0}
.panel>.bd{padding:16px;min-width:0}
.panel>.bd.flush{padding:0}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* Planilla de cifras: casillas unidas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--hoja);border:1px solid var(--linea);border-radius:4px;overflow:hidden;box-shadow:var(--sombra-hoja)}
.kpi{background:var(--hoja);box-shadow:0 0 0 1px var(--linea);padding:10px 14px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi .l{font-size:11.5px;line-height:14px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3)}
.kpi .v{font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-size:27px;line-height:34px;font-weight:600;letter-spacing:-.01em}
.kpi .s{font-size:13px;color:var(--tinta-2)}
.kpi .s.num{font-size:12.5px}
.kpi.hero{background:var(--acento-suave)}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.kpis.k3{grid-template-columns:minmax(0,1fr)}}
.kpis.k3 .v{font-size:24px}
.kpi.hero .l{color:var(--acento-tinta)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);color:var(--tinta);font-weight:600;font-size:15px;box-shadow:0 2px 0 0 var(--renglon);transition:transform .06s ease,box-shadow .06s ease}
.btn:hover{border-color:var(--tinta-2)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 0 var(--renglon)}
.btn.primary{background:var(--acento);border-color:var(--acento);color:var(--on-acento);box-shadow:0 2px 0 0 var(--tinta)}
.btn.primary:hover{border-color:var(--tinta)}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--tinta-3)}
.small{font-size:13px}

/* ---------- Libro ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--tinta-3);font-size:11.5px;letter-spacing:.02em;padding:10px 12px 8px;border-bottom:3px double var(--renglon);white-space:nowrap;background:var(--hoja)}
td{padding:7px 12px;height:var(--alto-renglon);border-bottom:1px solid var(--renglon);vertical-align:middle}
th:first-child,td:first-child{border-right:4px double var(--margen)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:3px double var(--tinta-2);border-bottom:0;background:var(--hoja)}
tfoot td.r span{text-decoration:underline double;text-underline-offset:5px;text-decoration-thickness:1px}
.base-legal{font-size:12.5px;color:var(--tinta-3);padding:10px 16px;border-top:1px dashed var(--renglon)}
.pin{font-family:var(--font-maquina);letter-spacing:.5em;font-size:20px}
.login .aviso-off{width:100%;max-width:420px;background:var(--sello-ambar-suave);border:1px dashed var(--sello-ambar);border-radius:4px;padding:10px 14px;font-size:14px;color:var(--tinta);display:flex;gap:10px;align-items:flex-start}
.login .aviso-off b{color:var(--sello-ambar)}
.login .aviso-off svg{color:var(--sello-ambar);margin-top:2px}
td.r,th.r{text-align:right;white-space:nowrap}
td.r{font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
td.num{white-space:nowrap}
tbody tr:hover td{background:var(--acento-suave)}
.pill{--c:var(--tinta-2);--cs:var(--hoja-alt);display:inline-flex;align-items:center;gap:4px;padding:2px 7px;color:var(--c);background:var(--cs);border:1px solid var(--c);border-radius:3px;font-family:var(--font-forma);font-stretch:80%;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill svg.i{width:14px;height:14px}
.pill.ok{--c:var(--sello-verde);--cs:var(--sello-verde-suave)}
.pill.warn{--c:var(--sello-ambar);--cs:var(--sello-ambar-suave)}
.pill.bad{--c:var(--sello-rojo);--cs:var(--sello-rojo-suave)}
.pill.info{--c:var(--sello-violeta);--cs:var(--sello-violeta-suave)}
.iva{font-family:var(--font-maquina);font-size:11.5px;font-weight:500;border-radius:3px;padding:0 4px;border:1px solid var(--linea);color:var(--tinta-2);white-space:nowrap}
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 16px;min-height:var(--alto-renglon);border-bottom:1px solid var(--renglon)}
.list .it:last-child{border-bottom:0}
.list .it .t{min-width:0;flex:1}
.list .it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--renglon)}
.stat:last-child{border-bottom:0}

/* ---------- Gráficos ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--renglon)}
.chart .bar.today{fill:var(--acento)}
.chart .gl{stroke:var(--renglon);stroke-width:1;stroke-dasharray:3 3}
.chart text{fill:var(--tinta-3);font-size:11.5px;font-family:var(--font-maquina)}
.chart text.v{fill:var(--tinta);font-weight:600}
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:14px}
.hbar .trk{height:10px;background:var(--hoja-alt);border:1px solid var(--renglon)}
.hbar .fill{height:100%;background:var(--acento)}
.hbar .val{text-align:right;font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- Caja ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:20px;align-items:start}
#cartbox{position:sticky;top:96px;filter:drop-shadow(0 1px 1px rgba(26,36,64,.14)) drop-shadow(0 6px 14px rgba(26,36,64,.08))}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tinta-3)}
.search .input{padding-left:42px;min-height:52px;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cats button{border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:5px 12px;white-space:nowrap;font-size:14px;min-height:36px;color:var(--tinta-2)}

/* --- Caja --- */
function totals(){
  let ex=0, bi=0, br=0;
  S.cart.forEach(c => { const p = P.find(x=>x.id===c.id); const t = p.price*c.q; if (p.iva==='E') ex+=t; else if (p.iva==='R') br+=t; else bi+=t; });
  const iva = bi*0.16 + br*0.08, base = ex+bi+br+iva;
  const div = S.pays.filter(p=>p.div).reduce((a,p)=>a+p.a,0);
  const igtf = S.spe ? div*0.03 : 0, paid = S.pays.reduce((a,p)=>a+p.a,0);
  return {ex,bi,br,iva,base,igtf,total:base+igtf,paid,rem:Math.max(0,+(base-paid).toFixed(2)),over:Math.max(0,+(paid-base).toFixed(2)),items:S.cart.reduce((a,c)=>a+c.q,0)};
}
if (!S.secs) S.secs = [...new Set(P.map(p=>p.cat))];
const CTRL_SECS = ['Psicotrópicos'];
const cats = () => ['Todos', ...S.secs];
const norm = x => String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const IVA_T = {E:'(E) Exento', G:'(G) 16%', R:'(R) 8%'};
const equivs = p => p.act && p.act!=='—' ? P.filter(x=>x.act===p.act && x.id!==p.id) : [];
function prodCard(p, alt){
  const out = p.stock<=0;
  return `<button class="prod${out?' agotado':''}${alt?' alt':''}" data-act="add" data-id="${p.id}">
    <span class="tags"><span class="iva" title="${IVA_T[p.iva]}">(${p.iva})</span>${p.ctrl?'<span class="pill bad">Controlado</span>':p.rx?'<span class="pill info">Récipe</span>':''}${out?'<span class="pill bad">Agotado</span>':p.stock<p.min?'<span class="pill warn">Poco stock</span>':''}${alt?'<span class="pill ok">Equivalente</span>':''}</span>
    <span class="nm">${p.name}</span><span class="meta">${p.act!=='—'?p.act+' · ':''}${p.pres} · ${p.lab}</span>
    <span class="pr"><b>${usd(p.price)}</b><span>${bs(p.price*S.rate)}</span></span>
    <span class="meta num">Existencia ${p.stock}</span></button>`;
}
function prodGrid(){
  const q = norm(S.q.trim());
  const list = P.filter(p => (S.cat==='Todos'||p.cat===S.cat) && (!q || norm(p.name+' '+p.act+' '+p.code+' '+p.lab).includes(q)));
  if (!list.length) return `<div class="empty panel">${ic('search')}<b>No hay productos con “${S.q}”.</b><span>Busca por nombre, principio activo o escanea el código de barras.</span><button class="btn sm" data-act="falla" data-p="${S.q.replace(/"/g,'')}">${ic('alert')}Anotar como falla</button></div>`;
  let html = list.map(p=>prodCard(p)).join('');
  if (q){
    const acts = [...new Set(list.map(p=>p.act).filter(a=>a && a!=='—'))];
    const alts = P.filter(p => acts.includes(p.act) && !list.includes(p));
    if (alts.length) html += `<div class="alt-h">${ic('pill')}<span>Con el mismo principio activo (<b>${acts.join(', ')}</b>), también hay:</span></div>` + alts.map(p=>prodCard(p,true)).join('');
  }
  return html;
}

function qrSvg(seed){
  let x = seed * 9301 + 49297, cells = '';
  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  const finder = (cx, cy) => `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#1a2440"/><rect x="${cx+1}" y="${cy+1}" width="5" height="5" fill="#fff"/><rect x="${cx+2}" y="${cy+2}" width="3" height="3" fill="#1a2440"/>`;
  for (let i=0;i<25;i++) for (let j=0;j<25;j++){ const inF = (i<8&&j<8)||(i<8&&j>16)||(i>16&&j<8); if (!inF && rnd()>.52) cells += `<rect x="${j}" y="${i}" width="1" height="1" fill="#1a2440"/>`; }
  return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="Código QR de verificación (muestra)">${finder(0,0)}${finder(18,0)}${finder(0,18)}${cells}</svg>`;
}

  const pc = ISLR_T[k][pn?1:2], r = pc/100;

  const sus = UT*r*UT_F; return {pc, sus, ret:bsA*r - sus};
}

const TARIFA1 = [[1000,.06,0],[1500,.09,30],[2000,.12,75],[2500,.16,155],[3000,.20,255],[4000,.24,375],[6000,.29,575],[Infinity,.34,875]];
function ariPct(e){ const ut = e.sal*12/UT, base = ut - 774; if (ut <= 1000 || base <= 0) return 0;
  const [,r,sus] = TARIFA1.find(([l])=>base<=l); return Math.max(0, base*r - sus - 10 - 10*e.cargas)/ut; }
const pctTxt = v => (v*100).toFixed(2).replace('.',',') + ' %';

function quincena(e){
  const sal = e.sal/2, ivss = Math.min(e.sal, 5*SM)*0.04/2, rpe = Math.min(e.sal, 10*SM)*0.005/2, faov = e.sal*0.01/2, islr = sal*ariPct(e);
  const ded = ivss+rpe+faov+islr, netoBs = sal-ded, bonos = e.bono/2, cesta = e.cesta;
  return {sal, ivss, rpe, faov, islr, ded, netoBs, bonos, cesta, netoUSD: netoBs/S.rate + bonos + cesta};
}
function costoMes(e){
  const R = S.rate, pagado = e.sal/R + e.bono + e.cesta;
  const patronal = (Math.min(e.sal,5*SM)*0.09 + Math.min(e.sal,10*SM)*0.02 + e.sal*0.02)/R;
  const pens = Math.max(pagado, ING_MIN)*PENS;
  const prov = (e.sal/30)*(5 + 2.5 + 2.5)/R;
  return {pagado, patronal, pens, prov, total: pagado+patronal+pens+prov};
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (S.sidebar && !e.target.closest('.side')) { S.sidebar=false; render(); } if (e.target.id==='modal') closeModal(); return; }
  const a = b.dataset.act, id = +b.dataset.id;
  if (b.tagName==='A') e.preventDefault();
  switch(a){
    case 'nav': go(b.dataset.v); break;
    case 'role': S.role = b.dataset.r; S.user = ROLES[S.role].user; render(); break;
    case 'logout': go('login'); break;
    case 'menu': S.sidebar = !S.sidebar; render(); break;
    case 'net':
      S.online = !S.online;
      if (S.online){ const n = S.queue.length, k = S.queue.filter(q=>q.cont).length; S.queue = [];
        toast(n?`Conexión restablecida · ${n} ${n===1?'venta sincronizada':'ventas sincronizadas'}${k?` y ${k} ${k===1?'factura de contingencia reportada':'facturas de contingencia reportadas'} en PDF a la imprenta`:''}`:'Conexión restablecida'); }
      else toast('Sin internet: la caja sigue funcionando');
      render(); break;
    case 'cat': S.cat = b.dataset.c; rerenderPOS(); document.querySelectorAll('.cats button').forEach(x=>x.classList.toggle('on', x.dataset.c===S.cat)); break;
    case 'add': { const p = P.find(x=>x.id===id); const c = S.cart.find(x=>x.id===id); const q = c?c.q:0;
      if (p.stock<=0) { const eq = equivs(p).find(x=>x.stock>0); toast(eq ? `${p.name} está agotado. Con ${p.act} hay ${eq.name} a ${usd(eq.price)}` : `${p.name} está agotado: anótalo como falla`); break; }
      if (q >= p.stock) { toast('No hay más existencia de este producto'); break; }
      if (p.ctrl && S.role==='Cajero') { toast('Controlado: lo despacha la regente con el récipe especial'); break; }
      c ? c.q++ : S.cart.push({id, q:1});
      const alr = S.client && ALERTAS[S.client.ci] && ALERTAS[S.client.ci].acts.includes(p.act);
      if (alr && !c) toast(`Consulta a la regente antes de vender ${p.name} a este cliente`);
      else if (p.ctrl && !c) toast(`${p.name}: controlado. Registra el récipe especial; la salida va al libro de controlados`);
      else if (p.rx && !c) toast(`${p.name}: pide el récipe al cliente`);
      rerenderPOS(); break; }
    case 'inc': { const c = S.cart.find(x=>x.id===id); const p = P.find(x=>x.id===id); if (c.q < p.stock) c.q++; rerenderPOS(); break; }
    case 'dec': { const c = S.cart.find(x=>x.id===id); c.q--; if (!c.q) S.cart = S.cart.filter(x=>x.id!==id); rerenderPOS(); break; }
    case 'rm': S.cart = S.cart.filter(x=>x.id!==id); rerenderPOS(); break;
    case 'client': { const raw = ($('#ci').value||'').trim().toUpperCase(); const v = raw.replace(/[^0-9JVEG]/g,'');
      if (!v) { S.client = null; S.newClient = null; rerenderPOS(); break; }
      const c = CLIENTS.find(x=>x.ci.replace(/[^0-9JVEG]/g,'')===v || x.ci.replace(/[^0-9]/g,'')===v.replace(/[^0-9]/g,''));
      if (c) { S.client = c; S.newClient = null; rerenderPOS(); toast(`${c.name} encontrado`); }
      else { const ci = /^[VEJG]/.test(v) ? v[0]+'-'+v.slice(1) : 'V-'+v; S.client = null; S.newClient = {ci}; rerenderPOS(); const n = $('#nc-name'); n && n.focus(); }
      break; }
    case 'nc-cancel': S.newClient = null; S.client = null; rerenderPOS(); break;
    case 'nc-save': { const name = ($('#nc-name').value||'').trim(); if (!name) { toast('Escribe el nombre para guardar el cliente'); $('#nc-name').focus(); break; }
      const c = {ci:S.newClient.ci, name, tel:($('#nc-tel').value||'').trim()||'—', visits:0, total:0, last:'26/10/2026', pts:0};
      CLIENTS.unshift(c); S.client = c; S.newClient = null; rerenderPOS(); toast(`${name} quedó registrado. La próxima vez aparece con solo poner la cédula`); break; }
    case 'checkout': S.pays = []; S.stamped = false; openModal(payModal()); break;
    case 'addpay': { const m = METHODS.find(x=>x.k===b.dataset.k); const t = totals(); if (t.rem<=0) { toast('El pago ya está completo'); break; }
      if (m.cashea) { if (S.pays.some(p=>p.cashea)) { toast('Esta venta ya tiene Cashea'); break; }
        S.pays.push({k:'Cashea (cuotas)', div:false, cashea:true, a:+(t.rem*(1-CASHEA_INI)).toFixed(2)}); openModal(payModal());
        toast(`Cashea financia ${Math.round((1-CASHEA_INI)*100)} %: cobra ahora la inicial con otra forma de pago`); break; }
      S.pays.push({k:m.k, div:m.div, a:t.rem}); openModal(payModal()); break; }
    case 'delpay': S.pays.splice(+b.dataset.i,1); openModal(payModal()); break;
    case 'emit': {
      const t = totals(); const n = String(S.inv).padStart(8,'0');
      const items = S.cart.map(c=>({p:P.find(x=>x.id===c.id), q:c.q}));
      const now = new Date(); const tm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      const mode = S.medio==='maquina' ? 'maquina' : (S.online ? 'digital' : 'cont');
      let ctrl = ctrlNum(S.inv);
      if (mode==='cont'){ const el = $('#contnum'); ctrl = (el && el.value.trim()) || contNum(S.cont); S.cont++; }
      const cajaN = ROLES[S.role].caja==='Todas las cajas'?'Caja 1':ROLES[S.role].caja;
      const sale = {n, t:tm, client:S.client, items, pays:S.pays.slice(), t_:t, offline:!S.online, mode, ctrl, u:S.user, v:vendNow(), caja:cajaN};
      items.forEach(({p,q})=>{ p.stock -= q; let r=q; p.lots.filter(l=>daysTo(l.e)>=0).sort((a,b)=>a.e.localeCompare(b.e)).forEach(l=>{const d=Math.min(l.q,r); l.q-=d; r-=d;}); });
      const cz = S.pays.find(p=>p.cashea);
      if (cz) S.cashea.unshift({c:S.client?S.client.name:'Consumidor final', f:'26/10/2026', total:+t.total.toFixed(2), fin:cz.a, cuota:+(cz.a/CASHEA_CUOTAS).toFixed(2), pagadas:0});
      const rec = {t:tm, n, c:S.client?S.client.name:'Consumidor final', m:cz?'Cashea':(S.pays.length>1?'Mixto':S.pays[0].k), usd:+t.total.toFixed(2), u:S.user, v:vendNow(), caja:cajaN, cont:mode==='cont', ctrl, it:items.map(({p,q})=>[p.id,q])};
      S.sales.unshift(rec); if (!S.online) S.queue.unshift(rec);
      if (S.client) { S.client.visits++; S.client.total += t.total; S.client.pts += Math.floor(t.total); }
      S.inv++; S.cart = []; S.client = null; S.newClient = null; S.pays = [];
      openModal(ticketModal(sale)); rerenderPOS();
      if (!S.online) { const ob = document.querySelector('.offbar span'); if (ob) ob.innerHTML = offText(); }
      break; }
    case 'newsale': closeModal(); break;
    case 'close': closeModal(); if (S.view!=='pos') render(); break;
    case 'repx': openModal(`<div class="sheet" style="max-width:440px"><div class="hd"><h2>Reporte X</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="bd"><div class="printer"></div><div class="tkwrap"><pre class="ticket printing">${zText('X')}</pre></div><button class="btn" data-act="close">Listo</button></div></div>`); break;
    case 'repz': if (S.zDone) { toast(`El Reporte Z de hoy ya se hizo: ${S.zDone}`); break; } openModal(`<div class="sheet" style="max-width:440px"><div class="hd"><h2>Cierre del día</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="bd"><p>El Reporte Z cierra la jornada en la memoria fiscal de la impresora. Después de hacerlo, las ventas siguientes cuentan para mañana.</p><div class="row"><button class="btn" style="flex:1" data-act="close">Cancelar</button><button class="btn primary" style="flex:1" data-act="dozz">Hacer Reporte Z</button></div></div></div>`); break;
    case 'dozz': openModal(`<div class="sheet" style="max-width:440px"><div class="hd"><h2>Reporte Z #00${S.z} impreso</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="bd"><div class="printer"></div><div class="tkwrap"><pre class="ticket printing">${zText('Z')}</pre><span class="sello tk-sello estampar">Cierre fiscal<small>Z #00${S.z} · 20:01</small></span></div><button class="btn" data-act="close">Listo</button></div></div>`); S.zDone = `#00${S.z} a las 20:01, por ${S.user}`; S.z++; break;
    case 'receive': { const miss = RECV.filter(r=>!r.l||!r.e).length; if (miss) { toast(`Completa lote y vencimiento en ${miss} ${miss===1?'producto':'productos'} antes de cargar`); break; }
      const n = RECV.length; RECV.forEach(r=>{const p=P.find(x=>x.id===r.id); p.lots.push({l:r.l,e:r.e,q:r.q}); p.stock+=r.q; p.cost=r.c;}); RECV = [];
      toast(`Compra cargada: ${n} productos y sus lotes entraron al inventario`); render(); break; }
    case 'recvdel': RECV.splice(+b.dataset.i,1); render(); break;
    case 'buytab': S.buyTab = b.dataset.k; render(); break;
    case 'rper': S.repPeriod = b.dataset.p; render(); break;
    case 'libro': S.libro = b.dataset.k; render(); break;
    case 'gasto': openModal(gastoModal()); break;
    case 'offlogin': S.online = false; go('login'); break;
    case 'spe': S.spe = !S.spe; toast(S.spe?'Módulo contribuyente especial activo: IGTF 3% en divisas y retenciones de IVA':'Módulo contribuyente especial quitado: contribuyente ordinario'); render(); break;
    case 'medio': S.medio = S.medio==='digital'?'maquina':'digital'; toast(S.medio==='digital'?'Facturación por imprenta digital':'Facturación por máquina fiscal (para clientes que ya tienen una)'); render(); break;
    case 'cierre': openModal(`<div class="sheet" style="max-width:440px"><div class="hd"><h2>Cierre del día</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="bd"><div class="printer"></div><div class="tkwrap"><pre class="ticket printing">${cierreText()}</pre><span class="sello tk-sello estampar">Cierre del día<small>26-10-2026 · 20:01</small></span></div><button class="btn" data-act="close">Listo</button></div></div>`); break;
    case 'invf': S.invFilter = b.dataset.c; render(); break;
    case 'rxtab': S.rxTab = b.dataset.k; render(); break;
    case 'empsel': S.empSel = id; render(); break;
    case 'nomtab': S.nomTab = b.dataset.k; render(); break;
    case 'recibo': { const e = EMP.find(x=>x.id===id); openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rbt" style="max-width:440px"><div class="hd"><h2 id="rbt">Recibo de pago</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="bd"><div class="printer"></div><div class="tkwrap"><pre class="ticket printing">${reciboText(e)}</pre><span class="sello ${S.nomEstado==='pagada'?'verde':'ambar'} tk-sello estampar">${S.nomEstado==='pagada'?'Pagado':'Por pagar'}<small>${S.nomEstado==='pagada'?'30-10-2026':'Quincena del 30/10'}</small></span></div><div class="row"><button class="btn" style="flex:1" data-act="toast" data-m="Recibo enviado por WhatsApp a ${e.n}">${ic('wa')}WhatsApp</button><button class="btn" style="flex:1" data-act="close">Listo</button></div></div></div>`); break; }
    case 'nompagar': { const tot = EMP.reduce((a,e)=>a+quincena(e).netoUSD,0); S.nomEstado = 'pagada';
      S.gastos.push({f:'30/10/2026', cat:'Nómina', desc:'Segunda quincena (4 personas)', cta:'Banesco', usd:+tot.toFixed(2), fijo:true});
      render(); toast(`Quincena pagada: ${usd(tot)}. Quedó registrada como gasto en Ganancias y gastos`); break; }
    case 'nomrecibos': S.recibos = true; render(); toast('4 recibos enviados por WhatsApp, cada uno con su detalle'); break;
    case 'prodnew': openModal(prodModal()); break;
    case 'secadd': { const nm = ($('#secname').value||'').trim().replace(/\s+/g,' '); if (!nm) { toast('Escribe el nombre de la sección'); $('#secname').focus(); break; }
      if (S.secs.some(x=>norm(x)===norm(nm))) { toast(`La sección ${nm} ya existe`); break; }
      S.secs.push(nm); render(); toast(`Sección ${nm} agregada: ya sale en la caja y al crear productos`); break; }
    case 'falla': openModal(fallaModal(b.dataset.p || '')); break;
    case 'verfallas': S.view = 'dashboard'; render(); { const el = $('#fallas'); el && el.scrollIntoView({behavior:'smooth', block:'start'}); } S.fallas.forEach(f=>f.nuevo=false); { const ch = document.querySelector('.chip.alerta'); ch && ch.remove(); } break;
    case 'fallapedido': toast(`${S.fallas.length} fallas pasaron al próximo pedido de droguería, en Compras`); S.fallas.forEach(f=>f.nuevo=false); render(); break;
    case 'fbuscar': S.fq = ($('#fq').value||'').trim(); render(); break;
    case 'nenew': if (!S.client) { toast('La nota de entrega va a nombre de un cliente: busca su cédula o RIF'); const ci = $('#ci'); ci && ci.focus(); break; } openModal(neModal()); break;
    case 'nefact': { const x = S.notas[+b.dataset.i]; const n = String(S.inv).padStart(8,'0'); const now = new Date(), hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      S.sales.unshift({t:hm, n, c:x.c.name, m:'Crédito', usd:x.usd, u:S.user, v:x.u, caja:ROLES[S.role].caja==='Todas las cajas'?'Caja 1':ROLES[S.role].caja, it:x.it, ctrl:ctrlNum(S.inv)});
      x.est = 'Facturada · ' + n; S.inv++; render(); toast(`Factura ${n} emitida a partir de la nota ${x.n}. El inventario ya había bajado con la nota`); break; }
    case 'go177': S.libro = 'inventario'; go('fiscal'); { const el = document.querySelector('[data-act="libro"][data-k="inventario"]'); el && el.scrollIntoView({block:'center'}); } break;
    case 'rxnew': openModal(rxModal()); if (S.role!=='Farmacéutico'){ const h = $('#rx-hint'); if (h) h.textContent = 'Demostración: en el sistema real los récipes los registra la regente; el dueño solo los consulta.'; } break;
    case 'toast': toast(b.dataset.m); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id==='q'){ S.q = e.target.value; const pr = $('#prods'); if (pr) pr.innerHTML = prodGrid(); }
  if (e.target.id==='rxq'){ S.rxq = e.target.value; const tb = $('#rxbody'); if (tb) tb.innerHTML = rxRows(); }
  if (e.target.id==='rx-ci'){ const v = e.target.value.replace(/[^0-9]/g,''); const c = v.length>=7 && CLIENTS.find(x=>x.ci.replace(/[^0-9]/g,'')===v);
    if (c) { $('#rx-pac').value = c.name; const h = $('#rx-hint'); if (h) h.textContent = `${c.name} ya es paciente: su historial y sus alertas se cargan solos.`; } }
  if (['g-monto','g-mon','g-islr'].includes(e.target.id)) islrHint();
  if (e.target.id==='p-act') actHint();
  if (e.target.dataset.pay!==undefined){ const i = +e.target.dataset.pay; const v = parseVE(e.target.value); S.pays[i].a = e.target.dataset.cur==='bs' ? v / S.rate : v;
    const sb = document.querySelector(`[data-sub="${i}"]`); if (sb) sb.textContent = paySub(S.pays[i]);
    const t = totals(); const due = document.querySelector('.due'); if (due){ due.className = 'due '+(t.rem>0?'pend':'done'); due.innerHTML = dueHtml(t); }
    const em = document.querySelector('[data-act="emit"]'); if (em) em.disabled = t.rem>0; }
});
document.addEventListener('change', e => {
  if (e.target.dataset.pay!==undefined) openModal(payModal());
  if (['g-mon','g-islr'].includes(e.target.id)) islrHint();
  if (e.target.id==='vend') S.vend = e.target.value;
  if (e.target.id==='rx-med' && e.target.value==='new'){ e.target.value = '0'; toast('Se abre la ficha para agregar al médico con su MPPS'); }
  if (e.target.id==='rx-tipo'){ const h = $('#rx-hint'); if (h) h.textContent = {medico:'El original se archiva; la copia del paciente sale con la etiqueta de despacho.', antibiotico:'Antibiótico: siempre con récipe. El original se archiva en la farmacia.', especial:'Récipe especial: lo despacha la regente, el número no se puede repetir y la salida se anota sola en el libro de controlados.'}[e.target.value];
    if (e.target.value==='especial'){ $('#rx-prod').value = 'Clonazepam 0,5 mg'; $('#rx-rec').value = '30'; $('#rx-desp').value = '30'; } }
  if (e.target.dataset.recv!==undefined){ const r = RECV[+e.target.dataset.recv], fld = e.target.dataset.f, v = e.target.value.trim();
    r[fld] = fld==='q' ? (parseInt(v)||0) : fld==='c' ? (parseFloat(v.replace(',','.'))||0) : v.toUpperCase().replace(/^(\d{4}-\d{2}-\d{2})$/i, m=>m.toLowerCase()); render(); }
});
function scanAdd(){
  const el = $('#scan'); const v = (el.value||'').trim().toLowerCase(); if (!v) return;
  const p = P.find(x=>x.code===v) || P.find(x=>x.name.toLowerCase().includes(v) || x.act.toLowerCase().includes(v));
  if (!p) { toast('No está en el catálogo: se abre la ficha de producto nuevo'); el.value=''; return; }
  const ex = RECV.find(r=>r.id===p.id && !r.l);
  ex ? ex.q++ : RECV.push({id:p.id, l:'', e:'', q:1, c:p.cost});
  render(); const s2 = $('#scan'); s2 && s2.focus();
}
document.addEventListener('submit', e => {
  if (e.target.id==='gastoForm'){ e.preventDefault(); const v = parseVE($('#g-monto').value), d = ($('#g-desc').value||'').trim();
    if (!v) { toast('Escribe el monto del gasto'); $('#g-monto').focus(); return; }
    const usdV = $('#g-mon').value==='bs' ? v/S.rate : v;
    const ri = $('#g-islr').value, ben = ($('#g-ben').value||'').trim();
    if (ri && !ben) { toast('Escribe a quién se le paga para hacer el comprobante de retención'); $('#g-ben').focus(); return; }
    const ret = ri ? {k:ri.split('-')[0], pn:ri.endsWith('pn'), a:ben, tasa:S.rate, bs:$('#g-mon').value==='bs' ? v : v*S.rate, comp:'Por entregar'} : null;
    S.gastos.push({f:'26/10/2026', cat:$('#g-cat').value, desc:d||$('#g-cat').value, cta:$('#g-cta').value, usd:+usdV.toFixed(2), fijo:$('#g-rec').value==='1', ret});
    const rc = ret && islrCalc(ret.bs, ret.k, ret.pn);
    closeModal(); render(); toast(`Gasto registrado: ${usd(usdV)}.${rc&&rc.ret?` Retención de ISLR ${bs(rc.ret)}: comprobante listo para enviar.`:' La utilidad del mes ya lo descuenta.'}`); return; }
  if (e.target.id==='fallaForm'){ e.preventDefault(); const pn = ($('#fl-p').value||'').trim(); if (!pn) { toast('Escribe qué producto pidió el cliente'); $('#fl-p').focus(); return; }
    const now = new Date(), hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

  if (e.target.id==='prodForm'){ e.preventDefault(); const nm = ($('#p-name').value||'').trim(), act = ($('#p-act').value||'').trim(), price = parseVE($('#p-price').value), cost = parseVE($('#p-cost').value);

    if (!act) { toast('Escribe el principio activo, o un guion si no tiene'); $('#p-act').focus(); return; }
    if (!price) { toast('Escribe el precio de venta'); $('#p-price').focus(); return; }
    const same = P.find(x=>norm(x.act)===norm(act)), rx = $('#p-rx').value, id = Math.max(...P.map(x=>x.id))+1;
    P.push({id, code:($('#p-code').value||'').trim()||'—', name:nm, act:same?same.act:act, lab:($('#p-lab').value||'').trim()||'—', pres:($('#p-pres').value||'').trim()||'—', cat:$('#p-sec').value, iva:$('#p-iva').value, cost:cost||0, price, stock:0, min:5, rx:rx!=='no', ctrl:rx==='ctrl', lots:[]});
    const eq = equivs(P[P.length-1]);
    closeModal(); render(); toast(`${nm} guardado con ${P[P.length-1].act}.${eq.length?` En la caja sale junto a ${eq.map(x=>x.name).join(', ')}.`:''} La existencia entra al cargar una compra`); return; }
  if (e.target.id==='neForm'){ e.preventDefault();
    const now = new Date(), hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'), t = totals();
    const it = S.cart.map(c=>[c.id,c.q]);
    it.forEach(([id,q])=>{ const p = P.find(x=>x.id===id); p.stock -= q; let r=q; p.lots.filter(l=>daysTo(l.e)>=0).sort((a,b)=>a.e.localeCompare(b.e)).forEach(l=>{const d=Math.min(l.q,r); l.q-=d; r-=d;}); });
    const [y,m,d] = $('#ne-v').value.split('-'), x = {n:'NE-'+String(S.neN).padStart(6,'0'), ctrl:S.online?'00-0000'+String(7000+S.neN):'Pendiente (sin internet)', f:'26/10/2026', h:hm, c:S.client, it, usd:+t.base.toFixed(2), u:vendNow(), mot:$('#ne-mot').value, vence:`${d}/${m}/${y}`, est:'Por facturar'};
    S.neN++; S.notas.unshift(x); S.cart = []; S.client = null; S.newClient = null;
    openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nett" style="max-width:440px"><div class="hd"><h2 id="nett">Nota de entrega ${x.n}</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="bd"><p class="envio">${ic('check')}Enviada a la imprenta digital <span class="pill ok">Control ${x.ctrl}</span></p><div class="printer"></div><div class="tkwrap"><pre class="ticket printing">${neText(x)}</pre><span class="sello ambar tk-sello estampar">Por facturar<small>antes del ${x.vence}</small></span></div><div class="row"><button class="btn" style="flex:1" data-act="close">Listo</button><button class="btn primary" style="flex:1" data-act="newsale">Nueva venta</button></div></div></div>`);
    rerenderPOS(); return; }
  if (e.target.id==='rxForm'){ e.preventDefault();
    const ci = ($('#rx-ci').value||'').trim().toUpperCase(), pac = ($('#rx-pac').value||'').trim(), tipo = $('#rx-tipo').value, num = ($('#rx-num').value||'').trim().replace(/\D/g,'');
    const prod = $('#rx-prod').value, rec = parseInt($('#rx-rec').value)||0, desp = parseInt($('#rx-desp').value)||0, med = +$('#rx-med').value, cron = $('#rx-cron').value==='1';
    const prP = P.find(p=>p.name===prod), ctrl = !!(prP && prP.ctrl);
    if (!ci) { toast('Escribe la cédula del paciente'); $('#rx-ci').focus(); return; }
    if (!pac) { toast('Escribe el nombre del paciente'); $('#rx-pac').focus(); return; }
    if (ctrl && tipo!=='especial') { toast(`${prod} es controlado: va con récipe especial`); $('#rx-tipo').focus(); return; }
    if (tipo==='especial' && !ctrl) { toast('Ese medicamento no es controlado: elige récipe médico o antibiótico'); $('#rx-tipo').focus(); return; }
    if (tipo==='especial' && !num) { toast('Escribe el número del récipe especial'); $('#rx-num').focus(); return; }
    const usado = tipo==='especial' && (RX.find(r=>r.num===num && !r.bloq) || CTRL.find(r=>r[2].endsWith('N° '+num)));
    if (usado) { toast(`El récipe especial N° ${num} ya se despachó. No se puede usar otra vez`); return; }
    if (rec<=0) { toast('Escribe la cantidad recetada'); $('#rx-rec').focus(); return; }
    if (desp>rec) { toast('No se puede entregar más de lo recetado'); $('#rx-desp').focus(); return; }
    const cid = ci.replace(/[^0-9]/g,''), alk = Object.keys(ALERTAS).find(k=>k.replace(/[^0-9]/g,'')===cid);
    const pr = P.find(p=>p.name===prod), alr = alk && pr && ALERTAS[alk].acts.includes(pr.act);
    if (alr) { toast(`Alerta del paciente: ${ALERTAS[alk].txt}. Confírmalo con el médico antes de despachar`); return; }
    const now = new Date(), hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    const known = CLIENTS.find(x=>x.ci.replace(/[^0-9]/g,'')===cid), ciF = known ? known.ci : (/^[VEJG]/.test(ci)?ci[0]:'V')+'-'+cid.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    const u = ctrl ? 'tabletas' : (rec===1?'caja':'cajas'), id = S.rxN++;
    RX.unshift({id, f:'26/10/2026', h:hm, ci:ciF, pac, med, tipo, num:num||undefined, prod, rec, desp, u, cron, orig:cron?'Devuelto sellado':'Archivado'});
    if (ctrl && desp) { const [tt, nm, ...ap] = MEDICOS[med].n.split(' '), last = CTRL.map(r=>r[1]).lastIndexOf(prod);
      CTRL.splice(last+1, 0, ['26/10/2026', prod, 'Récipe especial N° '+num, `${tt} ${nm[0]}. ${ap.join(' ')} · ${MEDICOS[med].mpps}`, ciF, (prP.lots[0]||{l:'—'}).l, 0, desp]); }
    S.rxTab = 'lista'; S.rxq = ''; closeModal(); render();
    toast(`${rxNum(id)} guardado. ${desp<rec?`Quedan ${rec-desp} ${u} pendientes en la ficha del paciente`:'Despacho completo'}${ctrl&&desp?' · anotado en el libro de controlados':''}`); return; }
  if (e.target.id==='loginForm'){ e.preventDefault(); go('dashboard'); if (!S.online) toast(`Sesión abierta sin internet con PIN · ${S.user}`); } });
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#modal').hidden) closeModal(); if (e.key==='Enter' && e.target.id==='ci'){ e.preventDefault(); document.querySelector('[data-act="client"]').click(); }
  if (e.key==='Enter' && e.target.id==='scan'){ e.preventDefault(); scanAdd(); }
  if (e.key==='Enter' && e.target.id==='fq'){ e.preventDefault(); document.querySelector('[data-act="fbuscar"]').click(); }
  if (e.key==='Enter' && e.target.id==='secname'){ e.preventDefault(); document.querySelector('[data-act="secadd"]').click(); } });

(function init(){
  const h = (location.hash||'').slice(1);
  if (h && V[h] && h!=='login' && h!=='myShift') S.view = h;
  render();
})();
</script>

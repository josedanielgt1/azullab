<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Azullab CrossFit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Kalam:wght@400;700&display=swap">
<style>
/* =====================================================================
   PAPEL FISCAL · sistema de diseño de Cuadre
   Capa 1: tokens (papel / carbón). Capa 2: color del cliente (Azullab).
   Capa 3: componentes aplicados a esta maqueta.
   Diseño: mesa → separadores de archivador → carpeta abierta → hojas con folio.
   ===================================================================== */
:root{
  --mesa:#e8ebef; --hoja:#ffffff; --hoja-alt:#f4f6f9; --renglon:#cbd8ea; --linea:#6f7d94; --margen:#d2453b;
  --tinta:#1a2440; --tinta-2:#4e5a73; --tinta-3:#5d6882;
  --sello-verde:#1f7a43; --sello-verde-suave:#e3f3e8; --sello-rojo:#b3261e; --sello-rojo-suave:#fbe6e4;
  --sello-ambar:#8a5300; --sello-ambar-suave:#fdf0d8; --sello-violeta:#5b3aa6; --sello-violeta-suave:#efe9fb;
  --foco:#1a2440;
  --sombra-hoja:0 1px 2px rgba(26,36,64,.08),0 0 0 1px rgba(26,36,64,.06);
  --sombra-pila:0 1px 2px rgba(26,36,64,.08),0 0 0 1px rgba(26,36,64,.06),5px 5px 0 -1px #ffffff,5px 5px 0 0 #cbd8ea;
  --sombra-flotante:0 18px 48px rgba(13,18,32,.28);
  /* Color del cliente: Azullab Farmacia (celeste y blanco) */
  --acento:#00d2d6; --on-acento:#0b1450; --acento-tinta:#2a30d6; --acento-suave:#e4f9fa; --marca:#0e1752;
  --font-forma:"Archivo","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-maquina:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --alto-renglon:40px;
  /* alias que usa el contenido de la maqueta */
  --ink:var(--tinta); --ink-2:var(--tinta-2); --ink-3:var(--tinta-3); --line:var(--renglon); --azul:var(--acento-tinta);
  --celeste-50:var(--acento-suave); --ok:var(--sello-verde); --warn:var(--sello-ambar); --bad:var(--sello-rojo);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --mesa:#0d1220; --hoja:#161d2e; --hoja-alt:#1c2438; --renglon:#2a3650; --linea:#6b7a95; --margen:#e06a5f;
  --tinta:#e7ecf5; --tinta-2:#a3aec4; --tinta-3:#8794ae;
  --sello-verde:#5fd08e; --sello-verde-suave:#12301f; --sello-rojo:#ff8a7f; --sello-rojo-suave:#3a1714;
  --sello-ambar:#f0b54d; --sello-ambar-suave:#33260d; --sello-violeta:#b9a2ff; --sello-violeta-suave:#251a45;
  --foco:#e7ecf5;
  --sombra-hoja:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06);
  --sombra-pila:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06),5px 5px 0 -1px #161d2e,5px 5px 0 0 #2a3650;
  --sombra-flotante:0 18px 48px rgba(0,0,0,.6);
  --acento:#22e0e3; --on-acento:#06092a; --acento-tinta:#9a9eff; --acento-suave:#10294a; --marca:#0e1752;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --mesa:#0d1220; --hoja:#161d2e; --hoja-alt:#1c2438; --renglon:#2a3650; --linea:#6b7a95; --margen:#e06a5f;
  --tinta:#e7ecf5; --tinta-2:#a3aec4; --tinta-3:#8794ae;
  --sello-verde:#5fd08e; --sello-verde-suave:#12301f; --sello-rojo:#ff8a7f; --sello-rojo-suave:#3a1714;
  --sello-ambar:#f0b54d; --sello-ambar-suave:#33260d; --sello-violeta:#b9a2ff; --sello-violeta-suave:#251a45;
  --foco:#e7ecf5;
  --sombra-hoja:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06);
  --sombra-pila:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06),5px 5px 0 -1px #161d2e,5px 5px 0 0 #2a3650;
  --sombra-flotante:0 18px 48px rgba(0,0,0,.6);
  --acento:#22e0e3; --on-acento:#06092a; --acento-tinta:#9a9eff; --acento-suave:#10294a; --marca:#0e1752;
  color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--mesa);color:var(--tinta);font-family:var(--font-forma);font-size:15px;line-height:1.47}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.num{font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;line-height:28px;font-weight:700}
h2{font-size:17px;line-height:22px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
svg.i{width:18px;height:18px;flex:none}

/* ---------- Entrada ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--mesa)}
.login .brandside{background:var(--acento);color:var(--on-acento);display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding-block:44px;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:56px;position:relative;
  -webkit-mask:linear-gradient(#000 0 0) left/calc(100% - 9px) 100% no-repeat,radial-gradient(circle 6px at 100% 8px,transparent 98%,#000) right top/9px 16px repeat-y;
          mask:linear-gradient(#000 0 0) left/calc(100% - 9px) 100% no-repeat,radial-gradient(circle 6px at 100% 8px,transparent 98%,#000) right top/9px 16px repeat-y}
.login .brandside h1{font-size:clamp(30px,3.6vw,46px);line-height:1.04;font-weight:800;letter-spacing:-.015em;max-width:15ch;color:var(--on-acento)}
.login .brandside p{max-width:44ch;color:var(--on-acento);font-size:16px;line-height:24px}
.login .facts{display:flex;flex-wrap:wrap;gap:8px}
.login .facts span{border:1.5px solid var(--on-acento);color:var(--on-acento);padding:3px 9px;border-radius:3px;font-stretch:80%;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.login .formside{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login form{width:100%;max-width:420px;display:grid;gap:14px;background:var(--hoja);box-shadow:var(--sombra-pila);border-radius:2px;padding:22px 22px 24px}
.login .firma{font-size:12.5px;color:var(--tinta-3)}
.login .firma b{color:var(--tinta-2);font-weight:800}
.field{display:grid;gap:3px;padding:7px 10px 8px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);min-width:0}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--foco)}
.field label{font-size:11.5px;line-height:14px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3)}
.field .input{border:0;padding:0;min-height:26px;background:transparent;box-shadow:none;font-size:16px;border-radius:0}
.field .input:focus{box-shadow:none}
.field:has(.roles){border:0;padding:0;background:none;box-shadow:none}
.roles{display:flex;gap:4px;border-bottom:1px solid var(--renglon);overflow-x:auto}
.roles button{border:1px solid transparent;border-bottom:0;background:var(--hoja-alt);border-radius:8px 8px 0 0;padding:0 14px;min-height:42px;margin-bottom:-1px;font-weight:600;color:var(--tinta-3);white-space:nowrap}
.roles button.on{background:var(--hoja);border-color:var(--renglon);color:var(--tinta)}
.input{width:100%;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:10px 12px;min-height:44px}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--foco)}

/* ---------- Mesa, separadores y carpeta ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--mesa);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:10px;padding:18px 18px 8px}
.side .nav{display:grid;gap:3px;padding:0 0 16px 10px}
.side .grp{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3);padding:14px 14px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.side .nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 14px;color:var(--tinta-2);text-decoration:none;border:1px solid transparent;border-right:0;border-radius:8px 0 0 8px;font-size:15px}
.side .nav a:hover{background:var(--hoja-alt);color:var(--tinta)}
.side .nav a.on{background:var(--hoja-alt);color:var(--tinta);font-weight:700;border-color:var(--renglon)}
.side .nav a .cod{margin-left:auto;font-family:var(--font-maquina);font-size:11px;color:var(--tinta-3);font-weight:400}
.side .foot{margin-top:auto;padding:14px 18px;border-top:1px dashed var(--linea);font-size:13px;color:var(--tinta-3)}
.side .foot .firma{margin-top:12px;font-size:11.5px}
.side .foot .firma b{font-weight:800;color:var(--tinta-2)}
.main{min-width:0;display:flex;flex-direction:column;background:var(--hoja-alt)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hoja-alt);border-bottom:3px double var(--renglon);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hoja-alt)}
.top .ttl{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1;flex-wrap:wrap}
.top .ttl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .folio{font-family:var(--font-maquina);font-size:12px;color:var(--tinta-3);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:4px 10px;font-size:13px;color:var(--tinta-2);min-height:34px;white-space:nowrap}
.chip b{font-family:var(--font-maquina);font-weight:600;color:var(--tinta)}
button.chip:hover{border-color:var(--tinta)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sello-verde);flex:none}
.chip.off{background:var(--sello-ambar-suave);border-color:var(--sello-ambar);color:var(--sello-ambar);font-weight:700}
.chip.off .dot{background:var(--sello-ambar)}
.menu-btn{display:none;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;width:44px;height:44px;align-items:center;justify-content:center}
.offbar{background:var(--sello-ambar-suave);color:var(--tinta);border-bottom:1px dashed var(--sello-ambar);padding-block:9px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.offbar svg{color:var(--sello-ambar)}
.offbar b{color:var(--sello-ambar)}
.content{padding-block:22px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.phase{font-family:var(--font-forma);font-stretch:80%;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:2px 7px;white-space:nowrap}
.phase.f1{color:var(--sello-violeta);background:var(--sello-violeta-suave)}
.phase.f2{color:var(--sello-verde);background:var(--sello-verde-suave)}
.lead{color:var(--tinta-2);max-width:75ch}

/* ---------- Hojas ---------- */
.panel{background:var(--hoja);border-radius:2px;box-shadow:var(--sombra-hoja);min-width:0}
.panel.doc{box-shadow:var(--sombra-pila)}
.panel>.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px 10px;border-bottom:1px solid var(--renglon)}
.pfolio{display:block;font-family:var(--font-maquina);font-size:11px;line-height:14px;font-weight:400;color:var(--tinta-3);margin-bottom:3px;letter-spacing:0}
.panel>.bd{padding:16px;min-width:0}
.panel>.bd.flush{padding:0}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* Planilla de cifras: casillas unidas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:4px;overflow:hidden;box-shadow:var(--sombra-hoja)}
.kpi{background:var(--hoja);padding:10px 14px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi .l{font-size:11.5px;line-height:14px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3)}
.kpi .v{font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-size:27px;line-height:34px;font-weight:600;letter-spacing:-.01em}
.kpi .s{font-size:13px;color:var(--tinta-2)}
.kpi .s.num{font-size:12.5px}
.kpi.hero{background:var(--acento-suave)}
.kpi.hero .l{color:var(--acento-tinta)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);color:var(--tinta);font-weight:600;font-size:15px;box-shadow:0 2px 0 0 var(--renglon);transition:transform .06s ease,box-shadow .06s ease}
.btn:hover{border-color:var(--tinta-2)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 0 var(--renglon)}
.btn.primary{background:var(--acento);border-color:var(--acento);color:var(--on-acento);box-shadow:0 2px 0 0 var(--tinta)}
.btn.primary:hover{border-color:var(--tinta)}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--tinta-3)}
.small{font-size:13px}

/* ---------- Libro ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--tinta-3);font-size:11.5px;letter-spacing:.02em;padding:10px 12px 8px;border-bottom:3px double var(--renglon);white-space:nowrap;background:var(--hoja)}
td{padding:7px 12px;height:var(--alto-renglon);border-bottom:1px solid var(--renglon);vertical-align:middle}
th:first-child,td:first-child{border-right:4px double var(--margen)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:3px double var(--tinta-2);border-bottom:0;background:var(--hoja)}
tfoot td.r span{text-decoration:underline double;text-underline-offset:5px;text-decoration-thickness:1px}
.base-legal{font-size:12.5px;color:var(--tinta-3);padding:10px 16px;border-top:1px dashed var(--renglon)}
.pin{font-family:var(--font-maquina);letter-spacing:.5em;font-size:20px}
.login .aviso-off{width:100%;max-width:420px;background:var(--sello-ambar-suave);border:1px dashed var(--sello-ambar);border-radius:4px;padding:10px 14px;font-size:14px;color:var(--tinta);display:flex;gap:10px;align-items:flex-start}
.login .aviso-off b{color:var(--sello-ambar)}
.login .aviso-off svg{color:var(--sello-ambar);margin-top:2px}
td.r,th.r{text-align:right;white-space:nowrap}
td.r{font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
td.num{white-space:nowrap}
tbody tr:hover td{background:var(--acento-suave)}
.pill{--c:var(--tinta-2);--cs:var(--hoja-alt);display:inline-flex;align-items:center;gap:4px;padding:2px 7px;color:var(--c);background:var(--cs);border:1px solid var(--c);border-radius:3px;font-family:var(--font-forma);font-stretch:80%;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill svg.i{width:14px;height:14px}
.pill.ok{--c:var(--sello-verde);--cs:var(--sello-verde-suave)}
.pill.warn{--c:var(--sello-ambar);--cs:var(--sello-ambar-suave)}
.pill.bad{--c:var(--sello-rojo);--cs:var(--sello-rojo-suave)}
.pill.info{--c:var(--sello-violeta);--cs:var(--sello-violeta-suave)}
.iva{font-family:var(--font-maquina);font-size:11.5px;font-weight:500;border-radius:3px;padding:0 4px;border:1px solid var(--linea);color:var(--tinta-2);white-space:nowrap}
.list{display:grid}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 16px;min-height:var(--alto-renglon);border-bottom:1px solid var(--renglon)}
.list .it:last-child{border-bottom:0}
.list .it .t{min-width:0;flex:1}
.list .it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--renglon)}
.stat:last-child{border-bottom:0}

/* ---------- Gráficos ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--renglon)}
.chart .bar.today{fill:var(--acento)}
.chart .gl{stroke:var(--renglon);stroke-width:1;stroke-dasharray:3 3}
.chart text{fill:var(--tinta-3);font-size:11.5px;font-family:var(--font-maquina)}
.chart text.v{fill:var(--tinta);font-weight:600}
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:14px}
.hbar .trk{height:10px;background:var(--hoja-alt);border:1px solid var(--renglon)}
.hbar .fill{height:100%;background:var(--acento)}
.hbar .val{text-align:right;font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- Caja ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:20px;align-items:start}
#cartbox{position:sticky;top:96px;filter:drop-shadow(0 1px 1px rgba(26,36,64,.14)) drop-shadow(0 6px 14px rgba(26,36,64,.08))}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tinta-3)}
.search .input{padding-left:42px;min-height:52px;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cats button{border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:5px 12px;white-space:nowrap;font-size:14px;min-height:36px;color:var(--tinta-2)}
.cats button.on{background:var(--tinta);color:var(--hoja);border-color:var(--tinta);font-weight:600}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.prod{text-align:left;border:1px solid var(--renglon);background:var(--hoja);border-radius:2px;padding:12px 12px 10px;display:grid;gap:6px;min-height:136px;align-content:start;box-shadow:0 1px 0 0 var(--renglon)}
.prod:hover{border-color:var(--acento-tinta)}
.prod:active{transform:translateY(1px)}
.prod .nm{font-weight:600;line-height:1.25}
.prod .meta{font-size:12.5px;color:var(--tinta-3)}
.prod .pr{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:auto;border-top:1px dashed var(--renglon);padding-top:8px}
.prod .pr b{font-family:var(--font-maquina);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.prod .pr span{font-family:var(--font-maquina);font-size:11.5px;color:var(--tinta-3);font-variant-numeric:tabular-nums}
.prod .tags{display:flex;gap:4px;flex-wrap:wrap}
.cart{display:grid;background:var(--hoja);padding-block:10px 12px;
  -webkit-mask:radial-gradient(circle 5px at 7px 0,transparent 98%,#000) top left/14px 51% repeat-x,radial-gradient(circle 5px at 7px 100%,transparent 98%,#000) bottom left/14px 51% repeat-x;

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--hoja);border-top:3px double var(--renglon);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 2px 10px;font-size:12px;color:var(--tinta-3);min-height:56px}
.tabs button.on{color:var(--acento-tinta);font-weight:700}
.tabs button.on svg{stroke-width:2.4}
.res-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--renglon);min-height:var(--alto-renglon)}
.res-row:last-child{border-bottom:0}
.res-row .who b{white-space:normal;line-height:1.25}
.res-row .pos{font-family:var(--font-maquina);color:var(--tinta-3)}
.res-row.yo{background:var(--acento-suave)}
.seg{display:flex;border:1px solid var(--linea);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--hoja);min-height:42px;font-weight:600;color:var(--tinta-2)}
.seg button+button{border-left:1px solid var(--linea)}
.seg button.on{background:var(--tinta);color:var(--hoja)}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--renglon)}
.pr:last-child{border-bottom:0}
.pr .num{font-size:18px;font-weight:600}
.carnet{background:var(--hoja);box-shadow:var(--sombra-pila);border-radius:2px;padding:16px;display:grid;gap:12px}
.estatus{--c:var(--sello-verde);--cs:var(--sello-verde-suave);background:var(--hoja);border:1px solid var(--renglon);border-top:4px solid var(--c);border-radius:2px;box-shadow:var(--sombra-hoja);padding:14px 16px;display:grid;gap:10px}
.estatus.warn{--c:var(--sello-ambar);--cs:var(--sello-ambar-suave)}
.estatus.bad{--c:var(--sello-rojo);--cs:var(--sello-rojo-suave)}
.estatus .top3{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.estatus .plan{font-size:12px;font-weight:600;color:var(--tinta-3);letter-spacing:.02em}
.estatus .plan b{display:block;font-size:16px;color:var(--tinta);letter-spacing:0;margin-top:2px}
.estatus .corte{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.estatus .corte .dias{font-family:var(--font-maquina);font-size:30px;line-height:34px;font-weight:600;color:var(--c)}
.estatus .corte .dias small{font-family:var(--font-forma);font-size:14px;font-weight:600;margin-left:4px}
.estatus .corte .f{font-size:14px;color:var(--tinta-2)}
.estatus .corte .f b{font-family:var(--font-maquina);color:var(--tinta)}
.estatus .barra{height:8px;background:var(--hoja-alt);border:1px solid var(--renglon)}
.estatus .barra i{display:block;height:100%;background:var(--c)}
.estatus .msg{background:var(--cs);border-radius:3px;padding:8px 10px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.estatus .msg .btn{margin-left:auto}
.cual{display:flex;gap:6px;flex-wrap:wrap}
.cual button{border:1px solid var(--renglon);background:var(--hoja);border-radius:4px;padding:4px 10px;min-height:34px;font-size:13px;color:var(--tinta-2)}
.cual button.on{border-color:var(--tinta);color:var(--tinta);font-weight:700}

@media (max-width:1100px){.editor{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
@media (max-width:640px){.blq .ln{grid-template-columns:36px minmax(0,1fr) 72px 40px}.blq .ln .cg-in{grid-column:2/4}.pizarra{padding:14px 14px 18px;border-width:8px}.pizarra .mv{font-size:17px}}

.login .brandside{background:radial-gradient(120% 90% at 0% 0%,#18237a 0%,#0e1752 45%,#060a25 100%);color:#fff}
.login .brandside h1,.login .brandside p{color:#fff}
.login .brandside h1{text-transform:none}
.login .brandside .facts span{border-color:#00d2d6;color:#00d2d6}
.login .brandside [style*="--on-acento"]{color:#fff!important}
.login .brandside::after{content:"";position:absolute;left:0;right:9px;bottom:0;height:6px;background:linear-gradient(90deg,#00d2d6 0 55%,#3233ff 55%)}
.side .logo img{box-shadow:0 0 0 2px var(--hoja)}
/* ---------- Teléfono (hasta 600 px): título completo, sin desbordarse de lado, toques de 44 px. El escritorio no cambia ---------- */
@media (max-width:600px){
  .top{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:8px 12px;padding-block:10px 6px}
  .top .ttl{gap:4px 10px;align-items:center}
  .top .ttl h1{white-space:normal;overflow:visible;font-size:21px;line-height:1.2}
  .top .chips{grid-column:1/-1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;-webkit-mask:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent);mask:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent)}
  .top .chips::-webkit-scrollbar{display:none}
  .top .chips .chip{flex:none;min-height:44px}
  .top .chips .hide-sm{display:inline-flex}
  .content{gap:16px;grid-template-columns:minmax(0,1fr);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
  .content>*{min-width:0}
  .kpis,.kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:10px 12px}
  .kpi .v,.kpis.k3 .v{font-size:19px;line-height:25px}
  .kpi.hero{grid-column:1/-1}.kpi.hero .v{font-size:26px;line-height:32px}
  .kpis:has(>.kpi.hero:first-child)>.kpi:last-child:nth-child(even),.kpis:not(:has(>.kpi.hero))>.kpi:last-child:nth-child(odd){grid-column:1/-1}
  .cats,.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 32px),transparent);padding-right:28px}
  .cats::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
  .cats button,.tabs button{min-height:44px;flex:none}
  .row>.cats{flex:1 1 100%;min-width:0}
  .btn{min-height:46px}.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
  .x{min-width:44px;min-height:44px}
  .input,.cell-in,select,textarea{font-size:16px}
  .modal{padding:0;align-items:stretch}
  .sheet{max-width:none!important;height:100%;max-height:100dvh;border-radius:0}
  .toast{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;width:max-content;text-align:center}
  .list .it{flex-wrap:wrap;row-gap:6px}
  .list .it>:first-child{min-width:0}
  .list .it>.who{flex:1 1 100%!important}
  .list .it>.who+.pill{margin-left:44px}
  .list .it>.btn:last-child{margin-left:auto}
}
</style>

  const finder = (cx, cy) => `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#1a2440"/><rect x="${cx+1}" y="${cy+1}" width="5" height="5" fill="#fff"/><rect x="${cx+2}" y="${cy+2}" width="3" height="3" fill="#1a2440"/>`;

function resTable(me){
  const r = RES.slice().sort((a,b)=> (b.rx-a.rx) || (secs(a.t)-secs(b.t)));

  return r.map((x,i)=>{ const s = socBy(x.s); return `<div class="res-row ${me&&x.s===me?'yo':''}"><span class="pos">${i+1}</span><span class="who">${ava(s)}<b>${s.n}${me&&x.s===me?' (tú)':''}</b></span><span class="num">${x.t}</span><span class="pill ${x.rx?'ok':''}">${x.rx?'RX':'Escalado'}</span></div>`; }).join('');
}

  <div class="bd"><p class="small muted">Para ${s.n} · ${s.tel}</p><div class="wa"><b>Azullab CrossFit</b><span>${msg}</span></div>
  <button class="btn primary big" data-act="avisar" data-s="${s.id}">${ic('wa')}Enviar</button>
  <p class="small muted">En la fase 2 este aviso sale solo, tres días antes de vencer.</p></div></div>`;
}

V.movs = () => `<div class="row"><p class="lead" style="flex:1">La biblioteca de movimientos que usa la pizarra. Cada uno trae su ejemplo en dos posiciones, los puntos clave y cómo escalarlo.</p>

/* ======================= App del socio ======================= */
function estatusCard(me){
  const e = estado(me), d = daysTo(me.v), pl = planBy(me.plan);
  const ini0 = addDays(me.v, -pl.d), usados = Math.min(pl.d, Math.max(0, daysTo(ini0)*-1));
  const cls = e==='Vencida' ? 'bad' : e==='Por vencer' ? 'warn' : '';
  const pago = me.plan==='pase' ? `<div class="small muted">Clases del pase: <b class="num" style="color:var(--tinta)">${Math.max(0,10-me.asis)}</b> de 10 por usar</div>` : '';
  const dias = e==='Vencida' ? `${-d}<small>${-d===1?'día vencido':'días vencido'}</small>` : d===0 ? `Hoy<small>es tu fecha de corte</small>` : `${d}<small>${d===1?'día':'días'} para el corte</small>`;
  const msg = e==='Vencida' ? `<div class="msg">${ic('alert')}<span>No puedes marcar entrada ni reservar hasta renovar.</span><button class="btn sm primary" data-act="tab" data-t="plan">Renovar</button></div>`
    : e==='Por vencer' ? `<div class="msg">${ic('bell')}<span>Renueva antes del ${fmtDate(me.v)} para no perder clases.</span><button class="btn sm" data-act="tab" data-t="plan">Cómo pagar</button></div>` : '';
  return `<section class="estatus ${cls}" aria-label="Estatus de tu plan">
    <div class="top3"><div class="plan">Mi plan<b>${pl.n}</b></div>${estPill(me)}</div>
    <div class="corte"><span class="dias">${dias}</span><span class="f">Fecha de corte <b>${fmtDate(me.v)}</b></span></div>
    <div class="barra" role="img" aria-label="${usados} de ${pl.d} días usados"><i style="width:${Math.min(100,usados/pl.d*100)}%"></i></div>
    <div class="row small muted" style="justify-content:space-between"><span>Pagó el ${fmtDate(ini0)}</span><span>${usd(pl.p)} · ${pl.d} días</span></div>
    ${pago}${msg}</section>`;
}
function socioApp(){
  const me = socBy(S.me), t = S.tab, mine = RES.find(r=>r.s===S.me);
  let body = '';
  if (t==='hoy') body = `<div><h2 style="font-size:20px">Hola, ${me.n.split(' ')[0]}</h2><p class="muted small">${S.pub?'Esta es la rutina de hoy.':'El coach todavía no publica la pizarra de hoy.'}</p></div>
    ${estatusCard(me)}
    ${S.pub?pizarra(S.wod):'<div class="pizarra"><div class="vacia">Pizarra en blanco</div></div>'}
    <section class="panel"><div class="hd"><h2>Mi resultado del WOD</h2></div><div class="bd" style="display:grid;gap:10px">
      ${mine?`<div class="ok-in">${ic('trophy')}<span>Anotaste <b class="num">${mine.t}</b> · ${mine.rx?'RX':'Escalado'}</span></div>`:''}
      <div class="seg"><button data-act="rx" data-v="1" class="${S.rx?'on':''}">RX</button><button data-act="rx" data-v="0" class="${S.rx?'':'on'}">Escalado</button></div>
      <div class="field"><label for="rt">Tiempo (minutos:segundos)</label><input id="rt" class="input num" inputmode="numeric" placeholder="11:30" value="${mine?mine.t:''}"></div>
      <button class="btn primary" data-act="resguardar">${ic('check')}${mine?'Cambiar mi resultado':'Guardar mi resultado'}</button></div></section>
    <section class="panel"><div class="hd"><h2>Resultados de hoy</h2></div><div class="bd flush">${resTable(S.me)}</div></section>`;
  if (t==='clases') body = `<div><h2 style="font-size:20px">Reservar clase</h2><p class="muted small">Hoy, ${DIAS[TODAY.getDay()]} 27 de octubre</p></div>
    <section class="panel"><div class="bd flush list">${CLASES.map(c=>{ const yo = c.res.includes(S.me), lleno = c.res.length>=c.cupo;
      return `<div class="it"><span class="num" style="font-size:20px;font-weight:600;min-width:62px">${c.h}</span><div class="t"><b>${c.coach}</b><span class="small muted">${c.res.length} de ${c.cupo} cupos</span>
        <div class="cupo ${lleno?'lleno':''}" style="margin-top:4px"><i style="width:${Math.min(100,c.res.length/c.cupo*100)}%"></i></div></div>
        ${yo?`<button class="btn sm" data-act="reserva" data-c="${c.h}">Cancelar</button>`:`<button class="btn sm ${lleno?'':'primary'}" data-act="reserva" data-c="${c.h}" ${lleno||estado(me)==='Vencida'?'disabled':''}>${lleno?'Llena':'Reservar'}</button>`}</div>`; }).join('')}</div></section>`;
  if (t==='marcas') body = `<div class="row"><h2 style="font-size:20px;flex:1">Mis marcas</h2><span class="phase f2">Fase 2</span></div>
    <section class="panel"><div class="bd flush">${MARCAS.map(m=>`<div class="pr"><div><b>${m.m}</b><div class="small muted">${m.f}</div></div><span class="num">${m.v}${m.up?` <span class="pill ok" style="font-size:11px">Nueva</span>`:''}</span></div>`).join('')}</div></section>
    <button class="btn" data-act="toast" data-m="Fase 2: anota tus marcas y mira tu progreso en gráfica">${ic('plus')}Anotar una marca</button>`;
  if (t==='plan') body = `${estatusCard(me)}<div class="carnet"><div class="row">${ava(me,'lg')}<div style="flex:1"><b style="font-size:17px">${me.n}</b><div class="small muted num">${me.ci}</div></div>${estPill(me)}</div>
      <div class="pdat2"><div><span>Plan</span><b>${planBy(me.plan).n}</b></div><div><span>Vence</span><b class="num">${fmtDate(me.v)}</b></div><div><span>Clases este mes</span><b class="num">${me.asis}</b></div><div><span>Nivel</span><b>${me.niv}</b></div></div>
      <div style="display:grid;justify-items:center;gap:6px">${qrSvg(7)}<span class="small muted">Para la entrada con QR (fase 2). Por ahora marca con tu cédula.</span></div></div>
    <section class="panel"><div class="hd"><h2>Renovar por pago móvil</h2></div><div class="bd"><div class="pdat2"><div><span>Banco</span><b>Banco de Venezuela</b></div><div><span>Teléfono</span><b class="num">0414-0000000</b></div><div><span>RIF</span><b class="num">J-00000000-0</b></div><div><span>Monto</span><b class="num">${bs(planBy(me.plan).p*RATE)}</b></div></div>
    <p class="small muted" style="margin-top:8px">Datos de muestra. Al pagar, manda la captura y te renuevan en recepción.</p></div></section>`;
  const tabs = [['hoy','board','Hoy'],['clases','cal','Clases'],['marcas','trophy','Marcas'],['plan','user','Mi plan']];
  return `<div class="app"><div class="phone">
    <header class="ph">${LOGO(34)}<div class="t"><b>Azullab CrossFit</b><span>${me.n}</span></div><button data-act="logout">${ic('out')}Salir</button></header>
    <main class="pc content">${body}</main>
    <nav class="tabs" aria-label="Secciones">${tabs.map(([k,i,l])=>`<button data-act="tab" data-t="${k}" class="${t===k?'on':''}" ${t===k?'aria-current="page"':''}>${ic(i)}<span>${l}</span></button>`).join('')}</nav>
  </div></div>`;
}

/* ======================= Arranque y eventos ======================= */
function render(){
  $('#app').innerHTML = S.view==='login' ? V.login() : S.view==='app' ? socioApp() : shell(V[S.view]());
  if (S.view!=='login' && S.view!=='app') stampFolios();
}
function openModal(html){ const m = $('#modal'); m.innerHTML = html; m.hidden = false; const f = m.querySelector('input,select,button:not(.x)') || m.querySelector('button'); f && f.focus(); }
function closeModal(){ const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
let tt; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>t.hidden = true, 3000); }
function go(v){ if (v!=='login' && !can(v)) v = HOME[S.role]; S.view = v; S.sidebar = false; render(); window.scrollTo(0,0); }
function refreshEditor(full){
  if (full){ const b = $('#blqs'); if (b) b.innerHTML = blocksEd(); }
  const p = $('#prev'); if (p) p.innerHTML = pizarra(S.draft);
  if (!S.dirty){ S.dirty = true; const h = document.querySelector('.editor .panel .hd .small'); if (h) h.textContent = 'Cambios sin publicar'; }
}
const idx = s => s.split('.').map(Number);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (S.sidebar && !e.target.closest('.side')) { S.sidebar=false; render(); } if (e.target.id==='modal') closeModal(); return; }
  const a = b.dataset.act;
  if (b.tagName==='A') e.preventDefault();
  switch(a){
    case 'nav': go(b.dataset.v); break;
    case 'role': S.role = b.dataset.r; S.user = ROLES[S.role].user; render(); break;
    case 'logout': closeModal(); go('login'); break;
    case 'menu': S.sidebar = !S.sidebar; render(); break;
    case 'close': closeModal(); break;
    case 'toast': toast(b.dataset.m); break;
    case 'mov': openModal(movModal(b.dataset.m)); break;
    case 'pick': openModal(pickModal(+b.dataset.b)); break;
    case 'addmov': S.draft.blocks[+b.dataset.b].items.push({m:b.dataset.m, r:'10', c:''}); closeModal(); refreshEditor(true); break;
    case 'irm': { const [bi,ii] = idx(b.dataset.i); S.draft.blocks[bi].items.splice(ii,1); refreshEditor(true); break; }
    case 'brm': S.draft.blocks.splice(+b.dataset.b,1); refreshEditor(true); break;
    case 'bup': { const i = +b.dataset.b; if (i>0){ const bl = S.draft.blocks; [bl[i-1],bl[i]] = [bl[i],bl[i-1]]; refreshEditor(true); } break; }
    case 'badd': S.draft.blocks.push({t:'Bloque nuevo', tipo:'', items:[]}); refreshEditor(true); break;
    case 'wclear': S.draft = {titulo:'', nota:'', blocks:[]}; render(); S.dirty = true; refreshEditor(); toast('Pizarra en blanco: escribe la de hoy'); break;
    case 'publicar': if (!S.draft.blocks.some(x=>x.items.length)) { toast('Agrega al menos un movimiento antes de publicar'); break; }
      S.wod = clone(S.draft); S.pub = true; S.dirty = false; render();
      $('#prev').innerHTML = pizarra(S.wod, {sello:true});
      toast(`Pizarra publicada: ya la ven ${SOCIOS.filter(s=>estado(s)!=='Vencida').length} socios en su teléfono`); break;
    case 'clase': S.clase = b.dataset.c; render(); break;
    case 'entrada': { const v = ($('#kci').value||'').replace(/\D/g,''); if (!v) { toast('Escribe la cédula'); break; }
      const s = SOCIOS.find(x=>x.ci.replace(/\D/g,'')===v);
      if (!s) { S.kio = {ok:false}; render(); break; }
      if (estado(s)==='Vencida') { S.kio = {ok:false, s:s.id}; render(); break; }
      const t = nowT(), c = CLASES.find(x=>x.h>=t.slice(0,3)+'00') || CLASES[CLASES.length-1];
      if (!c.res.includes(s.id)) c.res.push(s.id);
      if (!ASIS.some(x=>x.s===s.id && x.c===c.h)) { ASIS.push({s:s.id, t, c:c.h}); s.asis++; }
      S.kio = {ok:true, s:s.id, t, c:c.h}; S.clase = c.h; render(); break; }
    case 'nuevo': openModal(nuevoModal()); break;
    case 'ficha': openModal(fichaModal(b.dataset.s)); break;
    case 'cobrar': if (b.dataset.s) S.pay.s = b.dataset.s; openModal(payModal()); break;
    case 'met': S.pay.met = b.dataset.m; openModal(payModal()); break;
    case 'pagar': { const s = socBy(S.pay.s), pl = planBy(S.pay.plan);
      const base = estado(s)==='Vencida' ? '2026-10-27' : s.v; s.v = addDays(base, pl.d); s.plan = pl.id;
      const r = 'R-0' + (S.rec++); PAGOS.push({f:'2026-10-27', r, s:s.id, plan:pl.id, usd:pl.p, met:S.pay.met});
      render(); openModal(payModal({r})); break; }
    case 'aviso': openModal(avisoModal(b.dataset.s)); break;
    case 'avisar': closeModal(); toast(`Aviso enviado a ${socBy(b.dataset.s).tel}`); break;
    case 'cual': S.me = b.dataset.s; S.user = socBy(S.me).n; render(); break;
    case 'tab': S.tab = b.dataset.t; render(); window.scrollTo(0,0); break;
    case 'rx': S.rx = b.dataset.v==='1'; render(); break;
    case 'resguardar': { const v = ($('#rt').value||'').trim(); if (!/^\d{1,2}:\d{2}$/.test(v)) { toast('Escribe el tiempo así: 11:30'); $('#rt').focus(); break; }
      const r = RES.find(x=>x.s===S.me); if (r) { r.t = v; r.rx = S.rx; } else RES.push({s:S.me, t:v, rx:S.rx});
      render(); toast('Resultado guardado. Ya sale en la tabla de hoy'); break; }
    case 'reserva': { const c = CLASES.find(x=>x.h===b.dataset.c), i = c.res.indexOf(S.me);
      if (i>=0) { c.res.splice(i,1); toast(`Reserva de las ${c.h} cancelada`); } else { c.res.push(S.me); toast(`Listo: tienes cupo a las ${c.h}`); }
      render(); break; }
  }
});
document.addEventListener('input', e => {
  const t = e.target, d = S.draft;
  if (t.id==='sq') { S.q = t.value; const pos = t.selectionStart; render(); const n = $('#sq'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if (t.dataset.wt!==undefined) { d.titulo = t.value; refreshEditor(); }
  if (t.dataset.wn!==undefined) { d.nota = t.value; refreshEditor(); }
  if (t.dataset.bt!==undefined) { d.blocks[+t.dataset.bt].t = t.value; refreshEditor(); }
  if (t.dataset.bp!==undefined) { d.blocks[+t.dataset.bp].tipo = t.value; refreshEditor(); }
  if (t.dataset.ir!==undefined) { const [bi,ii] = idx(t.dataset.ir); d.blocks[bi].items[ii].r = t.value; refreshEditor(); }
  if (t.dataset.ic!==undefined) { const [bi,ii] = idx(t.dataset.ic); d.blocks[bi].items[ii].c = t.value; refreshEditor(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.im!==undefined) { const [bi,ii] = idx(t.dataset.im); S.draft.blocks[bi].items[ii].m = t.value; refreshEditor(true); }
  if (t.id==='p-s') { S.pay.s = t.value; S.pay.plan = socBy(t.value).plan; openModal(payModal()); }
  if (t.id==='p-p') { S.pay.plan = t.value; openModal(payModal()); }
});
document.addEventListener('submit', e => {
  if (e.target.id==='loginForm'){ e.preventDefault(); if (S.role==='Socio') { S.tab = 'hoy'; } go(HOME[S.role]); return; }
  if (e.target.id==='nform'){ e.preventDefault();
    const n = $('#n-n').value.trim(), ciRaw = $('#n-ci').value.replace(/\D/g,'');
    if (!n || !ciRaw) { toast('Falta el nombre o la cédula'); return; }
    if (SOCIOS.some(s=>s.ci.replace(/\D/g,'')===ciRaw)) { toast('Esa cédula ya está registrada'); return; }
    const app = $('#n-app').checked;
    const pl = planBy($('#n-p').value), id = 'S' + String(SOCIOS.length+1).padStart(2,'0');
    SOCIOS.push({id, n, ci:'V-'+ciRaw.replace(/\B(?=(\d{3})+(?!\d))/g,'.'), tel:$('#n-t').value.trim()||'—', plan:pl.id, v:addDays($('#n-d').value||'2026-10-27', pl.d), nac:$('#n-b').value||'1995-01-01', niv:$('#n-niv').value, asis:0, emer:$('#n-e').value.trim()||'—', les:$('#n-l').value.trim()||'Ninguna'});
    closeModal(); render();
    toast(app ? `${n} quedó registrado. Su usuario para la app es su cédula` : `${n} quedó registrado`);
  }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && !$('#modal').hidden) closeModal();
  if (e.key==='Enter' && e.target.id==='kci'){ e.preventDefault(); document.querySelector('[data-act="entrada"]').click(); }
});
(function init(){
  const h = (location.hash||'').slice(1);
  if (h==='socio') { S.role = 'Socio'; S.user = ROLES.Socio.user; S.view = 'app'; }
  else if (h && V[h] && h!=='login') S.view = h;
  render();
})();

</script>
</body></html>

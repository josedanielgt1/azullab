<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Azullab Laboratorio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   PAPEL FISCAL · sistema de diseño de Cuadre
   Capa 1: tokens (papel / carbón). Capa 2: color del cliente (Azullab).
   Capa 3: componentes aplicados a esta maqueta.
   Diseño: mesa → separadores de archivador → carpeta abierta → hojas con folio.
   ===================================================================== */
:root{
  --mesa:#ebe9f3; --hoja:#ffffff; --hoja-alt:#f7f6fb; --renglon:#cbd8ea; --linea:#6f7d94; --margen:#d2453b;
  --tinta:#1a2440; --tinta-2:#4e5a73; --tinta-3:#5d6882;
  --sello-verde:#1f7a43; --sello-verde-suave:#e3f3e8; --sello-rojo:#b3261e; --sello-rojo-suave:#fbe6e4;
  --sello-ambar:#8a5300; --sello-ambar-suave:#fdf0d8; --sello-violeta:#5b3aa6; --sello-violeta-suave:#efe9fb;
  --foco:#1a2440;
  --sombra-hoja:0 1px 2px rgba(26,36,64,.08),0 0 0 1px rgba(26,36,64,.06);
  --sombra-pila:0 1px 2px rgba(26,36,64,.08),0 0 0 1px rgba(26,36,64,.06),5px 5px 0 -1px #ffffff,5px 5px 0 0 #cbd8ea;
  --sombra-flotante:0 18px 48px rgba(13,18,32,.28);
  /* Color del cliente: Azullab Farmacia (celeste y blanco) */
  /* Grupo Empresarial Azullab (azul marino, turquesa y azul) con el color del laboratorio: violeta y luz rosa */
  --acento:#7b5cff; --on-acento:#ffffff; --acento-tinta:#5634e0; --acento-suave:#efeaff; --marca:#0e1752; --neg:#7b5cff; --luz:#ff9cb8;
  --font-forma:"Archivo","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-maquina:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --alto-renglon:40px;
  /* alias que usa el contenido de la maqueta */
  --ink:var(--tinta); --ink-2:var(--tinta-2); --ink-3:var(--tinta-3); --line:var(--renglon); --azul:var(--acento-tinta);
  --celeste-50:var(--acento-suave); --ok:var(--sello-verde); --warn:var(--sello-ambar); --bad:var(--sello-rojo);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --mesa:#0d1220; --hoja:#161d2e; --hoja-alt:#1c2438; --renglon:#2a3650; --linea:#6b7a95; --margen:#e06a5f;
  --tinta:#e7ecf5; --tinta-2:#a3aec4; --tinta-3:#8794ae;
  --sello-verde:#5fd08e; --sello-verde-suave:#12301f; --sello-rojo:#ff8a7f; --sello-rojo-suave:#3a1714;
  --sello-ambar:#f0b54d; --sello-ambar-suave:#33260d; --sello-violeta:#b9a2ff; --sello-violeta-suave:#251a45;
  --foco:#e7ecf5;
  --sombra-hoja:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06);
  --sombra-pila:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06),5px 5px 0 -1px #161d2e,5px 5px 0 0 #2a3650;
  --sombra-flotante:0 18px 48px rgba(0,0,0,.6);
  --acento:#9d85ff; --on-acento:#0f0830; --acento-tinta:#bba9ff; --acento-suave:#231c46; --marca:#0e1752; --neg:#9d85ff; --luz:#ff9cb8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --mesa:#0d1220; --hoja:#161d2e; --hoja-alt:#1c2438; --renglon:#2a3650; --linea:#6b7a95; --margen:#e06a5f;
  --tinta:#e7ecf5; --tinta-2:#a3aec4; --tinta-3:#8794ae;
  --sello-verde:#5fd08e; --sello-verde-suave:#12301f; --sello-rojo:#ff8a7f; --sello-rojo-suave:#3a1714;
  --sello-ambar:#f0b54d; --sello-ambar-suave:#33260d; --sello-violeta:#b9a2ff; --sello-violeta-suave:#251a45;
  --foco:#e7ecf5;
  --sombra-hoja:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06);
  --sombra-pila:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06),5px 5px 0 -1px #161d2e,5px 5px 0 0 #2a3650;
  --sombra-flotante:0 18px 48px rgba(0,0,0,.6);
  --acento:#9d85ff; --on-acento:#0f0830; --acento-tinta:#bba9ff; --acento-suave:#231c46; --marca:#0e1752; --neg:#9d85ff; --luz:#ff9cb8;
  color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--mesa);color:var(--tinta);font-family:var(--font-forma);font-size:15px;line-height:1.47}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.num{font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;line-height:28px;font-weight:700}
h2{font-size:17px;line-height:22px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
svg.i{width:18px;height:18px;flex:none}

/* ---------- Entrada ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--mesa)}
.login .brandside{background:var(--acento);color:var(--on-acento);display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding-block:44px;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:56px;position:relative;
  -webkit-mask:linear-gradient(#000 0 0) left/calc(100% - 9px) 100% no-repeat,radial-gradient(circle 6px at 100% 8px,transparent 98%,#000) right top/9px 16px repeat-y;
          mask:linear-gradient(#000 0 0) left/calc(100% - 9px) 100% no-repeat,radial-gradient(circle 6px at 100% 8px,transparent 98%,#000) right top/9px 16px repeat-y}
.login .brandside h1{font-size:clamp(30px,3.6vw,46px);line-height:1.04;font-weight:800;letter-spacing:-.015em;max-width:15ch;color:var(--on-acento)}
.login .brandside p{max-width:44ch;color:var(--on-acento);font-size:16px;line-height:24px}
.login .facts{display:flex;flex-wrap:wrap;gap:8px}
.login .facts span{border:1.5px solid var(--on-acento);color:var(--on-acento);padding:3px 9px;border-radius:3px;font-stretch:80%;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.login .formside{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login form{width:100%;max-width:420px;display:grid;gap:14px;background:var(--hoja);box-shadow:var(--sombra-pila);border-radius:2px;padding:22px 22px 24px}
.login .firma{font-size:12.5px;color:var(--tinta-3)}
.login .firma b{color:var(--tinta-2);font-weight:800}
.field{display:grid;gap:3px;padding:7px 10px 8px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);min-width:0}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--foco)}
.field label{font-size:11.5px;line-height:14px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3)}
.field .input{border:0;padding:0;min-height:26px;background:transparent;box-shadow:none;font-size:16px;border-radius:0}
.field .input:focus{box-shadow:none}
.field:has(.roles){border:0;padding:0;background:none;box-shadow:none}
.roles{display:flex;gap:4px;border-bottom:1px solid var(--renglon);overflow-x:auto}
.roles button{border:1px solid transparent;border-bottom:0;background:var(--hoja-alt);border-radius:8px 8px 0 0;padding:0 14px;min-height:42px;margin-bottom:-1px;font-weight:600;color:var(--tinta-3);white-space:nowrap}
.roles button.on{background:var(--hoja);border-color:var(--renglon);color:var(--tinta)}
.input{width:100%;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:10px 12px;min-height:44px}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--foco)}

/* ---------- Mesa, separadores y carpeta ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--mesa);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:10px;padding:18px 18px 8px}
.side .nav{display:grid;gap:3px;padding:0 0 16px 10px}
.side .grp{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3);padding:14px 14px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.side .nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 14px;color:var(--tinta-2);text-decoration:none;border:1px solid transparent;border-right:0;border-radius:8px 0 0 8px;font-size:15px}
.side .nav a:hover{background:var(--hoja-alt);color:var(--tinta)}
.side .nav a.on{background:var(--hoja-alt);color:var(--tinta);font-weight:700;border-color:var(--renglon)}
.side .nav a .cod{margin-left:auto;font-family:var(--font-maquina);font-size:11px;color:var(--tinta-3);font-weight:400}
.side .foot{margin-top:auto;padding:14px 18px;border-top:1px dashed var(--linea);font-size:13px;color:var(--tinta-3)}
.side .foot .firma{margin-top:12px;font-size:11.5px}
.side .foot .firma b{font-weight:800;color:var(--tinta-2)}
.main{min-width:0;display:flex;flex-direction:column;background:var(--hoja-alt)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hoja-alt);border-bottom:3px double var(--renglon);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hoja-alt)}
.top .ttl{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1;flex-wrap:wrap}
.top .ttl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .folio{font-family:var(--font-maquina);font-size:12px;color:var(--tinta-3);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:4px 10px;font-size:13px;color:var(--tinta-2);min-height:34px;white-space:nowrap}
.chip b{font-family:var(--font-maquina);font-weight:600;color:var(--tinta)}
button.chip:hover{border-color:var(--tinta)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sello-verde);flex:none}
.chip.off{background:var(--sello-ambar-suave);border-color:var(--sello-ambar);color:var(--sello-ambar);font-weight:700}
.chip.off .dot{background:var(--sello-ambar)}
.menu-btn{display:none;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;width:44px;height:44px;align-items:center;justify-content:center}
.offbar{background:var(--sello-ambar-suave);color:var(--tinta);border-bottom:1px dashed var(--sello-ambar);padding-block:9px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.offbar svg{color:var(--sello-ambar)}
.offbar b{color:var(--sello-ambar)}
.content{padding-block:22px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.phase{font-family:var(--font-forma);font-stretch:80%;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:2px 7px;white-space:nowrap}
.phase.f1{color:var(--sello-violeta);background:var(--sello-violeta-suave)}
.phase.f2{color:var(--sello-verde);background:var(--sello-verde-suave)}
.lead{color:var(--tinta-2);max-width:75ch}

/* ---------- Hojas ---------- */
.panel{background:var(--hoja);border-radius:2px;box-shadow:var(--sombra-hoja);min-width:0}
.panel.doc{box-shadow:var(--sombra-pila)}
.panel>.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px 10px;border-bottom:1px solid var(--renglon)}
.pfolio{display:block;font-family:var(--font-maquina);font-size:11px;line-height:14px;font-weight:400;color:var(--tinta-3);margin-bottom:3px;letter-spacing:0}
.panel>.bd{padding:16px;min-width:0}
.panel>.bd.flush{padding:0}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* Planilla de cifras: casillas unidas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:4px;overflow:hidden;box-shadow:var(--sombra-hoja)}
.kpi{background:var(--hoja);padding:10px 14px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi .l{font-size:11.5px;line-height:14px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3)}
.kpi .v{font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-size:27px;line-height:34px;font-weight:600;letter-spacing:-.01em}
.kpi .s{font-size:13px;color:var(--tinta-2)}
.kpi .s.num{font-size:12.5px}
.kpi.hero{background:var(--acento-suave)}
.kpi.hero .l{color:var(--acento-tinta)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);color:var(--tinta);font-weight:600;font-size:15px;box-shadow:0 2px 0 0 var(--renglon);transition:transform .06s ease,box-shadow .06s ease}
.btn:hover{border-color:var(--tinta-2)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 0 var(--renglon)}
.btn.primary{background:var(--acento);border-color:var(--acento);color:var(--on-acento);box-shadow:0 2px 0 0 var(--tinta)}
.btn.primary:hover{border-color:var(--tinta)}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--tinta-3)}
.small{font-size:13px}

/* ---------- Libro ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--tinta-3);font-size:11.5px;letter-spacing:.02em;padding:10px 12px 8px;border-bottom:3px double var(--renglon);white-space:nowrap;background:var(--hoja)}
td{padding:7px 12px;height:var(--alto-renglon);border-bottom:1px solid var(--renglon);vertical-align:middle}
th:first-child,td:first-child{border-right:4px double var(--margen)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:3px double var(--tinta-2);border-bottom:0;background:var(--hoja)}
tfoot td.r span{text-decoration:underline double;text-underline-offset:5px;text-decoration-thickness:1px}
.base-legal{font-size:12.5px;color:var(--tinta-3);padding:10px 16px;border-top:1px dashed var(--renglon)}
.pin{font-family:var(--font-maquina);letter-spacing:.5em;font-size:20px}
.login .aviso-off{width:100%;max-width:420px;background:var(--sello-ambar-suave);border:1px dashed var(--sello-ambar);border-radius:4px;padding:10px 14px;font-size:14px;color:var(--tinta);display:flex;gap:10px;align-items:flex-start}
.login .aviso-off b{color:var(--sello-ambar)}
.login .aviso-off svg{color:var(--sello-ambar);margin-top:2px}
td.r,th.r{text-align:right;white-space:nowrap}
td.r{font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
td.num{white-space:nowrap}
tbody tr:hover td{background:var(--acento-suave)}
.pill{--c:var(--tinta-2);--cs:var(--hoja-alt);display:inline-flex;align-items:center;gap:4px;padding:2px 7px;color:var(--c);background:var(--cs);border:1px solid var(--c);border-radius:3px;font-family:var(--font-forma);font-stretch:80%;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill svg.i{width:14px;height:14px}
.pill.ok{--c:var(--sello-verde);--cs:var(--sello-verde-suave)}
.pill.warn{--c:var(--sello-ambar);--cs:var(--sello-ambar-suave)}
.pill.bad{--c:var(--sello-rojo);--cs:var(--sello-rojo-suave)}
.pill.info{--c:var(--sello-violeta);--cs:var(--sello-violeta-suave)}
.iva{font-family:var(--font-maquina);font-size:11.5px;font-weight:500;border-radius:3px;padding:0 4px;border:1px solid var(--linea);color:var(--tinta-2);white-space:nowrap}
.list{display:grid}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 16px;min-height:var(--alto-renglon);border-bottom:1px solid var(--renglon)}
.list .it:last-child{border-bottom:0}
.list .it .t{min-width:0;flex:1}
.list .it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--renglon)}
.stat:last-child{border-bottom:0}

/* ---------- Gráficos ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--renglon)}
.chart .bar.today{fill:var(--acento)}
.chart .gl{stroke:var(--renglon);stroke-width:1;stroke-dasharray:3 3}
.chart text{fill:var(--tinta-3);font-size:11.5px;font-family:var(--font-maquina)}
.chart text.v{fill:var(--tinta);font-weight:600}
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:14px}
.hbar .trk{height:10px;background:var(--hoja-alt);border:1px solid var(--renglon)}
.hbar .fill{height:100%;background:var(--acento)}
.hbar .val{text-align:right;font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- Caja ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:20px;align-items:start}
#cartbox{position:sticky;top:96px;filter:drop-shadow(0 1px 1px rgba(26,36,64,.14)) drop-shadow(0 6px 14px rgba(26,36,64,.08))}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tinta-3)}
.search .input{padding-left:42px;min-height:52px;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cats button{border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:5px 12px;white-space:nowrap;font-size:14px;min-height:36px;color:var(--tinta-2)}
.cats button.on{background:var(--tinta);color:var(--hoja);border-color:var(--tinta);font-weight:600}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.prod{text-align:left;border:1px solid var(--renglon);background:var(--hoja);border-radius:2px;padding:12px 12px 10px;display:grid;gap:6px;min-height:136px;align-content:start;box-shadow:0 1px 0 0 var(--renglon)}
.prod:hover{border-color:var(--acento-tinta)}
.prod:active{transform:translateY(1px)}
.prod .nm{font-weight:600;line-height:1.25}
.prod .meta{font-size:12.5px;color:var(--tinta-3)}
.prod .pr{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:auto;border-top:1px dashed var(--renglon);padding-top:8px}
.prod .pr b{font-family:var(--font-maquina);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.prod .pr span{font-family:var(--font-maquina);font-size:11.5px;color:var(--tinta-3);font-variant-numeric:tabular-nums}
.prod .tags{display:flex;gap:4px;flex-wrap:wrap}
.cart{display:grid;background:var(--hoja);padding-block:10px 12px;

function barSvg(code){
  let x = 0, r = '';
  const bars = c => { for (let i=0;i<7;i++){ const w = ((c>>i)&1) + 1; if (i%2===0) r += `<rect x="${x}" y="0" width="${w}" height="30" fill="#1a2440"/>`; x += w + 1; } };
  bars(91); [...code].forEach(ch => bars(ch.charCodeAt(0)*7)); bars(93);
  return `<svg viewBox="0 0 ${x} 30" preserveAspectRatio="none" role="img" aria-label="Código de barras ${code}">${r}</svg>`;
}
function qrSvg(seed){
  let x = seed * 9301 + 49297, cells = '';
  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  const finder = (cx, cy) => `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#1a2440"/><rect x="${cx+1}" y="${cy+1}" width="5" height="5" fill="#fff"/><rect x="${cx+2}" y="${cy+2}" width="3" height="3" fill="#1a2440"/>`;
  for (let i=0;i<25;i++) for (let j=0;j<25;j++){ const inF = (i<8&&j<8)||(i<8&&j>16)||(i>16&&j<8); if (!inF && rnd()>.52) cells += `<rect x="${j}" y="${i}" width="1" height="1" fill="#1a2440"/>`; }
  return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="Código QR de verificación (muestra)" style="background:#fff">${finder(0,0)}${finder(18,0)}${finder(0,18)}${cells}</svg>`;
}

/* ---------- Validación ---------- */

  ${o ? `<section class="panel"><div class="hd"><h2>Validar ${o.n}</h2><span class="small muted">Cargado por ${BIO}</span></div>
    <div class="bd" style="display:grid;gap:12px">${ordHead(o)}
    ${cr.length ? (o.aviso ? `<div class="crit" style="background:var(--sello-verde-suave);border-color:var(--sello-verde)">${ic('check')}<span><b style="color:var(--sello-verde)">Aviso registrado.</b> ${o.aviso.to} fue avisado por teléfono a las ${o.aviso.t} por ${o.aviso.by}. Queda en el historial de la orden.</span></div>`

    </div>
    <div class="bd flush" style="border-top:1px solid var(--renglon)">${resRows(o, false)}</div>
    <div class="bd row" style="border-top:1px dashed var(--renglon)"><button class="btn" data-act="repetir" data-o="${o.n}">${ic('undo')}Devolver para repetir</button><span class="spacer"></span>
      <span class="small muted">La firma es siempre del bioanalista responsable.</span><button class="btn primary" data-act="validar" data-o="${o.n}" ${cr.length&&!o.aviso?'disabled':''}>${ic('shield')}Validar y firmar</button></div></section>`

/* ---------- Pacientes ---------- */
function spark(pts, r, d, u){
  const W = 560, H = 180, pl = 48, pr = 20, pt = 16, pb = 30, n = pts.length;
  const vals = pts.map(p=>p[1]); let lo = Math.min(...vals, r[0]==null?Infinity:r[0]), hi = Math.max(...vals, r[1]==null?-Infinity:r[1]);
  const m = (hi-lo)*.15 || 1; lo -= m; hi += m;
  const y = v => pt + (hi - v)/(hi - lo)*(H - pt - pb), x = i => pl + i*(W - pl - pr)/Math.max(1, n-1);
  const band = `<rect class="ref" x="${pl}" y="${y(r[1]==null?hi:r[1])}" width="${W-pl-pr}" height="${y(r[0]==null?lo:r[0]) - y(r[1]==null?hi:r[1])}"/>`;
  const gl = [r[0],r[1]].filter(v=>v!=null).map(v=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fv(v,d)}</text>`).join('');
  const path = pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p[1])}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución en ${u}">${band}${gl}<path class="ln" d="${path}"/>
    ${pts.map((p,i)=>`<circle class="pt ${p[2]?'h':''}" cx="${x(i)}" cy="${y(p[1])}" r="5"/><text x="${x(i)}" y="${y(p[1])-11}" text-anchor="middle" style="fill:var(--tinta);font-weight:600">${fv(p[1],d)}</text><text x="${x(i)}" y="${H-8}" text-anchor="middle">${p[0]}</text>`).join('')}</svg>`;
}

      ${os.map(o=>`<div class="it"><div class="t"><b>${HOY} · ${o.n}</b><span class="small muted">${itemsTxt(o)}</span></div>${stPill(o.st)}</div>`).join('')}
      ${[...new Set(keys.flatMap(k=>h[k].map(x=>x[0])))].sort((a,b)=>b.split('-').reverse().join().localeCompare(a.split('-').reverse().join())).map(dt=>`<div class="it"><div class="t"><b>${dt}</b><span class="small muted">${keys.filter(k=>h[k].some(x=>x[0]===dt)).map(k=>{let n;EX.forEach(e=>e.ps.forEach(x=>{if(x.k===k)n=x.n;}));return n;}).join(' · ')}</span></div><span class="pill">${ic('check')}Entregado</span></div>`).join('')}

  </div>`;
};

/* Avisos que salen de la ficha y de la visita */
function alertsOf(p, v, needAy){
  const a = []; v = v || {};
  if (p.alerg) a.push(['bad','alert',`Alergia: ${p.alerg}`]);
  if (p.ant.includes('Toma anticoagulantes') || p.ant.includes('Problemas de coagulación') || ANTICO.test(p.meds+' '+(v.medsHoy||''))) a.push(['warn','alert','Anticoagulado o sangra fácil: presionar 3 a 5 minutos después de la punción']);
  if (ageOf(p.b) < 18) a.push(['info','users', p.rep ? `Menor de edad · viene con ${p.rep.n} (${p.rep.par.toLowerCase()})` : 'Menor de edad: falta el representante']);
  if (v.emb==='Sí') a.push(['info','check', `Embarazada${v.fur?' · FUR '+fmtDate(v.fur):''}`]);
  if (v.emb==='No sabe') a.push(['warn','alert', `Posible embarazo${v.fur?' · FUR '+fmtDate(v.fur):''}`]);
  if (needAy){ if (!v.ay) a.push(['warn','clock','Pide ayuno: pregunta cuántas horas lleva']);
    else if (v.ay==='No está en ayunas' || v.ay==='Menos de 8 horas') a.push(['bad','clock',`Pide ayuno y dijo: ${v.ay.toLowerCase()}. Se anota en el informe`]);
    else a.push(['ok','clock',`Ayuno: ${v.ay.toLowerCase()}`]); }
  if (p.ant.includes('Diabetes')) a.push(['info','flask','Diabético']);
  return a;
}
const alertsH = (p, v, needAy) => { const a = alertsOf(p, v, needAy); return a.length ? `<div class="alertas">${a.map(([c,i,t])=>`<span class="al ${c}">${ic(i)}<span>${t}</span></span>`).join('')}</div>` : ''; };

const blankDraft = ci => ({ci, nom:'', ape:'', s:'', b:'', tel:'', tel2:'', mail:'', dir:'', sector:'', mun:'Andrés Bello', ocup:'', sangre:'No sabe', ant:[], meds:'', alerg:'', emer:'', emerPar:'', emerTel:'', repN:'', repCi:'', repPar:'', repTel:'', seg:'Particular', orig:''});

/* ---------- Eventos de la ficha y la visita ---------- */
const curDraft = () => S.view==='pacientes' ? (S.pform && S.pform.d) : S.ord.draft;
const normCi = s => String(s).replace(/^[VE]-?/i,'').replace(/\./g,'');
document.addEventListener('click', e => {

  const a = b.dataset.act;
  if (a==='pbuscar'){
    const raw = ($('#ci').value||'').trim(), [main, suf] = raw.split('-'), dg = (main||'').replace(/\D/g,'');

    const p = PATS.find(x=>normCi(x.ci)===normCi(ci));
    if (p) { S.ord.pat = p.id; S.ord.draft = null; toast(`${p.n} ya es paciente: confirma sus datos`); }
    else { S.ord.draft = blankDraft(ci); S.ord.edit = null; }

<script>
/* =====================================================================
   CUADRE FISCAL · un RIF por negocio
   Mismo código en farmacia.html, laboratorio.html y crossfit.html. Lo propio de
   cada negocio va en FX_SYS (el bloque de arriba).
   Reglas: Providencia 0071 (hasta el 18-04-2027) y SNAT/2026/00093 (desde el
   19-04-2027). Medio, según FX_SYS.medio:
   · 'digital': imprenta digital con talonario de contingencia (sin internet).
   · 'maquina': impresora fiscal homologada (Providencia SNAT/2018/0141), con
     Reporte X y Reporte Z diario; el talonario solo cuando la impresora falla.
   Todo lo fiscal (factura, notas, libros, cierres, reportes) sale de FX.F (datos
   del emisor) y de FX.docs (documentos emitidos). Datos de muestra: nada se conecta.
   ===================================================================== */
const FX = (() => {
  const Y = FX_SYS;

  const now = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const hasRif = id => /^[JGVEPC]-\d{8}-\d$/.test(String(id || '').replace(/\./g, '').toUpperCase());
  const MES = '2026-10', MES_T = 'octubre 2026';
  const M = {Y, r2, fd, B, ampm, hasRif, MES_T};

  /* ---------- Datos fiscales del emisor: un solo lugar ---------- */
  M.F = Object.assign({razon:'', rif:'', dom:'', tel:'', tipo:'Ordinario', impNom:'', impRif:'', serie:'00', prov:'', provFecha:'',
    mfMarca:'', mfModelo:'', mfSerial:'', mfDist:'', mfInsp:'', mfCaja:'Caja 1',
    talNum:'', talSerie:'01', talDesde:1, talHasta:50, contador:'Por asignar', rifMuestra:true}, Y.fiscal);
  M.MAQ = Y.medio === 'maquina';
  M.docs = []; M.hist = [];
  M.n = Object.assign({FAC:1, NC:1, ND:1, ctrl:1}, Y.num); M.n.tal = M.F.talDesde;

  M.mf = Object.assign({ok:true, z:1, x:1, zHoy:null, falla:null, libro:[]}, Y.mf || {});
  M.ui = {libro:'ventas', q:''};
  M.chk = Object.assign({rif:true, libros:true, decl:true, lctrl:true}, Y.chk || {});
  let uid = 0;
  M.byId = id => M.docs.find(d => d.id === +id);
  M.byNum = n => { const q = String(n).replace(/\D/g, '').replace(/^0+/, ''); return M.docs.find(d => d.tipo === 'FAC' && d.num.replace(/\D/g, '').replace(/^0+/, '') === q); };
  M.online = () => Y.online();
  M.talNext = () => M.F.talSerie + '-' + p8(M.n.tal);
  M.talLeft = () => M.F.talHasta - M.n.tal + 1;

  /* ---------- Totales por alícuota (en bolívares) ---------- */
  M.tot = d => {
    const t = {ex:0, bg:0, br:0};
    d.lines.forEach(l => { const m = r2(l.q * l.pu); if (l.a === 'G') t.bg += m; else if (l.a === 'R') t.br += m; else t.ex += m; });
    t.ex = r2(t.ex); t.bg = r2(t.bg); t.br = r2(t.br); t.ivg = r2(t.bg * .16); t.ivr = r2(t.br * .08);
    t.iva = r2(t.ivg + t.ivr); t.igtf = r2(d.igtf || 0); t.total = r2(t.ex + t.bg + t.br + t.iva + t.igtf); return t;
  };

  /* ---------- Emitir ----------
     Imprenta digital: asigna el número de control; sin internet, el talonario.
     Impresora fiscal: numera la factura y la nota en su memoria fiscal y las identifica con su número de
     registro (no llevan número de control); si la impresora falla, el talonario de imprenta autorizada. */
  M.canEmit = () => M.MAQ ? M.mf.ok : M.online();
  M.ctrlLbl = d => d.mf ? 'Registro de la máquina' : d.cont ? 'N.° de control (talonario)' : 'N.° de control';
  M.emitir = o => {
    const tipo = o.tipo || 'FAC', seed = !!o.seed;
    const cont = tipo === 'FAC' && (o.cont ?? (!seed && !M.canEmit()));
    const d = {id:++uid, tipo, fecha:o.fecha || Y.hoy, hora:o.hora || now(), cli:o.cli || {n:'Consumidor final', id:''}, lines:o.lines,
      tasa:o.tasa || Y.rate(), div:r2(o.div || 0), pagos:o.pagos || [], origen:o.origen || null, afecta:o.afecta || null,
      motivo:o.motivo || '', igtf:o.igtf || 0, u:o.u || (typeof S !== 'undefined' ? S.user : ''), cont, rep:o.rep || null};
    if (cont) { const k = M.n.tal++; d.num = 'C-' + p8(k); d.ctrl = (o.ctrl && String(o.ctrl).trim()) || (M.F.talSerie + '-' + p8(k)); d.tal = M.F.talNum; }
    else if (M.MAQ) { d.num = p8(M.n[tipo]++); d.ctrl = M.F.mfSerial; d.mf = true; }
    else { d.num = p8(M.n[tipo]++); d.ctrl = M.F.serie + '-' + p8(M.n.ctrl++); d.asig = d.fecha + ' ' + d.hora; }
    d.t = M.tot(d); M.docs.push(d); return d;
  };
  /* Días anteriores: facturas de consumidor final ya agrupadas (del primer al último número).
     Con impresora fiscal, cada día cerrado tiene su Reporte Z. */
  M.seedHist = (fecha, n, ex, bg, br = 0) => {
    const h = {fecha, n, lo:M.n.FAC, hi:M.n.FAC + n - 1, clo:M.n.ctrl, chi:M.n.ctrl + n - 1, ex:r2(ex), bg:r2(bg), br:r2(br)};
    h.ivg = r2(h.bg * .16); h.ivr = r2(h.br * .08); h.total = r2(h.ex + h.bg + h.br + h.ivg + h.ivr);
    if (M.MAQ) { h.clo = h.chi = 0; if (fecha < Y.hoy) h.z = M.mf.z++; } else M.n.ctrl += n;
    M.n.FAC += n; M.hist.push(h); return h;
  };
  M.zDe = fecha => fecha === Y.hoy ? (M.mf.zHoy ? M.mf.zHoy.n : null) : (M.hist.find(h => h.fecha === fecha && h.z) || {}).z || (M.mf.zDias || {})[fecha] || null;
  /* Días cerrados que solo tienen facturas sueltas (sin resumen en M.hist): cada uno recibe su Reporte Z, en orden */
  M.zSeed = () => { if (!M.MAQ) return; M.mf.zDias = {};
    [...new Set(M.docs.filter(d => d.mf && d.fecha < Y.hoy).map(d => d.fecha))].filter(f => !M.hist.some(h => h.fecha === f && h.z)).sort().forEach(f => { M.mf.zDias[f] = M.mf.z++; }); };
  /* ---------- Notas de crédito y de débito: la factura no se borra ni se edita ---------- */
  M.notasDe = fac => M.docs.filter(x => x.afecta && x.afecta.id === fac.id);
  M.credQ = (fac, i) => M.notasDe(fac).filter(x => x.tipo === 'NC').reduce((a, x) => a + x.lines.filter(l => l.ref === i).reduce((b, l) => b + l.q, 0), 0);
  M.anulada = fac => fac.tipo === 'FAC' && fac.lines.every((l, i) => M.credQ(fac, i) >= l.q - 1e-9);
  M.nota = (tipo, fac, lines, motivo, extra = {}) => {
    const d = M.emitir(Object.assign({tipo, cli:fac.cli, lines, motivo, afecta:{id:fac.id, num:fac.num, ctrl:fac.ctrl, fecha:fac.fecha, total:fac.t.total}}, extra));
    if (Y.onNota) Y.onNota(d, fac, !!extra.seed); return d;
  };
  M.estado = d => {
    if (d.tipo !== 'FAC') return `<span class="pill">Cita la factura ${E(d.afecta.num)}</span>`;
    const ns = M.notasDe(d), nc = ns.filter(x => x.tipo === 'NC'), nd = ns.filter(x => x.tipo === 'ND');
    const c = d.cont ? M.MAQ ? '<span class="pill warn">Talonario · impresora en falla</span>' : (d.rep ?`<span class="pill ok">Contingencia · reportada</span>` : `<span class="pill warn">Contingencia · por reportar</span>`) : '';
    if (M.anulada(d)) return `${c}<span class="pill bad">Anulada con NC ${nc.map(x => x.num).join(', ')}</span>`;
    return c + (nc.length ? `<span class="pill warn">Con NC ${nc.map(x => x.num).join(', ')}</span>` : '') + (nd.length ? `<span class="pill info">Con ND ${nd.map(x => x.num).join(', ')}</span>` : '') + (!c && !ns.length ? '<span class="pill ok">Emitida</span>' : '');
  };

  /* ---------- Contingencia (00093, arts. 6, 7 y 11) ---------- */
  /* Con impresora fiscal no hay PDF que reportar: las facturas del talonario se registran una por una en el Libro de Ventas */
  M.contPend = () => M.MAQ ? [] : M.docs.filter(d => d.cont && !d.rep);
  M.reportar = () => { const p = M.contPend(), st = fd(Y.hoy) + ' ' + now(); p.forEach(d => { d.rep = st; }); return p.length; };
  M.onNet = () => M.online() ? M.reportar() : 0;

  /* ---------- Impresora fiscal: Reporte X, Reporte Z, falla y reparación (Providencia SNAT/2018/0141) ---------- */
  M.delDia = () => { const H = M.hist.filter(h => h.fecha === Y.hoy), D = M.docs.filter(d => d.fecha === Y.hoy && d.mf);
    const F = D.filter(d => d.tipo === 'FAC'), nums = [...H.flatMap(h => [h.lo, h.hi]), ...F.map(d => +d.num)];
    const t = {ex:0, bg:0, br:0, ivg:0, ivr:0, igtf:0, total:0}, sg = d => d.tipo === 'NC' ? -1 : 1;
    H.forEach(h => ['ex','bg','br','ivg','ivr','total'].forEach(k => t[k] = r2(t[k] + h[k])));
    D.forEach(d => { const s = sg(d); t.ex = r2(t.ex + s * d.t.ex); t.bg = r2(t.bg + s * d.t.bg); t.br = r2(t.br + s * d.t.br); t.ivg = r2(t.ivg + s * d.t.ivg); t.ivr = r2(t.ivr + s * d.t.ivr); t.igtf = r2(t.igtf + s * d.t.igtf); t.total = r2(t.total + s * d.t.total); });
    const nc = D.filter(d => d.tipo === 'NC'), nd = D.filter(d => d.tipo === 'ND');
    return {t, nFac:H.reduce((a, h) => a + h.n, 0) + F.length, lo:nums.length ? Math.min(...nums) : 0, hi:nums.length ? Math.max(...nums) : 0, nc, nd,
      tal:M.docs.filter(d => d.fecha === Y.hoy && d.cont).length}; };
  M.zText = kind => {
    const F = M.F, r = M.delDia(), t = r.t, z = kind === 'Z', L = [];
    L.push(ctr('SENIAT')); wrap(U(F.razon), W).forEach(s => L.push(ctr(s))); L.push(ctr('RIF ' + F.rif)); wrap(U(F.dom), W).forEach(s => L.push(ctr(s))); L.push('');
    L.push(ctr(z ? 'REPORTE Z' : 'REPORTE X'), pad(z ? 'Z N:' : 'X N:', String(z ? M.mf.z : M.mf.x).padStart(4, '0')), pad('FECHA: ' + fd(Y.hoy), 'HORA: ' + now()), '-'.repeat(W));
    L.push('FACTURAS', pad('  DESDE', r.lo ? p8(r.lo) : '-'), pad('  HASTA', r.hi ? p8(r.hi) : '-'), pad('  CANTIDAD', r.nFac));
    L.push('NOTAS DE CREDITO', pad('  CANTIDAD', r.nc.length), ...(r.nc.length ? [pad('  DESDE', r.nc[0].num), pad('  HASTA', r.nc[r.nc.length - 1].num)] : []));
    L.push('NOTAS DE DEBITO', pad('  CANTIDAD', r.nd.length), '-'.repeat(W));
    L.push(pad('EXENTO (E)', 'Bs ' + nf(t.ex)), pad('BI G16,00%', 'Bs ' + nf(t.bg)), pad('IVA G16,00%', 'Bs ' + nf(t.ivg)));
    if (t.br) L.push(pad('BI R8,00%', 'Bs ' + nf(t.br)), pad('IVA R8,00%', 'Bs ' + nf(t.ivr)));
    if (t.igtf) L.push(pad('IGTF 3,00%', 'Bs ' + nf(t.igtf)));
    L.push('='.repeat(W), pad('TOTAL VENTAS', 'Bs ' + nf(t.total)), '='.repeat(W), ctr('NETO DE NOTAS DE CREDITO Y DEBITO'));
    if (r.tal) L.push('', ...wrap(`FACTURAS DE TALONARIO DEL DIA: ${r.tal} (NO SUMAN EN ESTE REPORTE; VAN UNA POR UNA EN EL LIBRO DE VENTAS)`));
    L.push('', ctr(z ? 'CIERRE DE LA JORNADA FISCAL' : 'LECTURA SIN CIERRE'), '', ctr('MH   ' + F.mfSerial), '', '', '');
    return L.join('\n');
  };
  M.hacerX = () => { const s = M.zText('X'); M.mf.x++; return s; };
  M.hacerZ = (u, hora = now()) => { if (M.mf.zHoy) return null; const s = M.zText('Z'); M.mf.zHoy = {n:M.mf.z, hora, u, txt:s}; M.mf.z++; return M.mf.zHoy; };
  M.fallaMf = (motivo, u) => { M.mf.ok = false; M.mf.falla = {desde:fd(Y.hoy) + ' ' + now(), motivo, u, aviso:false}; };
  M.reparadaMf = (u, tec) => { const f = M.mf.falla || {desde:fd(Y.hoy), motivo:'Falla'}; M.mf.libro.unshift({f:fd(Y.hoy), tipo:'Reparación', d:`${f.motivo}. En falla desde ${f.desde}.`, tec:tec || M.F.mfDist, u}); M.mf.ok = true; M.mf.falla = null; };
  M.ctrlTxt = d => d.mf ? 'REG. MAQUINA: ' + d.ctrl : (d.cont ? 'N CONTROL (TALONARIO): ' : 'N DE CONTROL: ') + d.ctrl;

  /* ---------- Libro de Ventas ---------- */
  const SIGN = t => t === 'NC' ? -1 : 1;
  M.libroVentas = () => {
    const rows = [], cf = {};
    const grp = f => cf[f] || (cf[f] = {fecha:f, kind:'cf', n:0, lo:1e12, hi:0, clo:1e12, chi:0, ex:0, bg:0, br:0, ivg:0, ivr:0, total:0});
    const addG = (g, x) => { ['ex','bg','br','ivg','ivr','total'].forEach(k => g[k] = r2(g[k] + x[k])); };
    M.hist.filter(h => h.fecha.startsWith(MES)).forEach(h => { const g = grp(h.fecha); g.n += h.n; g.lo = Math.min(g.lo, h.lo); g.hi = Math.max(g.hi, h.hi); g.clo = Math.min(g.clo, h.clo); g.chi = Math.max(g.chi, h.chi); addG(g, h); });
    M.docs.filter(d => d.fecha.startsWith(MES)).forEach(d => {
      const s = SIGN(d.tipo), t = d.t;
      const row = kind => ({fecha:d.fecha, kind, id:d.id, tipo:d.tipo, num:d.num, ctrl:d.ctrl, afecta:d.afecta ? d.afecta.num : '', rif:d.cli.id || '', nombre:d.cli.n,
        ex:s * t.ex, bg:s * t.bg, ivg:s * t.ivg, br:s * t.br, ivr:s * t.ivr, total:s * (t.total - t.igtf), ret:0, comp:'', igtf:s * t.igtf, key:+d.num.replace(/\D/g, '') + (d.cont ? 5e8 : 0) + (d.tipo === 'FAC' ? 0 : 9e8)});
      if (d.tipo !== 'FAC') rows.push(row('nota'));
      else if (d.cont) rows.push(row('cont'));
      else if (hasRif(d.cli.id)) rows.push(row('rif'));
      else { const g = grp(d.fecha), n = +d.num, c = +String(d.ctrl).split('-').pop(); g.n++; g.lo = Math.min(g.lo, n); g.hi = Math.max(g.hi, n); if (!isNaN(c)) { g.clo = Math.min(g.clo, c); g.chi = Math.max(g.chi, c); } addG(g, {...t, total:t.total - t.igtf}); }
    });
    /* Con impresora fiscal, el consumidor final de cada día va en un renglón con su Reporte Z y el registro de la máquina (art. 77, parágrafo segundo) */
    const zLbl = f => { const z = M.zDe(f); return z ? `Reporte Z N.° ${String(z).padStart(4, '0')}` : 'Reporte Z del día (al cerrar la caja)'; };
    Object.values(cf).forEach(g => rows.push({fecha:g.fecha, kind:'cf', tipo:M.MAQ ? 'Z' : 'FAC', z:M.MAQ ? M.zDe(g.fecha) : null, num:g.n > 1 ? `${p8(g.lo)} al ${p8(g.hi)}` : p8(g.lo),
      ctrl:M.MAQ ? M.F.mfSerial : g.chi ? (g.n > 1 ? `${M.F.serie}-${p8(g.clo)} al ${M.F.serie}-${p8(g.chi)}` : `${M.F.serie}-${p8(g.clo)}`) : '',
      afecta:'', rif:'', nombre:M.MAQ ? `${zLbl(g.fecha)} · consumidor final, ${g.n} ${g.n === 1 ? 'factura' : 'facturas'}` : `Consumidor final · ${g.n} ${g.n === 1 ? 'factura' : 'facturas'} del día`, ex:g.ex, bg:g.bg, ivg:g.ivg, br:g.br, ivr:g.ivr, total:g.total, ret:0, comp:'', igtf:0, key:g.lo}));
    rows.sort((a, b) => a.fecha.localeCompare(b.fecha) || a.key - b.key);
    rows.forEach((r, i) => r.op = i + 1);
    return rows;
  };
  M.resumen = rows => rows.reduce((a, r) => { ['ex','bg','ivg','br','ivr','total','ret','igtf'].forEach(k => a[k] = r2(a[k] + (r[k] || 0))); return a; }, {ex:0, bg:0, ivg:0, br:0, ivr:0, total:0, ret:0, igtf:0});

  /* ---------- Libro de Compras y retenciones de ISLR ---------- */
  M.compras = () => Y.compras().map(c => { const s = SIGN(c.tipo); const ex = r2(s * c.ex), bg = r2(s * c.bg), br = r2(s * (c.br || 0)); const cg = r2(bg * .16), cr = r2(br * .08);
    return {...c, ex, bg, br, cg, cr, total:r2(ex + bg + br + cg + cr)}; });
  M.UT = 43; const UTF = 83.3334; const utMin = () => Math.floor(M.UT * UTF * 100) / 100;
  M.ISLR = {hon:['Honorarios profesionales', 3, 5], alq:['Alquiler de inmuebles', 3, 5], ser:['Servicios', 1, 2], fle:['Fletes', 1, 3], pub:['Publicidad', 3, 5]};
  M.islrCalc = (bsA, k, pn) => { const pc = M.ISLR[k][pn ? 1 : 2], r = pc / 100;
    if (!pn) return {pc, sus:0, ret:r2(bsA * r)};
    if (bsA <= utMin()) return {pc, sus:0, ret:0, bajo:true};
    const sus = r2(M.UT * r * UTF); return {pc, sus, ret:r2(bsA * r - sus)}; };
  M.islr = () => Y.islr().map((x, i) => ({...x, bsA:r2(x.bsA), ...M.islrCalc(x.bsA, x.k, x.pn), num:x.num || `ISLR-202610-${String(i + 1).padStart(4, '0')}`, ent:x.ent || 'Por enterar'}));

  /* ---------- Borrador de la declaración de IVA (forma 30) ---------- */
  M.f30 = () => {
    const R = M.resumen(M.libroVentas()), C = M.compras();
    const cred = r2(C.reduce((a, c) => a + c.cg + c.cr, 0)), grav = r2(R.bg + R.br);
    const ded = grav > 0 ? cred : 0, deb = r2(R.ivg + R.ivr), exc = r2(grav > 0 ? (Y.excedente || 0) : 0), ret = R.ret;

    return {R, C, cred, ded, deb, exc, ret, neto, pagar:Math.max(0, neto), sig:Math.max(0, -neto), grav,
      cEx:r2(C.reduce((a, c) => a + c.ex, 0)), cBg:r2(C.reduce((a, c) => a + c.bg, 0)), cBr:r2(C.reduce((a, c) => a + c.br, 0))};
  };

  /* ---------- Calendario fiscal (dato de muestra según el último dígito del RIF) ---------- */
  const habil = iso => { const d = new Date(iso + 'T00:00:00'); while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); };
  M.digito = () => { const m = String(M.F.rif).match(/(\d)\s*$/); return m ? +m[1] : 0; };
  M.cal = () => {
    const g = M.digito(), IVA = [10, 10, 11, 11, 12, 12, 13, 13, 14, 14][g], RET = [3, 3, 4, 4, 5, 5, 6, 6, 9, 9][g];
    const dd = n => habil(`2026-11-${String(n).padStart(2, '0')}`);
    return [
      {t:'Cierre de los libros de octubre (impresos en el local)', f:'2026-10-31', k:'libros'},
      {t:'Enterar las retenciones de ISLR de octubre', f:dd(RET), k:'ret'},
      {t:'Relación mensual de retenciones de ISLR (archivo XML)', f:dd(RET), k:'rel'},
      {t:'Declaración y pago del IVA de octubre (forma 30)', f:dd(IVA), k:'iva'}
    ];
  };
  const daysFrom = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(Y.hoy + 'T00:00:00')) / 86400000);

  /* ---------- Texto del ticket (impresora térmica de 80 mm, 32 columnas) ---------- */
  const W = 32;
  const pad = (a, b) => { a = String(a); b = String(b); return a + ' '.repeat(Math.max(1, W - a.length - b.length)) + b; };
  const ctr = s => { s = String(s); return ' '.repeat(Math.max(0, Math.floor((W - s.length) / 2))) + s; };
  const wrap = (s, w = W) => { const out = []; let ln = ''; String(s).split(/\s+/).forEach(x => { if ((ln + ' ' + x).trim().length > w) { if (ln) out.push(ln); ln = x; } else ln = (ln + ' ' + x).trim(); }); if (ln) out.push(ln); return out; };
  M.ticketText = (d, x = {}) => {
    const F = M.F, t = d.t, L = [];
    if (d.mf) L.push(ctr('SENIAT'));
    wrap(U(F.razon), W).forEach(s => L.push(ctr(s))); L.push(ctr('RIF ' + F.rif)); wrap(U(F.dom), W).forEach(s => L.push(ctr(s))); wrap('TELF. ' + F.tel, W).forEach(s => L.push(ctr(s))); L.push('');
    const tit = d.tipo === 'NC' ? 'NOTA DE CREDITO' : d.tipo === 'ND' ? 'NOTA DE DEBITO' : 'FACTURA';
    L.push(ctr(tit)); if (d.cont) L.push(ctr('(CONTINGENCIA)'));

        openModal(sheet('fxzz', `Reporte Z N.° ${String(z.n).padStart(4, '0')} impreso`, `<div class="printer"></div><div class="tkwrap"><pre class="ticket printing">${z.txt}</pre><span class="sello tk-sello estampar">Cierre fiscal<small>Z ${String(z.n).padStart(4, '0')} · ${E(z.hora)}</small></span></div><p class="small muted" style="margin:0">Va al Libro de Ventas como el renglón de consumidor final de hoy. Guarda el papel con los libros.</p><button class="btn" data-act="close">Listo</button>`, 440)); break; }
      case 'fx-falla': M.fallaMf('La impresora no imprime (simulación)', S.user); reRender(); toast(`Impresora fiscal en falla: la caja factura con el talonario ${M.F.talNum}. Avisa al servicio técnico`); break;
      case 'fx-repara': M.reparadaMf(S.user); reRender(); toast('Impresora fiscal operativa. La reparación quedó anotada en el Libro de Control'); break;

        const bad = ls.find(l => !(l.q > 0) || l.q > l.max + 1e-9); if (bad) { toast(`Revisa la cantidad de ${bad.d}: máximo ${String(bad.max).replace('.', ',')}`); break; }
        const nc = M.nota('NC', d, ls.map(({max, ...l}) => l), document.getElementById('fx-mot').value); reRender(); openModal(M.docModal(nc));
        toast(`Nota de crédito ${nc.num} ${nc.mf ? 'impresa por la impresora fiscal' : 'emitida · control ' + nc.ctrl}${Y.ncToast ? ' · ' + Y.ncToast(nc, d) : ''}`); break; }
      case 'fx-ndgo': { const m = parseBs(document.getElementById('fx-ndm').value); if (!(m > 0)) { toast('Escribe el monto de la nota'); break; }
        const nd = M.nota('ND', d, [{d:document.getElementById('fx-ndc').value.trim() || 'Ajuste', q:1, pu:m, a:document.getElementById('fx-nda').value}], document.getElementById('fx-ndc').value.trim() || 'Ajuste');
        reRender(); openModal(M.docModal(nd)); toast(`Nota de débito ${nd.num} ${nd.mf ? 'impresa por la impresora fiscal' : 'emitida · control ' + nd.ctrl}`); break; }
      case 'fx-tab': M.ui.libro = b.dataset.k; reRender(); break;
      case 'fx-csv': M.csv(b.dataset.k); break;
      case 'fx-rep': { const n = M.reportar(); toast(n ? `${n} ${n === 1 ? 'factura de contingencia enviada' : 'facturas de contingencia enviadas'} en PDF a la imprenta digital` : 'No hay facturas de contingencia por reportar'); reRender(); break; }
      case 'fx-chk': M.chk[b.dataset.k] = !M.chk[b.dataset.k]; reRender(); break;
      case 'fx-wa': toast(`${d.tipo === 'FAC' ? 'Factura' : 'Nota'} ${d.num} enviada en PDF ${b.dataset.m === 'correo' ? 'por correo' : 'por WhatsApp'}${d.cli.tel ? ' al ' + d.cli.tel : ''}`); break;
    }
  });
  document.addEventListener('input', ev => { const t = ev.target;
    if (t.id === 'fx-q') { M.ui.q = t.value; const tb = document.getElementById('fx-tb'); if (tb) tb.innerHTML = M.docRows(); }
    if (t.dataset && t.dataset.fxq !== undefined) M.ncPrev();
    if (t.id === 'fx-ndm') M.ndPrev(); });
  document.addEventListener('change', ev => { const t = ev.target; if (t.dataset && t.dataset.fxl !== undefined) M.ncPrev(); if (t.id === 'fx-nda') M.ndPrev(); });
  document.addEventListener('submit', ev => { if (ev.target.id !== 'fx-dform') return; ev.preventDefault();
    ev.target.querySelectorAll('[data-fxf]').forEach(i => { const v = i.value.trim(); if (v) M.F[i.dataset.fxf] = v; });

  M.boot = () => {

      gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>', fxdoc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h6M9 16h6"/>'};
    Object.keys(I).forEach(k => { if (!ICONS[k]) ICONS[k] = I[k]; });
    (Y.nav || []).forEach(sp => { let g = NAV.find(x => x.g === sp.g); if (!g) { g = {g:sp.g, items:[]}; const i = NAV.findIndex(x => x.g === sp.before); NAV.splice(i < 0 ? NAV.length : i, 0, g); }
      sp.items.forEach(it => { if (!g.items.some(x => x[1] === it[1])) g.items.push(it); }); });
    Object.assign(TITLES, {docs:'Facturas y notas', libros:'Libros y declaración', checklist:'Checklist SENIAT'}, Y.titles || {});
    Object.assign(CODE, {docs:'FN', libros:'LB', checklist:'CK'}, Y.codes || {});
    Object.entries(Y.roleViews || {}).forEach(([r, vs]) => { const R = ROLES[r]; if (R && R.views !== 'all') vs.forEach(v => { if (!R.views.includes(v)) R.views.push(v); }); });
    V.docs = M.vDocs; V.libros = M.vLibros; V.checklist = M.vCheck;
    if (!V.config) V.config = M.cfgView;
    const d0 = V.dashboard; V.dashboard = () => d0() + (S.role === 'Dueño' ? M.ownerPanels() : '');
    Y.seed(M); M.zSeed(); if (Y.after) Y.after(M);
    const h = (location.hash || '').slice(1);
    if (['docs', 'libros', 'checklist', 'config'].includes(h) && can(h)) S.view = h;
    render();
  };
  return M;
})();

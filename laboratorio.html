<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Azullab Laboratorio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   PAPEL FISCAL · sistema de diseño de Cuadre
   Capa 1: tokens (papel / carbón). Capa 2: color del cliente (Azullab).
   Capa 3: componentes aplicados a esta maqueta.
   Diseño: mesa → separadores de archivador → carpeta abierta → hojas con folio.
   ===================================================================== */
:root{
  --mesa:#e8ebef; --hoja:#ffffff; --hoja-alt:#f4f6f9; --renglon:#cbd8ea; --linea:#6f7d94; --margen:#d2453b;
  --tinta:#1a2440; --tinta-2:#4e5a73; --tinta-3:#5d6882;
  --sello-verde:#1f7a43; --sello-verde-suave:#e3f3e8; --sello-rojo:#b3261e; --sello-rojo-suave:#fbe6e4;
  --sello-ambar:#8a5300; --sello-ambar-suave:#fdf0d8; --sello-violeta:#5b3aa6; --sello-violeta-suave:#efe9fb;
  --foco:#1a2440;
  --sombra-hoja:0 1px 2px rgba(26,36,64,.08),0 0 0 1px rgba(26,36,64,.06);
  --sombra-pila:0 1px 2px rgba(26,36,64,.08),0 0 0 1px rgba(26,36,64,.06),5px 5px 0 -1px #ffffff,5px 5px 0 0 #cbd8ea;
  --sombra-flotante:0 18px 48px rgba(13,18,32,.28);
  /* Color del cliente: Azullab Farmacia (celeste y blanco) */
  --acento:#3db2e8; --on-acento:#0b2340; --acento-tinta:#0a6fa8; --acento-suave:#e3f4fc;
  --font-forma:"Archivo","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-maquina:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --alto-renglon:40px;
  /* alias que usa el contenido de la maqueta */
  --ink:var(--tinta); --ink-2:var(--tinta-2); --ink-3:var(--tinta-3); --line:var(--renglon); --azul:var(--acento-tinta);
  --celeste-50:var(--acento-suave); --ok:var(--sello-verde); --warn:var(--sello-ambar); --bad:var(--sello-rojo);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --mesa:#0d1220; --hoja:#161d2e; --hoja-alt:#1c2438; --renglon:#2a3650; --linea:#6b7a95; --margen:#e06a5f;
  --tinta:#e7ecf5; --tinta-2:#a3aec4; --tinta-3:#8794ae;
  --sello-verde:#5fd08e; --sello-verde-suave:#12301f; --sello-rojo:#ff8a7f; --sello-rojo-suave:#3a1714;
  --sello-ambar:#f0b54d; --sello-ambar-suave:#33260d; --sello-violeta:#b9a2ff; --sello-violeta-suave:#251a45;
  --foco:#e7ecf5;
  --sombra-hoja:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06);
  --sombra-pila:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06),5px 5px 0 -1px #161d2e,5px 5px 0 0 #2a3650;
  --sombra-flotante:0 18px 48px rgba(0,0,0,.6);
  --acento:#6cc9f2; --on-acento:#0b2340; --acento-tinta:#6cc9f2; --acento-suave:#123047;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --mesa:#0d1220; --hoja:#161d2e; --hoja-alt:#1c2438; --renglon:#2a3650; --linea:#6b7a95; --margen:#e06a5f;
  --tinta:#e7ecf5; --tinta-2:#a3aec4; --tinta-3:#8794ae;
  --sello-verde:#5fd08e; --sello-verde-suave:#12301f; --sello-rojo:#ff8a7f; --sello-rojo-suave:#3a1714;
  --sello-ambar:#f0b54d; --sello-ambar-suave:#33260d; --sello-violeta:#b9a2ff; --sello-violeta-suave:#251a45;
  --foco:#e7ecf5;
  --sombra-hoja:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06);
  --sombra-pila:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(231,236,245,.06),5px 5px 0 -1px #161d2e,5px 5px 0 0 #2a3650;
  --sombra-flotante:0 18px 48px rgba(0,0,0,.6);
  --acento:#6cc9f2; --on-acento:#0b2340; --acento-tinta:#6cc9f2; --acento-suave:#123047;
  color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--mesa);color:var(--tinta);font-family:var(--font-forma);font-size:15px;line-height:1.47}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.num{font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;line-height:28px;font-weight:700}
h2{font-size:17px;line-height:22px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
svg.i{width:18px;height:18px;flex:none}

/* ---------- Entrada ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--mesa)}
.login .brandside{background:var(--acento);color:var(--on-acento);display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding-block:44px;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:56px;position:relative;
  -webkit-mask:linear-gradient(#000 0 0) left/calc(100% - 9px) 100% no-repeat,radial-gradient(circle 6px at 100% 8px,transparent 98%,#000) right top/9px 16px repeat-y;
          mask:linear-gradient(#000 0 0) left/calc(100% - 9px) 100% no-repeat,radial-gradient(circle 6px at 100% 8px,transparent 98%,#000) right top/9px 16px repeat-y}
.login .brandside h1{font-size:clamp(30px,3.6vw,46px);line-height:1.04;font-weight:800;letter-spacing:-.015em;max-width:15ch;color:var(--on-acento)}
.login .brandside p{max-width:44ch;color:var(--on-acento);font-size:16px;line-height:24px}
.login .facts{display:flex;flex-wrap:wrap;gap:8px}
.login .facts span{border:1.5px solid var(--on-acento);color:var(--on-acento);padding:3px 9px;border-radius:3px;font-stretch:80%;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.login .formside{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login form{width:100%;max-width:420px;display:grid;gap:14px;background:var(--hoja);box-shadow:var(--sombra-pila);border-radius:2px;padding:22px 22px 24px}
.login .firma{font-size:12.5px;color:var(--tinta-3)}
.login .firma b{color:var(--tinta-2);font-weight:800}
.field{display:grid;gap:3px;padding:7px 10px 8px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);min-width:0}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--foco)}
.field label{font-size:11.5px;line-height:14px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3)}
.field .input{border:0;padding:0;min-height:26px;background:transparent;box-shadow:none;font-size:16px;border-radius:0}
.field .input:focus{box-shadow:none}
.field:has(.roles){border:0;padding:0;background:none;box-shadow:none}
.roles{display:flex;gap:4px;border-bottom:1px solid var(--renglon);overflow-x:auto}
.roles button{border:1px solid transparent;border-bottom:0;background:var(--hoja-alt);border-radius:8px 8px 0 0;padding:0 14px;min-height:42px;margin-bottom:-1px;font-weight:600;color:var(--tinta-3);white-space:nowrap}
.roles button.on{background:var(--hoja);border-color:var(--renglon);color:var(--tinta)}
.input{width:100%;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:10px 12px;min-height:44px}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--foco)}

/* ---------- Mesa, separadores y carpeta ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--mesa);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:10px;padding:18px 18px 8px}
.side .nav{display:grid;gap:3px;padding:0 0 16px 10px}
.side .grp{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3);padding:14px 14px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.side .nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 14px;color:var(--tinta-2);text-decoration:none;border:1px solid transparent;border-right:0;border-radius:8px 0 0 8px;font-size:15px}
.side .nav a:hover{background:var(--hoja-alt);color:var(--tinta)}
.side .nav a.on{background:var(--hoja-alt);color:var(--tinta);font-weight:700;border-color:var(--renglon)}
.side .nav a .cod{margin-left:auto;font-family:var(--font-maquina);font-size:11px;color:var(--tinta-3);font-weight:400}
.side .foot{margin-top:auto;padding:14px 18px;border-top:1px dashed var(--linea);font-size:13px;color:var(--tinta-3)}
.side .foot .firma{margin-top:12px;font-size:11.5px}
.side .foot .firma b{font-weight:800;color:var(--tinta-2)}
.main{min-width:0;display:flex;flex-direction:column;background:var(--hoja-alt)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hoja-alt);border-bottom:3px double var(--renglon);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hoja-alt)}
.top .ttl{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1;flex-wrap:wrap}
.top .ttl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .folio{font-family:var(--font-maquina);font-size:12px;color:var(--tinta-3);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:4px 10px;font-size:13px;color:var(--tinta-2);min-height:34px;white-space:nowrap}
.chip b{font-family:var(--font-maquina);font-weight:600;color:var(--tinta)}
button.chip:hover{border-color:var(--tinta)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sello-verde);flex:none}
.chip.off{background:var(--sello-ambar-suave);border-color:var(--sello-ambar);color:var(--sello-ambar);font-weight:700}
.chip.off .dot{background:var(--sello-ambar)}
.menu-btn{display:none;border:1px solid var(--linea);background:var(--hoja);border-radius:4px;width:44px;height:44px;align-items:center;justify-content:center}
.offbar{background:var(--sello-ambar-suave);color:var(--tinta);border-bottom:1px dashed var(--sello-ambar);padding-block:9px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.offbar svg{color:var(--sello-ambar)}
.offbar b{color:var(--sello-ambar)}
.content{padding-block:22px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.phase{font-family:var(--font-forma);font-stretch:80%;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:2px 7px;white-space:nowrap}
.phase.f1{color:var(--sello-violeta);background:var(--sello-violeta-suave)}
.phase.f2{color:var(--sello-verde);background:var(--sello-verde-suave)}
.lead{color:var(--tinta-2);max-width:75ch}

/* ---------- Hojas ---------- */
.panel{background:var(--hoja);border-radius:2px;box-shadow:var(--sombra-hoja);min-width:0}
.panel.doc{box-shadow:var(--sombra-pila)}
.panel>.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px 10px;border-bottom:1px solid var(--renglon)}
.pfolio{display:block;font-family:var(--font-maquina);font-size:11px;line-height:14px;font-weight:400;color:var(--tinta-3);margin-bottom:3px;letter-spacing:0}
.panel>.bd{padding:16px;min-width:0}
.panel>.bd.flush{padding:0}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* Planilla de cifras: casillas unidas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:4px;overflow:hidden;box-shadow:var(--sombra-hoja)}
.kpi{background:var(--hoja);padding:10px 14px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi .l{font-size:11.5px;line-height:14px;font-weight:600;letter-spacing:.02em;color:var(--tinta-3)}
.kpi .v{font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-size:27px;line-height:34px;font-weight:600;letter-spacing:-.01em}
.kpi .s{font-size:13px;color:var(--tinta-2)}
.kpi .s.num{font-size:12.5px}
.kpi.hero{background:var(--acento-suave)}
.kpi.hero .l{color:var(--acento-tinta)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--linea);border-radius:4px;background:var(--hoja);color:var(--tinta);font-weight:600;font-size:15px;box-shadow:0 2px 0 0 var(--renglon);transition:transform .06s ease,box-shadow .06s ease}
.btn:hover{border-color:var(--tinta-2)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 0 var(--renglon)}
.btn.primary{background:var(--acento);border-color:var(--acento);color:var(--on-acento);box-shadow:0 2px 0 0 var(--tinta)}
.btn.primary:hover{border-color:var(--tinta)}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--tinta-3)}
.small{font-size:13px}

/* ---------- Libro ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--tinta-3);font-size:11.5px;letter-spacing:.02em;padding:10px 12px 8px;border-bottom:3px double var(--renglon);white-space:nowrap;background:var(--hoja)}
td{padding:7px 12px;height:var(--alto-renglon);border-bottom:1px solid var(--renglon);vertical-align:middle}
th:first-child,td:first-child{border-right:4px double var(--margen)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:3px double var(--tinta-2);border-bottom:0;background:var(--hoja)}
tfoot td.r span{text-decoration:underline double;text-underline-offset:5px;text-decoration-thickness:1px}
.base-legal{font-size:12.5px;color:var(--tinta-3);padding:10px 16px;border-top:1px dashed var(--renglon)}
.pin{font-family:var(--font-maquina);letter-spacing:.5em;font-size:20px}
.login .aviso-off{width:100%;max-width:420px;background:var(--sello-ambar-suave);border:1px dashed var(--sello-ambar);border-radius:4px;padding:10px 14px;font-size:14px;color:var(--tinta);display:flex;gap:10px;align-items:flex-start}
.login .aviso-off b{color:var(--sello-ambar)}
.login .aviso-off svg{color:var(--sello-ambar);margin-top:2px}
td.r,th.r{text-align:right;white-space:nowrap}
td.r{font-family:var(--font-maquina);font-variant-numeric:tabular-nums}
td.num{white-space:nowrap}
tbody tr:hover td{background:var(--acento-suave)}
.pill{--c:var(--tinta-2);--cs:var(--hoja-alt);display:inline-flex;align-items:center;gap:4px;padding:2px 7px;color:var(--c);background:var(--cs);border:1px solid var(--c);border-radius:3px;font-family:var(--font-forma);font-stretch:80%;font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill svg.i{width:14px;height:14px}
.pill.ok{--c:var(--sello-verde);--cs:var(--sello-verde-suave)}
.pill.warn{--c:var(--sello-ambar);--cs:var(--sello-ambar-suave)}
.pill.bad{--c:var(--sello-rojo);--cs:var(--sello-rojo-suave)}
.pill.info{--c:var(--sello-violeta);--cs:var(--sello-violeta-suave)}
.iva{font-family:var(--font-maquina);font-size:11.5px;font-weight:500;border-radius:3px;padding:0 4px;border:1px solid var(--linea);color:var(--tinta-2);white-space:nowrap}
.list{display:grid}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 16px;min-height:var(--alto-renglon);border-bottom:1px solid var(--renglon)}
.list .it:last-child{border-bottom:0}
.list .it .t{min-width:0;flex:1}
.list .it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--renglon)}
.stat:last-child{border-bottom:0}

/* ---------- Gráficos ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--renglon)}
.chart .bar.today{fill:var(--acento)}
.chart .gl{stroke:var(--renglon);stroke-width:1;stroke-dasharray:3 3}
.chart text{fill:var(--tinta-3);font-size:11.5px;font-family:var(--font-maquina)}
.chart text.v{fill:var(--tinta);font-weight:600}
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:14px}
.hbar .trk{height:10px;background:var(--hoja-alt);border:1px solid var(--renglon)}
.hbar .fill{height:100%;background:var(--acento)}
.hbar .val{text-align:right;font-family:var(--font-maquina);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- Caja ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:20px;align-items:start}
#cartbox{position:sticky;top:96px;filter:drop-shadow(0 1px 1px rgba(26,36,64,.14)) drop-shadow(0 6px 14px rgba(26,36,64,.08))}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tinta-3)}
.search .input{padding-left:42px;min-height:52px;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cats button{border:1px solid var(--linea);background:var(--hoja);border-radius:4px;padding:5px 12px;white-space:nowrap;font-size:14px;min-height:36px;color:var(--tinta-2)}
.cats button.on{background:var(--tinta);color:var(--hoja);border-color:var(--tinta);font-weight:600}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.prod{text-align:left;border:1px solid var(--renglon);background:var(--hoja);border-radius:2px;padding:12px 12px 10px;display:grid;gap:6px;min-height:136px;align-content:start;box-shadow:0 1px 0 0 var(--renglon)}
.prod:hover{border-color:var(--acento-tinta)}
.prod:active{transform:translateY(1px)}
.prod .nm{font-weight:600;line-height:1.25}
.prod .meta{font-size:12.5px;color:var(--tinta-3)}
.prod .pr{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:auto;border-top:1px dashed var(--renglon);padding-top:8px}
.prod .pr b{font-family:var(--font-maquina);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.prod .pr span{font-family:var(--font-maquina);font-size:11.5px;color:var(--tinta-3);font-variant-numeric:tabular-nums}
.prod .tags{display:flex;gap:4px;flex-wrap:wrap}
.cart{display:grid;background:var(--hoja);padding-block:10px 12px;
  -webkit-mask:radial-gradient(circle 5px at 7px 0,transparent 98%,#000) top left/14px 51% repeat-x,radial-gradient(circle 5px at 7px 100%,transparent 98%,#000) bottom left/14px 51% repeat-x;
          mask:radial-gradient(circle 5px at 7px 0,transparent 98%,#000) top left/14px 51% repeat-x,radial-gradient(circle 5px at 7px 100%,transparent 98%,#000) bottom left/14px 51% repeat-x}
.cart>.hd{border-bottom:1px dashed var(--linea)}

function barSvg(code){
  let x = 0, r = '';
  const bars = c => { for (let i=0;i<7;i++){ const w = ((c>>i)&1) + 1; if (i%2===0) r += `<rect x="${x}" y="0" width="${w}" height="30" fill="#1a2440"/>`; x += w + 1; } };
  bars(91); [...code].forEach(ch => bars(ch.charCodeAt(0)*7)); bars(93);
  return `<svg viewBox="0 0 ${x} 30" preserveAspectRatio="none" role="img" aria-label="Código de barras ${code}">${r}</svg>`;
}
function qrSvg(seed){
  let x = seed * 9301 + 49297, cells = '';
  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  const finder = (cx, cy) => `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#1a2440"/><rect x="${cx+1}" y="${cy+1}" width="5" height="5" fill="#fff"/><rect x="${cx+2}" y="${cy+2}" width="3" height="3" fill="#1a2440"/>`;
  for (let i=0;i<25;i++) for (let j=0;j<25;j++){ const inF = (i<8&&j<8)||(i<8&&j>16)||(i>16&&j<8); if (!inF && rnd()>.52) cells += `<rect x="${j}" y="${i}" width="1" height="1" fill="#1a2440"/>`; }
  return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="Código QR de verificación (muestra)" style="background:#fff">${finder(0,0)}${finder(18,0)}${finder(0,18)}${cells}</svg>`;
}

const pad = (a,b,w=32) => { a=String(a); b=String(b); const sp = Math.max(1, w-a.length-b.length); return a + ' '.repeat(sp) + b; };
const ctr = (s,w=32) => { s=String(s); const l = Math.max(0, Math.floor((w-s.length)/2)); return ' '.repeat(l)+s; };
function ticketText(o){
  const r = S.rate, p = patBy(o.pat), L = [];
  L.push(ctr('AZULLAB LABORATORIO'), ctr('CLINICO, C.A.'), ctr('RIF J-XXXXXXXX-X'), ctr('LA AZULITA, MUNICIPIO'), ctr('ANDRES BELLO, MERIDA'), '');
  L.push(ctr(o.cont?'FACTURA DE CONTINGENCIA':'FACTURA'), pad('FACTURA N:', o.fac), pad(o.cont?'N CONTROL TALONARIO:':'N DE CONTROL:', o.ctrl));
  L.push(pad('FECHA: '+HOY, 'HORA: '+o.t), 'C.I.: '+p.ci.replace(/\./g,''), 'NOMBRE: '+up(p.n).slice(0,24), pad('ORDEN:', o.n), '-'.repeat(32));
  o.items.forEach(it => { const n = it.k==='perf' ? 'PERFIL '+up(perfBy(it.c).n) : up(exBy(it.c).n); const v = it.k==='perf' ? perfBy(it.c).p : exBy(it.c).p;
    L.push(n.slice(0,32)); L.push(pad('  1 x '+nf(v*r), nf(v*r)+' (E)')); });
  L.push('-'.repeat(32), pad('EXENTO (E)', 'Bs '+nf(o.usd*r)), pad('BI G16,00%', 'Bs 0,00'), pad('IVA G16,00%', 'Bs 0,00'));
  L.push('='.repeat(32), pad('TOTAL', 'Bs '+nf(o.usd*r)), '='.repeat(32), pad(up(o.pay), 'Bs '+nf(o.usd*r)), '', pad('REF. USD', nf(o.usd)), pad('TASA BCV', nf(r)), '');
  L.push(...(o.cont ? [ctr('SE REPORTA A LA IMPRENTA'), ctr('AL VOLVER LA CONEXION')] : [ctr('IMPRENTA DIGITAL AUTORIZADA'), ctr('POR EL SENIAT'), ctr('VERIFIQUE CON EL CODIGO QR')]));
  L.push('', ctr('RESULTADOS: '+(exOf(o).some(c=>exBy(c).h==='24 horas')?'MANANA 10:00':'HOY 14:00')), ctr('O POR WHATSAPP'), '', '', '');
  return L.join('\n');
}

        <div class="row"><button class="btn sm" data-act="etq" data-o="${o.n}">${ic('tag')}Etiquetas</button><button class="btn primary sm" data-act="tomada" data-o="${o.n}">${ic('check')}Muestras tomadas</button></div></div>`; }).join('')
      : '<div class="empty"><b>No hay pacientes en sala</b><span>Cuando se cobre una orden en Atender paciente, aparece aquí.</span></div>'}</div></section>
  <section class="panel"><div class="hd"><h2>Tomadas hoy</h2></div><div class="bd flush tbl-wrap"><table><thead><tr><th>Orden</th><th>Paciente</th><th>Tubos</th><th>Toma</th><th>Estado</th></tr></thead>
    <tbody>${done.map(o=>`<tr><td class="num">${o.n}</td><td><b>${patBy(o.pat).n}</b></td><td><div class="tubos">${tubesSorted(o).map(t=>`<span class="tubo ${TUBOS[t].f?'frasco':''}" style="--t:${TUBOS[t].c}" title="${TUBOS[t].n}"><i></i></span>`).join('')}</div></td><td class="num">${o.toma}</td><td>${stPill(o.st)}</td></tr>`).join('')}</tbody></table></div></section>`;
};

/* ---------- Carga de resultados ---------- */
function pickList(list, sel, view){
  return `<section class="panel"><div class="bd flush picklist">${list.length ? list.map(o => { const p = patBy(o.pat); const cr = critOf(o).length;
    return `<button class="${o.n===sel?'on':''}" data-act="pick" data-v="${view}" data-o="${o.n}"><span class="row" style="gap:6px"><b>${p.n}</b>${o.urg?'<span class="pill bad">Urgente</span>':''}${cr&&view==='validacion'?`<span class="flag c">${cr} crítico</span>`:''}</span>
      <span class="num">${o.n} · ${exOf(o).join(' · ')}</span>${view==='resultados'?`<span class="small muted">${filledOf(o)} de ${paramsOf(o).length} valores cargados</span>`:view==='entrega'?`<span>${stPill(o.st)}</span>`:''}</button>`; }).join('')
    : '<div class="empty"><b>Nada pendiente</b></div>'}</div></section>`;
}
function resRows(o, edit){
  const p = patBy(o.pat), h = HIST[o.pat]||{};
  return exOf(o).map(c => { const e = exBy(c);
    return `<div class="exhd"><b>${e.n}</b><span class="row" style="gap:8px">${tuboH(e.t)}<span class="pill">${e.a}</span></span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Prueba</th><th class="r">Resultado</th><th>Unidad</th><th>Referencia</th><th>Marca</th>${edit?'':'<th>Anterior</th>'}</tr></thead><tbody>
    ${e.ps.map(pr => { const v = o.res[pr.k], f = flagOf(pr, v, p.s); const hv = h[pr.k] ? h[pr.k][h[pr.k].length-1] : null;
      const cell = edit ? (pr.t==='txt' ? `<select class="res-in ${f?(f==='L'||f==='CL'?'l':'h'):''}" data-res="${pr.k}" aria-label="${pr.n}"><option value="">—</option>${pr.o.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`
        : `<input class="res-in ${f?(f==='L'||f==='CL'?'l':'h'):''}" data-res="${pr.k}" inputmode="decimal" aria-label="${pr.n}" value="${v===undefined||v===''?'':vtxt(pr,v)}">`) : vtxt(pr, v);
      let delta = '';
      if (!edit && hv && pr.t!=='txt'){ const d = (v-hv[1])/hv[1]*100; delta = `<span class="num">${vtxt(pr,hv[1])}</span> <span class="small muted">${hv[0]} · ${d>0?'+':''}${fv(d,0)} %</span>`; }
      return `<tr><td><b>${pr.n}</b></td><td class="r ${!edit&&f?(f==='L'||f==='CL'?'v-l':'v-h'):''}" ${edit?'style="font-family:var(--font-forma)"':''}>${cell}</td><td class="small muted">${pr.u||''}</td><td class="num small">${refTxt(pr,p.s)}</td><td id="f-${pr.k}">${flagH(f)}</td>${edit?'':`<td>${delta||'<span class="muted small">—</span>'}</td>`}</tr>`; }).join('')}
    </tbody></table></div>`; }).join('');
}
function ordHead(o){ const p = patBy(o.pat);
  return `<div class="pipe"><div><span>Paciente</span><b>${p.n}</b></div><div><span>Edad y sexo</span><b>${ageOf(p.b)} años · ${p.s==='F'?'F':'M'}</b></div><div><span>Orden</span><b class="num">${o.n}</b></div><div><span>Médico</span><b>${medTxt(o.med)}</b></div><div><span>Toma</span><b class="num">${o.toma||'—'}</b></div></div>`; }
V.resultados = () => {
  const list = ORD.filter(o=>o.st==='En proceso');
  if (!list.find(o=>o.n===S.sel.resultados)) S.sel.resultados = list[0] ? list[0].n : null;
  const o = ordBy(S.sel.resultados);
  return `<p class="lead">El bioanalista escribe cada valor y el sistema lo compara al momento con la referencia de su edad y sexo. Lo que sale de rango se marca solo; lo crítico se marca en rojo.</p>
  <div class="split"><div>${pickList(list, S.sel.resultados, 'resultados')}</div>
  ${o ? `<section class="panel"><div class="hd"><h2>Resultados de ${o.n}</h2><span class="small muted" id="prog">${filledOf(o)} de ${paramsOf(o).length} valores</span></div>
    <div class="bd" style="display:grid;gap:12px">${ordHead(o)}</div>
    <div class="bd flush" style="border-top:1px solid var(--renglon)">${resRows(o, true)}</div>
    <div class="bd row" style="border-top:1px dashed var(--renglon)"><button class="btn sm" data-act="demofill" data-o="${o.n}">Llenar con valores de muestra</button><span class="spacer"></span>
      <button class="btn" data-act="toast" data-m="Borrador guardado: otro bioanalista puede seguirlo">Guardar borrador</button><button class="btn primary" data-act="tovalid" data-o="${o.n}">${ic('shield')}Enviar a validación</button></div></section>`
  : '<section class="panel"><div class="empty"><b>No hay muestras en proceso</b><span>Cuando la sala marque una muestra como tomada, aparece aquí.</span></div></section>'}</div>`;
};

/* ---------- Validación ---------- */
V.validacion = () => {
  const list = ORD.filter(o=>o.st==='Por validar');
  if (!list.find(o=>o.n===S.sel.validacion)) S.sel.validacion = list[0] ? list[0].n : null;
  const o = ordBy(S.sel.validacion);
  const cr = o ? critOf(o) : [];
  return `<p class="lead">Antes de firmar, el bioanalista ve cada valor junto al resultado anterior del mismo paciente. Si hay un valor crítico, el sistema no deja firmar hasta registrar el aviso al médico.</p>
  <div class="split"><div>${pickList(list, S.sel.validacion, 'validacion')}</div>
  ${o ? `<section class="panel"><div class="hd"><h2>Validar ${o.n}</h2><span class="small muted">Cargado por ${BIO}</span></div>
    <div class="bd" style="display:grid;gap:12px">${ordHead(o)}
    ${cr.length ? (o.aviso ? `<div class="crit" style="background:var(--sello-verde-suave);border-color:var(--sello-verde)">${ic('check')}<span><b style="color:var(--sello-verde)">Aviso registrado.</b> ${o.aviso.to} fue avisado por teléfono a las ${o.aviso.t} por ${o.aviso.by}. Queda en el historial de la orden.</span></div>`
      : `<div class="crit">${ic('bell')}<div style="display:grid;gap:8px;flex:1"><span><b>Valor crítico:</b> ${cr.map(x=>`${x.p.n} ${vtxt(x.p,o.res[x.p.k])} ${x.p.u}`).join(', ')}. Hay que avisar al médico tratante (${medTxt(o.med)}) antes de firmar.</span><div class="row"><button class="btn sm" data-act="aviso" data-o="${o.n}">${ic('phone')}Registrar aviso al médico</button></div></div></div>`) : ''}
    </div>
    <div class="bd flush" style="border-top:1px solid var(--renglon)">${resRows(o, false)}</div>
    <div class="bd row" style="border-top:1px dashed var(--renglon)"><button class="btn" data-act="repetir" data-o="${o.n}">${ic('undo')}Devolver para repetir</button><span class="spacer"></span>
      <span class="small muted">La firma es siempre del bioanalista responsable.</span><button class="btn primary" data-act="validar" data-o="${o.n}" ${cr.length&&!o.aviso?'disabled':''}>${ic('shield')}Validar y firmar</button></div></section>`
  : '<section class="panel"><div class="empty"><b>No hay resultados por validar</b><span>Todo está firmado.</span></div></section>'}</div>`;
};

/* ---------- Entrega ---------- */
function firmaSvg(){ return `<svg viewBox="0 0 150 34" aria-hidden="true"><path d="M4 26c10-14 16-20 20-14s-6 14 2 10 12-18 18-16-4 16 4 14 10-10 16-12 2 8 8 8 12-8 18-8 6 6 14 4 14-6 22-6" fill="none" stroke="#0a3d75" stroke-width="1.6" stroke-linecap="round"/></svg>`; }
function informe(o){
  const p = patBy(o.pat), fl = flagsOf(o);
  return `<article class="informe" aria-label="Informe de resultados ${o.n}">
    <div class="memb"><div class="row" style="gap:12px">${LOGO(44)}<div style="display:grid;gap:2px"><b style="font-size:18px">Azullab Laboratorio Clínico</b><span style="font-size:12px;color:#4e5a73">RIF J-XXXXXXXX-X · La Azulita, municipio Andrés Bello, Mérida</span><span style="font-size:12px;color:#4e5a73">Grupo Empresarial Azullab · @grupoempresarialazullab</span></div></div>
      <div class="dat"><b style="font-size:15px;color:#1a2440">Informe de resultados</b><br>Orden <span class="num">${o.n}</span> · Factura <span class="num">${o.fac}</span><br>Emitido ${HOY} ${o.val.t}</div></div>
    <div class="pdat"><div><span>Paciente</span><b>${p.n}</b></div><div><span>Cédula</span><b class="num">${p.ci}</b></div><div><span>Edad y sexo</span><b>${ageOf(p.b)} años · ${sexTxt(p.s)}</b></div><div><span>Médico</span><b>${medTxt(o.med)}</b></div>
      <div><span>Toma de muestra</span><b class="num">${HOY} ${o.toma}</b></div><div><span>Validado</span><b class="num">${HOY} ${o.val.t}</b></div><div><span>Ayuno</span><b>${(o.vis&&o.vis.ay)||'No indicado'}</b></div><div><span>Motivo o diagnóstico</span><b>${(o.vis&&o.vis.dx)||'—'}</b></div></div>
    ${exOf(o).map(c => { const e = exBy(c); return `<h3>${e.n}</h3><table><thead><tr><th>Prueba</th><th class="r">Resultado</th><th>Unidad</th><th>Valores de referencia</th></tr></thead><tbody>
      ${e.ps.map(pr => { const v = o.res[pr.k], f = flagOf(pr, v, p.s); return `<tr><td>${pr.n}</td><td class="r ${f?(f==='L'||f==='CL'?'v-l':'v-h'):''}">${vtxt(pr,v)}${f==='H'||f==='CH'?' ↑':f==='L'||f==='CL'?' ↓':f==='X'?' *':''}</td><td>${pr.u||''}</td><td class="num">${refTxt(pr,p.s)}</td></tr>`; }).join('')}</tbody></table>`; }).join('')}
    <p class="obs">${o.vis&&o.vis.emb==='Sí'?'Paciente embarazada'+(o.vis.fur?' (FUR '+fmtDate(o.vis.fur)+')':'')+'. ':''}${ayunoOf(o)&&o.vis&&(o.vis.ay==='No está en ayunas'||o.vis.ay==='Menos de 8 horas')?'Muestra tomada sin el ayuno indicado ('+o.vis.ay.toLowerCase()+'). ':''}${fl.length?`↑ Por encima de la referencia · ↓ Por debajo · * Fuera de lo esperado. ${fl.length} ${fl.length===1?'valor fuera de rango':'valores fuera de rango'}: consulte a su médico.`:'Todos los valores dentro de la referencia.'} Valores de referencia para adultos según sexo; el médico interpreta los resultados con la historia del paciente.</p>
    <div class="pie"><div class="qr2">${qrSvg(parseInt(o.n.slice(2)))}<span>Verifique este informe con el código QR. Cualquier cambio después de la firma invalida el código.</span></div>
      ${o.st==='Entregado'?`<span class="sello">Entregado<small>${o.ent}</small></span>`:`<span class="sello verde">Validado<small>${HOY} ${o.val.t}</small></span>`}
      <div class="firma2"><div class="ln">${firmaSvg()}</div><b>${o.val.by}</b><span>Licenciada en Bioanálisis</span><span class="num">Colegio N° XXXXX · MPPS N° XXXXX</span></div></div>
  </article>`;

V.entrega = () => {
  const list = ORD.filter(o=>o.st==='Validado'||o.st==='Entregado').sort((a,b)=>a.st.localeCompare(b.st)*-1);
  if (!list.find(o=>o.n===S.sel.entrega)) S.sel.entrega = list[0] ? list[0].n : null;
  const o = ordBy(S.sel.entrega);
  return `<p class="lead">Solo salen informes firmados por el bioanalista. Se imprimen en carta o se mandan en PDF por WhatsApp; atención al paciente los entrega pero no los puede cambiar.</p>
  <div class="split"><div>${pickList(list, S.sel.entrega, 'entrega')}</div>
  ${o ? `<div style="display:grid;gap:14px;min-width:0"><div class="row"><button class="btn" data-act="print">${ic('printer')}Imprimir</button><button class="btn" data-act="wa" data-o="${o.n}">${ic('wa')}Enviar por WhatsApp</button><span class="spacer"></span>
    ${o.st==='Validado'?`<button class="btn primary" data-act="entregar" data-o="${o.n}">${ic('check')}Marcar entregado en mano</button>`:`<span class="pill">${ic('check')}Entregado ${o.ent}</span>`}</div>${informe(o)}</div>`
  : '<section class="panel"><div class="empty"><b>No hay informes firmados todavía</b></div></section>'}</div>`;
};

/* ---------- Pacientes ---------- */
function spark(pts, r, d, u){
  const W = 560, H = 180, pl = 48, pr = 20, pt = 16, pb = 30, n = pts.length;
  const vals = pts.map(p=>p[1]); let lo = Math.min(...vals, r[0]==null?Infinity:r[0]), hi = Math.max(...vals, r[1]==null?-Infinity:r[1]);
  const m = (hi-lo)*.15 || 1; lo -= m; hi += m;
  const y = v => pt + (hi - v)/(hi - lo)*(H - pt - pb), x = i => pl + i*(W - pl - pr)/Math.max(1, n-1);
  const band = `<rect class="ref" x="${pl}" y="${y(r[1]==null?hi:r[1])}" width="${W-pl-pr}" height="${y(r[0]==null?lo:r[0]) - y(r[1]==null?hi:r[1])}"/>`;
  const gl = [r[0],r[1]].filter(v=>v!=null).map(v=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fv(v,d)}</text>`).join('');
  const path = pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p[1])}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución en ${u}">${band}${gl}<path class="ln" d="${path}"/>
    ${pts.map((p,i)=>`<circle class="pt ${p[2]?'h':''}" cx="${x(i)}" cy="${y(p[1])}" r="5"/><text x="${x(i)}" y="${y(p[1])-11}" text-anchor="middle" style="fill:var(--tinta);font-weight:600">${fv(p[1],d)}</text><text x="${x(i)}" y="${H-8}" text-anchor="middle">${p[0]}</text>`).join('')}</svg>`;
}
V.pacientes = () => {
  const p = patBy(S.pat), os = ORD.filter(o=>o.pat===p.id), h = HIST[p.id]||{};
  const keys = Object.keys(h);
  const charts = keys.slice(0,2).map(k => { let pr; EX.forEach(e=>e.ps.forEach(x=>{ if (x.k===k) pr = x; }));
    const pts = h[k].map(([dt,v])=>[dt.slice(0,5)+'-'+dt.slice(8), v, !!flagOf(pr,v,p.s)]);
    const cur = os.find(o=>o.res[k]!==undefined && o.st!=='En proceso'); if (cur) pts.push(['Hoy', cur.res[k], !!flagOf(pr,cur.res[k],p.s)]);
    return `<div style="display:grid;gap:4px"><b>${pr.n} <span class="small muted">(${pr.u} · franja verde = referencia)</span></b>${spark(pts, refOf(pr,p.s), pr.d||0, pr.u)}</div>`; }).join('');
  return `<p class="lead">Cada paciente se registra una sola vez con su cédula. Sus resultados quedan guardados y el bioanalista ve cómo van cambiando de una visita a otra.</p>
  <section class="panel"><div class="hd"><h2>Pacientes</h2><span class="small muted">${PATS.length} registrados · toca uno para ver su historial</span></div><div class="bd flush tbl-wrap"><table><thead><tr><th>Cédula</th><th>Nombre</th><th class="r">Edad</th><th>Sexo</th><th>Teléfono</th><th class="r">Visitas</th><th>Hoy</th></tr></thead>
    <tbody>${PATS.map(x=>{ const o = ORD.find(y=>y.pat===x.id); const v = (HIST[x.id]?Object.values(HIST[x.id])[0].length:0) + (o?1:0);
      return `<tr data-act="patsel" data-p="${x.id}" style="cursor:pointer${x.id===S.pat?';background:var(--acento-suave)':''}"><td class="num">${x.ci}</td><td><b>${x.n}</b></td><td class="r">${ageOf(x.b)}</td><td>${x.s==='F'?'F':'M'}</td><td class="num">${x.tel}</td><td class="r">${v}</td><td>${o?stPill(o.st):''}</td></tr>`; }).join('')}</tbody></table></div></section>
  <div class="grid g-dash">
    <section class="panel"><div class="hd"><h2>Evolución de ${p.n}</h2></div><div class="bd" style="display:grid;gap:18px">${charts || '<p class="muted">Paciente nuevo: la gráfica aparece desde la segunda visita.</p>'}</div></section>
    <section class="panel"><div class="hd"><h2>Historial</h2><span class="small muted">${p.ci} · ${ageOf(p.b)} años</span></div><div class="bd flush list">
      ${os.map(o=>`<div class="it"><div class="t"><b>${HOY} · ${o.n}</b><span class="small muted">${itemsTxt(o)}</span></div>${stPill(o.st)}</div>`).join('')}
      ${[...new Set(keys.flatMap(k=>h[k].map(x=>x[0])))].sort((a,b)=>b.split('-').reverse().join().localeCompare(a.split('-').reverse().join())).map(dt=>`<div class="it"><div class="t"><b>${dt}</b><span class="small muted">${keys.filter(k=>h[k].some(x=>x[0]===dt)).map(k=>{let n;EX.forEach(e=>e.ps.forEach(x=>{if(x.k===k)n=x.n;}));return n;}).join(' · ')}</span></div><span class="pill">${ic('check')}Entregado</span></div>`).join('')}
    </div></section>
  </div>`;
};

/* ---------- Catálogo ---------- */

    <tbody>${PERF.map(p=>`<tr><td class="num">${p.c}</td><td><b>${p.n}</b></td><td class="small">${p.ex.map(c=>exBy(c).n.replace(/ \(.*\)/,'')).join(', ')}</td>${$$?`<td class="r">${nf(sumEx(p.ex))}</td><td class="r"><b>${nf(p.p)}</b></td><td class="r">${fv((1-p.p/sumEx(p.ex))*100,0)} %</td>`:''}</tr>`).join('')}</tbody></table></div></section>
  <section class="panel"><div class="hd"><h2>Exámenes</h2>${S.role==='Dueño'?`<button class="btn sm" data-act="toast" data-m="Aquí se agrega un examen con su tubo, tiempo, precio y valores de referencia">${ic('plus')}Examen nuevo</button>`:''}</div><div class="bd flush tbl-wrap"><table><thead><tr><th>Código</th><th>Examen</th><th>Área</th><th>Muestra</th><th>Entrega</th><th class="r">Pruebas</th>${$$?'<th class="r">Precio $</th><th class="r">Precio Bs</th>':''}</tr></thead>
    <tbody>${EX.map(e=>`<tr><td class="num">${e.c}</td><td><b>${e.n}</b>${e.ay?' <span class="small muted">· ayuno</span>':''}</td><td>${e.a}</td><td>${tuboH(e.t)}</td><td>${e.h}</td><td class="r">${e.ps.length}</td>${$$?`<td class="r">${nf(e.p)}</td><td class="r">${nf(e.p*S.rate)}</td>`:''}</tr>`).join('')}</tbody></table></div>
    <p class="base-legal">Valores de referencia de muestra para adultos. Cada laboratorio usa los de sus propios reactivos y equipos.</p></section>`;
};

/* ---------- Reactivos ---------- */
V.reactivos = () => {
  const rows = REAC.map(r=>({...r, dl:daysTo(r.e), cov:r.q/r.d}));
  const st = r => r.dl<0 ? ['bad','Vencido'] : r.cov<=10 ? ['bad','Pedir ya'] : r.dl<=45 ? ['warn',`Vence en ${r.dl} días`] : ['ok','Bien'];

/* Avisos que salen de la ficha y de la visita */
function alertsOf(p, v, needAy){
  const a = []; v = v || {};
  if (p.alerg) a.push(['bad','alert',`Alergia: ${p.alerg}`]);
  if (p.ant.includes('Toma anticoagulantes') || p.ant.includes('Problemas de coagulación') || ANTICO.test(p.meds+' '+(v.medsHoy||''))) a.push(['warn','alert','Anticoagulado o sangra fácil: presionar 3 a 5 minutos después de la punción']);
  if (ageOf(p.b) < 18) a.push(['info','users', p.rep ? `Menor de edad · viene con ${p.rep.n} (${p.rep.par.toLowerCase()})` : 'Menor de edad: falta el representante']);
  if (v.emb==='Sí') a.push(['info','check', `Embarazada${v.fur?' · FUR '+fmtDate(v.fur):''}`]);
  if (v.emb==='No sabe') a.push(['warn','alert', `Posible embarazo${v.fur?' · FUR '+fmtDate(v.fur):''}`]);
  if (needAy){ if (!v.ay) a.push(['warn','clock','Pide ayuno: pregunta cuántas horas lleva']);
    else if (v.ay==='No está en ayunas' || v.ay==='Menos de 8 horas') a.push(['bad','clock',`Pide ayuno y dijo: ${v.ay.toLowerCase()}. Se anota en el informe`]);
    else a.push(['ok','clock',`Ayuno: ${v.ay.toLowerCase()}`]); }
  if (p.ant.includes('Diabetes')) a.push(['info','flask','Diabético']);
  return a;
}
const alertsH = (p, v, needAy) => { const a = alertsOf(p, v, needAy); return a.length ? `<div class="alertas">${a.map(([c,i,t])=>`<span class="al ${c}">${ic(i)}<span>${t}</span></span>`).join('')}</div>` : ''; };

V.pacientes = () => {
  const p = patBy(S.pat), os = ORD.filter(o=>o.pat===p.id), h = HIST[p.id]||{}, keys = Object.keys(h);
  const visits = x => (HIST[x.id] ? Math.max(...Object.values(HIST[x.id]).map(a=>a.length)) : 0) + ORD.filter(o=>o.pat===x.id).length;
  const charts = keys.slice(0,2).map(k => { let pr; EX.forEach(e=>e.ps.forEach(x=>{ if (x.k===k) pr = x; }));
    const pts = h[k].map(([dt,v])=>[dt.slice(0,5)+'-'+dt.slice(8), v, !!flagOf(pr,v,p.s)]);
    const cur = os.find(o=>o.res[k]!==undefined && o.st!=='En proceso'); if (cur) pts.push(['Hoy', cur.res[k], !!flagOf(pr,cur.res[k],p.s)]);
    return `<div style="display:grid;gap:4px"><b>${pr.n} <span class="small muted">(${pr.u} · franja verde = referencia)</span></b>${spark(pts, refOf(pr,p.s), pr.d||0, pr.u)}</div>`; }).join('');
  const old = [...new Set(keys.flatMap(k=>h[k].map(x=>x[0])))].sort((a,b)=>b.split('-').reverse().join().localeCompare(a.split('-').reverse().join()));
  return `<p class="lead">La ficha se llena una sola vez y se actualiza cuando el paciente vuelve. Sus resultados quedan guardados y el bioanalista ve cómo van cambiando de una visita a otra.</p>
  <section class="panel"><div class="hd"><h2>Pacientes</h2><span class="small muted">${PATS.length} registrados · toca uno para ver su ficha</span></div><div class="bd flush tbl-wrap"><table><thead><tr><th>Cédula</th><th>Nombre</th><th class="r">Edad</th><th>Sexo</th><th>Teléfono</th><th>Municipio</th><th>Seguro</th><th class="r">Visitas</th><th>Hoy</th></tr></thead>
    <tbody>${PATS.map(x=>{ const o = ORD.find(y=>y.pat===x.id);
      return `<tr data-act="patsel" data-p="${x.id}" style="cursor:pointer${x.id===S.pat?';background:var(--acento-suave)':''}"><td class="num">${x.ci}</td><td><b>${x.n}</b>${x.alerg?' <span class="flag h">Alergia</span>':''}</td><td class="r">${ageOf(x.b)}</td><td>${x.s}</td><td class="num">${x.tel}</td><td>${x.mun}</td><td class="small">${x.seg.replace(' (convenio)','')}</td><td class="r">${visits(x)}</td><td>${o?stPill(o.st):''}</td></tr>`; }).join('')}</tbody></table></div></section>
  <div class="grid g-dash">
    <div class="grid" style="gap:20px;align-content:start">
      <section class="panel"><div class="hd"><h2>Ficha de ${p.n}</h2></div><div class="bd">${S.pform && S.pform.id===p.id ? patForm(S.pform.d, true) : patCard(p, false)}</div></section>
      <section class="panel"><div class="hd"><h2>Evolución</h2></div><div class="bd" style="display:grid;gap:18px">${charts || '<p class="muted">La gráfica aparece desde la segunda visita.</p>'}</div></section>
    </div>
    <section class="panel"><div class="hd"><h2>Historial de visitas</h2><span class="small muted">${p.ci}</span></div><div class="bd flush list">
      ${os.map(o=>`<div class="it"><div class="t"><b>${HOY} · ${o.n}</b><span class="small muted">${itemsTxt(o)}${o.vis.dx?' · '+o.vis.dx:''}</span></div>${stPill(o.st)}</div>`).join('')}
      ${old.map(dt=>`<div class="it"><div class="t"><b>${dt}</b><span class="small muted">${keys.filter(k=>h[k].some(x=>x[0]===dt)).map(k=>{let n;EX.forEach(e=>e.ps.forEach(x=>{if(x.k===k)n=x.n;}));return n;}).join(' · ')}</span></div><span class="pill">${ic('check')}Entregado</span></div>`).join('')}
      ${!os.length && !old.length ? '<div class="it"><span class="muted">Sin visitas todavía.</span></div>' : ''}
    </div></section>
  </div>`;
};

/* ---------- Resumen del día: lo que dicen los datos del paciente ---------- */
const _dash = V.dashboard;
V.dashboard = () => { const h = _dash(); if (S.role!=='Dueño') return h;
  const by = f => { const m = {}; ORD.forEach(o=>{ const k = f(patBy(o.pat)) || 'Sin dato'; m[k] = (m[k]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const bars = rows => { const mx = rows[0][1]; return rows.map(([k,v])=>`<div class="hbar"><span>${k}</span><div class="trk"><div class="fill" style="width:${v/mx*100}%"></div></div><span class="val">${v} ${v===1?'paciente':'pacientes'}</span></div>`).join(''); };
  return h + `<div class="grid g2"><section class="panel"><div class="hd"><h2>De dónde vienen los pacientes</h2><span class="small muted">Hoy, por municipio</span></div><div class="bd hbars">${bars(by(p=>p.mun))}</div></section>
    <section class="panel"><div class="hd"><h2>Cómo supieron de nosotros</h2><span class="small muted">Sirve para saber dónde anunciarse</span></div><div class="bd hbars">${bars(by(p=>p.orig))}</div></section></div>`; };

/* ---------- Eventos de la ficha y la visita ---------- */
const curDraft = () => S.view==='pacientes' ? (S.pform && S.pform.d) : S.ord.draft;
const normCi = s => String(s).replace(/^[VE]-?/i,'').replace(/\./g,'');
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a==='pbuscar'){
    const raw = ($('#ci').value||'').trim(), [main, suf] = raw.split('-'), dg = (main||'').replace(/\D/g,'');
    if (!dg) { toast('Escribe la cédula'); $('#ci').focus(); return; }
    const ci = $('#doct').value + '-' + dg.replace(/\B(?=(\d{3})+(?!\d))/g,'.') + (suf && suf.replace(/\D/g,'') ? '-'+suf.replace(/\D/g,'') : '');
    const p = PATS.find(x=>normCi(x.ci)===normCi(ci));
    if (p) { S.ord.pat = p.id; S.ord.draft = null; toast(`${p.n} ya es paciente: confirma sus datos`); }
    else { S.ord.draft = blankDraft(ci); S.ord.edit = null; }
    rerenderRec(); const f = $('#pf-nom') || $('#vis-ay'); f && f.focus(); return;
  }
  if (a==='pedit'){ S.ord.draft = draftFrom(patBy(S.ord.pat)); S.ord.edit = S.ord.pat; rerenderRec(); return; }
  if (a==='pedit2'){ S.pform = {id:b.dataset.p, d:draftFrom(patBy(b.dataset.p))}; render(); return; }
  if (a==='pcancel'){ if (S.view==='pacientes') { S.pform = null; render(); } else { S.ord.draft = null; S.ord.edit = null; rerenderRec(); } return; }
  if (a==='patclear'){ S.ord.draft = null; S.ord.edit = null; S.ord.items = []; S.ord.med = 0; S.ord.urg = false; S.ord.vis = blankVis(); return; }
  if (a==='patsel'){ S.pform = null; return; }
  if (a==='psave'){
    const inPac = S.view==='pacientes', d = curDraft(), id = inPac ? S.pform.id : S.ord.edit;
    const miss = []; if (!d.ci.trim()) miss.push('cédula'); if (!d.nom.trim()) miss.push('nombres'); if (!d.ape.trim()) miss.push('apellidos'); if (!d.s) miss.push('sexo'); if (!d.b) miss.push('fecha de nacimiento'); if (!d.tel.trim()) miss.push('teléfono');
    if (d.b && ageOf(d.b) < 18 && (!d.repN.trim() || !d.repTel.trim())) miss.push('representante con teléfono (es menor de edad)');
    if (miss.length) { toast('Falta: ' + miss.join(', ')); return; }
    const t = s => String(s||'').trim();
    const data = {ci:t(d.ci), nom:t(d.nom), ape:t(d.ape), n:t(d.nom)+' '+t(d.ape), s:d.s, b:d.b, tel:t(d.tel), tel2:t(d.tel2), mail:t(d.mail), dir:t(d.dir), sector:t(d.sector), mun:d.mun, ocup:t(d.ocup), sangre:d.sangre, ant:[...d.ant], meds:t(d.meds), alerg:/^ningun/i.test(t(d.alerg))?'':t(d.alerg),
      emer: t(d.emer) ? {n:t(d.emer), par:t(d.emerPar)||'—', tel:t(d.emerTel)||'—'} : null, rep: t(d.repN) ? {n:t(d.repN), ci:t(d.repCi)||'—', par:t(d.repPar)||'Representante', tel:t(d.repTel)} : null, seg:d.seg, orig:d.orig};
    if (id) { Object.assign(patBy(id), data); toast('Ficha actualizada'); }
    else { const nid = 'P' + (PATS.length+1); PATS.push(Object.assign({id:nid, alta:HOY}, data)); S.ord.pat = nid; toast(`${data.n} quedó registrado. La próxima vez aparece con solo poner la cédula`); }
    if (inPac) { S.pform = null; render(); } else { S.ord.draft = null; S.ord.edit = null; rerenderRec(); const f = $('#vis-ay'); f && f.focus(); }
    return;
  }
});
function refreshOrd(){ const ob = $('#ordbox'); if (ob) { ob.innerHTML = ordBox(); stampFolios(); } }
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.pf !== undefined) { const d = curDraft(); if (d) d[t.dataset.pf] = t.value; }
  if (t.dataset.vis !== undefined) S.ord.vis[t.dataset.vis] = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pf !== undefined) { const d = curDraft(); if (d) d[t.dataset.pf] = t.value; }
  if (t.dataset.pfa !== undefined) { const d = curDraft(); if (!d) return; const k = t.dataset.pfa; d.ant = t.checked ? [...new Set([...d.ant, k])] : d.ant.filter(x=>x!==k); }
  if (t.dataset.vis !== undefined) { S.ord.vis[t.dataset.vis] = t.value; refreshOrd(); }
  if (t.id==='med') { S.ord.med = +t.value; refreshOrd(); }
  if (t.id==='urg') S.ord.urg = t.checked;
});
/* ======================= Arranque y eventos ======================= */
function render(){
  $('#app').innerHTML = S.view==='login' ? V.login() : shell(V[S.view]());
  if (S.view!=='login') stampFolios();
}
function openModal(html){ const m = $('#modal'); m.innerHTML = html; m.hidden = false; const f = m.querySelector('button,input'); f && f.focus(); }
function closeModal(){ const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
let tt; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>t.hidden = true, 2800); }
function go(v){ if (v!=='login' && !can(v)) { toast('Tu usuario no tiene acceso a esa sección'); v = HOME[S.role]; } S.view = v; S.sidebar = false; render(); window.scrollTo(0,0); }
const nextN = () => 'L-' + String(Math.max(...ORD.map(o=>+o.n.slice(2)))+1).padStart(4,'0');
function waModal(o){ const p = patBy(o.pat);
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wt" style="max-width:460px"><div class="hd"><h2 id="wt">Enviar por WhatsApp</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>
  <div class="bd"><p class="small muted">Para ${p.n} · ${p.tel}</p>
    <div class="wa"><b>Azullab Laboratorio</b><span>Hola ${p.n.split(' ')[0]}, sus resultados de la orden ${o.n} ya están listos y firmados por la bioanalista. Le enviamos el PDF. Puede verificarlo con el código QR. Cualquier duda, estamos a la orden.</span><span class="small">📄 Informe ${o.n}.pdf</span></div>
    <button class="btn primary big" data-act="wasend" data-o="${o.n}">${ic('wa')}${S.online?'Enviar':'Dejar en cola hasta que vuelva internet'}</button></div></div>`; }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (S.sidebar && !e.target.closest('.side')) { S.sidebar=false; render(); } if (e.target.id==='modal') closeModal(); return; }
  const a = b.dataset.act, o = b.dataset.o ? ordBy(b.dataset.o) : null;
  if (b.tagName==='A') e.preventDefault();
  switch(a){
    case 'nav': go(b.dataset.v); break;
    case 'role': S.role = b.dataset.r; S.user = ROLES[S.role].user; render(); break;
    case 'logout': go('login'); break;
    case 'menu': S.sidebar = !S.sidebar; render(); break;
    case 'net': S.online = !S.online;
      if (S.online){ const n = S.queue.length; S.queue = []; toast(n?`Conexión restablecida · ${n} ${n===1?'orden respaldada':'órdenes respaldadas'} y facturas de contingencia reportadas`:'Conexión restablecida'); }
      else toast('Sin internet: el laboratorio sigue trabajando');
      render(); break;
    case 'open': openOrder(b.dataset.o); break;
    case 'buscar': { const v = ($('#ci').value||'').replace(/\D/g,''); if (!v) { toast('Escribe la cédula'); break; }
      const p = PATS.find(x=>x.ci.replace(/\D/g,'')===v);
      if (p) { S.ord.pat = p.id; S.ord.newPat = null; toast(`${p.n} encontrado`); }
      else { S.ord.newPat = {ci:'V-'+v.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}; }
      rerenderRec(); const n = $('#np-n'); n && n.focus(); break; }
    case 'patclear': S.ord.pat = null; S.ord.newPat = null; rerenderRec(); break;
    case 'np-save': { const n = ($('#np-n').value||'').trim(); if (!n) { toast('Escribe el nombre del paciente'); $('#np-n').focus(); break; }
      const id = 'P'+(PATS.length+1); PATS.push({id, ci:S.ord.newPat.ci, n, s:$('#np-s').value, b:$('#np-b').value||'1990-01-01', tel:($('#np-t').value||'').trim()||'—'});
      S.ord.pat = id; S.ord.newPat = null; rerenderRec(); toast(`${n} quedó registrado`); break; }
    case 'addperf': { const c = b.dataset.c; if (S.ord.items.some(it=>it.k==='perf'&&it.c===c)) { toast('Ese perfil ya está en la orden'); break; }
      const pf = perfBy(c), before = S.ord.items.length; S.ord.items = S.ord.items.filter(it=>!(it.k==='ex' && pf.ex.includes(it.c)));
      S.ord.items.push({k:'perf', c}); if (S.ord.items.length-1 < before) toast('Quité los exámenes sueltos que ya vienen en el perfil');
      rerenderRec(); break; }
    case 'addex': { const c = b.dataset.c; if (inOrder(c)) { toast('Ese examen ya está en la orden'); break; } S.ord.items.push({k:'ex', c}); rerenderRec(); break; }
    case 'rmit': S.ord.items.splice(+b.dataset.i,1); rerenderRec(); break;
    case 'area': S.area = b.dataset.c; document.querySelectorAll('.cats button').forEach(x=>x.classList.toggle('on', x.dataset.c===S.area)); $('#exgrid').innerHTML = exGrid(); break;
    case 'cobrar': S.pay = null; openModal(payModal()); break;
    case 'pm': S.pay = b.dataset.k; openModal(payModal()); break;
    case 'emit': { const fac = String(S.inv).padStart(8,'0'); const cont = !S.online; const ce = $('#contnum');
      const no = {n:nextN(), pat:S.ord.pat, items:S.ord.items.slice(), st:'Por tomar', t:nowT(), med:+S.ord.med, urg:S.ord.urg, vis:{...S.ord.vis}, by:S.user, pay:S.pay, usd:ordTotal(), fac, ctrl: cont ? ((ce&&ce.value.trim())||'00-'+String(S.cont).padStart(7,'0')) : '00-'+fac, cont, res:{}};
      if (cont) { S.cont++; S.queue.push(no.n); }
      ORD.push(no); S.inv++; S.ord = newOrd(); S.q = '';
      render(); openModal(ticketModal(no)); break; }
    case 'close': closeModal(); break;
    case 'etq': openModal(`<div class="sheet" style="max-width:520px"><div class="hd"><h2>Etiquetas de ${o.n}</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="bd">${etiquetas(o)}<button class="btn primary" data-act="toast" data-m="Etiquetas enviadas a la impresora">${ic('printer')}Imprimir</button></div></div>`); break;
    case 'tomada': o.st = 'En proceso'; o.toma = nowT(); toast(`Muestras de ${patBy(o.pat).n} tomadas: pasan al área técnica`); render(); break;
    case 'pick': S.sel[b.dataset.v] = b.dataset.o; render(); break;
    case 'demofill': exOf(o).forEach(c=>exBy(c).ps.forEach(p=>{ if (o.res[p.k]===undefined||o.res[p.k]==='') o.res[p.k] = DEMO[p.k]; })); render(); toast('Valores de muestra cargados: revisa las marcas'); break;
    case 'tovalid': { const miss = paramsOf(o).length - filledOf(o); if (miss) { toast(`Faltan ${miss} ${miss===1?'valor':'valores'} por cargar`); break; }
      o.st = 'Por validar'; S.sel.validacion = o.n; toast(`${o.n} enviada a validación${critOf(o).length?' · tiene valor crítico':''}`); render(); break; }
    case 'aviso': o.aviso = {to: o.med ? medTxt(o.med) : 'El paciente', t: nowT(), by: S.role==='Bioanalista' ? S.user : BIO}; toast('Aviso registrado en la orden'); render(); break;
    case 'repetir': o.st = 'En proceso'; S.sel.resultados = o.n; toast(`${o.n} devuelta: se repite la prueba`); render(); break;
    case 'validar': o.st = 'Validado'; o.val = {by:BIO, t:nowT()}; S.sel.entrega = o.n; render();
      openModal(`<div class="sheet" style="max-width:420px"><div class="hd"><h2>${o.n} firmada</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="bd" style="justify-items:center;text-align:center"><span class="sello verde grande estampar">Validado<small>${BIO} · ${o.val.t}</small></span><p>El informe de ${patBy(o.pat).n} ya puede entregarse. Atención lo ve en Entrega de resultados.</p><button class="btn primary" data-act="close">Listo</button></div></div>`); break;
    case 'print': window.print(); break;
    case 'wa': openModal(waModal(o)); break;
    case 'wasend': closeModal(); if (!S.online) { toast('En cola: sale apenas vuelva el internet'); break; }
      if (o.st==='Validado') { o.st = 'Entregado'; o.ent = nowT()+' · WhatsApp'; } toast(`Informe enviado a ${patBy(o.pat).tel}`); render(); break;
    case 'entregar': o.st = 'Entregado'; o.ent = nowT()+' · en mano'; toast('Marcado como entregado'); render(); break;
    case 'patsel': S.pat = b.dataset.p; render(); break;
    case 'cierre': openModal(`<div class="sheet" style="max-width:440px"><div class="hd"><h2>Cierre de caja</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="bd"><div class="printer"></div><div class="tkwrap"><pre class="ticket printing">${cierreText()}</pre><span class="sello tk-sello estampar">Caja cerrada<small>${HOY} · 18:00</small></span></div><button class="btn" data-act="close">Listo</button></div></div>`); break;
    case 'toast': toast(b.dataset.m); break;
  }
});
function updFlag(el){
  const k = el.dataset.res, o = ordBy(S.sel.resultados); if (!o) return;
  let pr; EX.forEach(x=>x.ps.forEach(p=>{ if (p.k===k) pr = p; }));
  const v = pr.t==='txt' ? el.value : parseVE(el.value);
  if (el.value==='' || (pr.t!=='txt' && isNaN(v))) delete o.res[k]; else o.res[k] = v;
  const f = flagOf(pr, o.res[k], patBy(o.pat).s);
  el.classList.remove('h','l'); if (f) el.classList.add(f==='L'||f==='CL'?'l':'h');
  const c = document.getElementById('f-'+k); if (c) c.innerHTML = flagH(f);
  const pg = $('#prog'); if (pg) pg.textContent = `${filledOf(o)} de ${paramsOf(o).length} valores`;
}
document.addEventListener('input', e => {
  if (e.target.id==='q'){ S.q = e.target.value; $('#exgrid').innerHTML = exGrid(); }
  if (e.target.dataset.res!==undefined) updFlag(e.target);
});
document.addEventListener('change', e => {
  if (e.target.id==='med') S.ord.med = +e.target.value;
  if (e.target.id==='urg') S.ord.urg = e.target.checked;
  if (e.target.dataset.res!==undefined && e.target.tagName==='SELECT') updFlag(e.target);
});
document.addEventListener('submit', e => { if (e.target.id==='loginForm'){ e.preventDefault(); go(HOME[S.role]); if (!S.online) toast(`Sesión abierta sin internet con PIN · ${S.user}`); } });
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#modal').hidden) closeModal(); if (e.key==='Enter' && e.target.id==='ci'){ e.preventDefault(); document.querySelector('[data-act="buscar"]').click(); } });
(function init(){
  const h = (location.hash||'').slice(1);
  if (h && V[h] && h!=='login') S.view = h;
  render();
})();

</script>
</body></html>
